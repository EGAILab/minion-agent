name: aborted-assistant-excluded-from-replay
pi_revision: b7bb00b936dbe21b8e160b3e89efdec361846699
authority: 2026-08-20-minion-agent-design.md
notes: 'Same exclusion rule as errored-assistant-excluded-from-replay.yaml, for stop_reason=aborted
  -- Pi checks both reasons in one condition, not two separate rules (AI-025). Only
  these two stop reasons exclude; test_only_error_and_aborted_are_excluded_not_other_stop_reasons
  in tests/llm/test_transform_messages.py pins the negative cases (pending/stop/length/tool_use/
  deferred) this single canonical scenario cannot efficiently enumerate.

  '
transform:
  messages:
  - role: assistant
    content:
    - type: text
      text: cancelled mid-thought
    provider: p
    api: a
    model: m1
    stop_reason: aborted
    timestamp: 1
    usage:
      input: 0
      output: 0
      cache_read: 0
      cache_write: 0
      total_tokens: 0
      cost:
        input: 0
        output: 0
        cache_read: 0
        cache_write: 0
        total: 0
  - role: user
    content:
    - type: text
      text: try again
    timestamp: 2
  target:
    provider: p
    api: a
    model_id: m1
    supports_images: false
expect:
  messages:
  - role: user
    content:
    - type: text
      text: try again
      text_signature: null
    timestamp: 2

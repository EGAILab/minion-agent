name: after-hook-failure-replaces-result-with-tool-error
description: >
  Pinned Pi's `finalizeExecutedToolCall` (`packages/agent/src/agent-loop.ts`, Layer 06,
  TOOL-017): when the after-hook itself throws, the ENTIRE prior result is discarded and replaced
  with a plain error result -- not merged, not partially preserved. A successful `execute()`
  whose after-hook then fails must not leak any trace of that earlier success into the final
  tool-result message.
provider_script:
  - content: [{ type: tool_call, id: t1, name: succeeds, arguments: {} }]
    stop_reason: tool_use
  - content: [{ type: text, text: done }]
    stop_reason: stop
tools:
  succeeds: { result: { text: this success must not survive } }
listeners:
  - event: tools/post-execute
    action: raise
    message: annotation service unavailable
steps:
  - followup: go
  - await_idle: true
expect_messages:
  - { role: user, text: go }
  - { role: assistant, text: "" }
  - { role: tool_result, text: "RuntimeError: annotation service unavailable" }
  - { role: assistant, text: done }

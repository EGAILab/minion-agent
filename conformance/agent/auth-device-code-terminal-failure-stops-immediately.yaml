name: auth-device-code-terminal-failure-stops-immediately
family: agent
authority: 2026-08-20-minion-agent-design.md
pi_revision: b7bb00b936dbe21b8e160b3e89efdec361846699
notes: >
  A terminal protocol error (e.g. access_denied) is not retryable: polling stops on the very
  poll that reports it, never sleeping or attempting another poll first.
auth_device_code:
  poll_sequence:
    - failed: { message: access_denied }
expect:
  poll_count: 1
  error: { type: failed, message_contains: access_denied }

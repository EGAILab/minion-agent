name: builtin-ls-missing-path-and-broken-link-path-not-found
family: agent
authority: minion-agent-docs spec/tools.md WP-13.1 (master f46051fb)
pi_revision: b7bb00b936dbe21b8e160b3e89efdec361846699
requirements:
- TOOL-028
witnesses:
- ls_missing_path_and_broken_link_path_not_found
notes: 'A missing path and a path that is a broken symlink both report Pi''s ''Path not found: <path>''
  with the resolved absolute path.'
builtin_tool:
  tool: ls
  fixture:
  - path: dangling
    symlink: missing-target
  cases:
  - id: missing
    arguments:
      path: nope
    expect:
      is_error: true
      text: 'Path not found: {abs:nope}'
      details: {}
  - id: broken-link
    arguments:
      path: dangling
    expect:
      is_error: true
      text: 'Path not found: {abs:dangling}'
      details: {}

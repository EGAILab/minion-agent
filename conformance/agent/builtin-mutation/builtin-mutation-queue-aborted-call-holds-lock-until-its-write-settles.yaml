name: "builtin-mutation-queue-aborted-call-holds-lock-until-its-write-settles"
family: "agent"
authority: "minion-agent-docs spec/tools.md WP-13.2 (minion-agent#49); pinned Pi write.ts/edit.ts/file-mutation-queue.ts"
pi_revision: "b7bb00b936dbe21b8e160b3e89efdec361846699"
requirements:
  - "TOOL-032"
  - "TOOL-033"
witnesses:
  - "queue_abort_keeps_lock_until_inflight_settles"
notes: "A is aborted while its write_file is in flight: the lock is held until that write settles, then A answers 'Operation aborted' and B starts. Negative control: releasing from an abort listener lets B start early. Ordering authority: queue_authority.json scenario 'same-key-waits-and-is-released-after-an-error' (pinned Pi file-mutation-queue.ts, unmodified, Node 22.15.1)."
builtin_mutation:
  fixture:
    - path: "f.txt"
      file:
        text: "original\n"
  queue:
    calls:
      - id: "A"
        tool: "write"
        arguments:
          path: "f.txt"
          content: "A"
      - id: "B"
        tool: "write"
        arguments:
          path: "./f.txt"
          content: "B"
    gates:
      - id: "a-write"
        operation: "write_file"
        path: "f.txt"
    steps:
      - abort: "A"
      - release: "a-write"
    expect:
      results:
        A:
          is_error: true
          text: "Operation aborted"
          details: {}
        B:
          is_error: false
          text: "Successfully wrote 1 bytes to ./f.txt"
      order:
        -
          - "p write_file f.txt #1 ok"
          - "p absolute_path ./f.txt #1 start"
        -
          - "p write_file f.txt #1 ok"
          - "result A"
      files_after:
        - path: "f.txt"
          text: "B"

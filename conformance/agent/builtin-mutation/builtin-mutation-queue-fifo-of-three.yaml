name: "builtin-mutation-queue-fifo-of-three"
family: "agent"
authority: "minion-agent-docs spec/tools.md WP-13.2 (minion-agent#49); pinned Pi write.ts/edit.ts/file-mutation-queue.ts"
pi_revision: "b7bb00b936dbe21b8e160b3e89efdec361846699"
requirements:
  - "TOOL-032"
witnesses:
  - "queue_fifo_per_key"
notes: "Three calls for one target run strictly in call order, each after the previous one's write settled. Ordering authority: queue_authority.json scenario 'fifo-of-three-on-one-key' (pinned Pi file-mutation-queue.ts, unmodified, Node 22.15.1)."
builtin_mutation:
  fixture:
    - path: "f.txt"
      file:
        text: "original\n"
    - path: "sub"
      dir: true
  queue:
    calls:
      - id: "A"
        tool: "write"
        arguments:
          path: "f.txt"
          content: "A"
      - id: "B"
        tool: "write"
        arguments:
          path: "./f.txt"
          content: "B"
      - id: "C"
        tool: "write"
        arguments:
          path: "sub/../f.txt"
          content: "C"
    gates:
      - id: "a-write"
        operation: "write_file"
        path: "f.txt"
      - id: "b-write"
        operation: "write_file"
        path: "./f.txt"
    steps:
      - release: "a-write"
      - release: "b-write"
    expect:
      results:
        A:
          is_error: false
          text: "Successfully wrote 1 bytes to f.txt"
        B:
          is_error: false
          text: "Successfully wrote 1 bytes to ./f.txt"
        C:
          is_error: false
          text: "Successfully wrote 1 bytes to sub/../f.txt"
      order:
        -
          - "p write_file f.txt #1 ok"
          - "p absolute_path ./f.txt #1 start"
        -
          - "p write_file ./f.txt #1 ok"
          - "p absolute_path sub/../f.txt #1 start"
        -
          - "result A"
          - "p write_file ./f.txt #1 ok"
      logged:
        - "result C"
      files_after:
        - path: "f.txt"
          text: "C"

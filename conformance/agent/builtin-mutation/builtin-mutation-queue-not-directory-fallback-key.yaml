name: "builtin-mutation-queue-not-directory-fallback-key"
family: "agent"
authority: "minion-agent-docs spec/tools.md WP-13.2 (minion-agent#49); pinned Pi write.ts/edit.ts/file-mutation-queue.ts"
pi_revision: "b7bb00b936dbe21b8e160b3e89efdec361846699"
requirements:
  - "TOOL-032"
witnesses:
  - "queue_not_directory_fallback_key"
notes: "Key derivation falls back on not_directory too ('notes.txt/child.md' under a regular file) -- NOT Layer 12's resolve(), whose fallback set omits not_directory (minion-agent#78). Both calls register, serialize on the fallback key, and fail at their own parent-create site. Negative control: a resolve()-based key fails registration ('Cannot resolve ...') instead. Ordering authority: queue_authority.json scenario 'enotdir-fallback-key-serializes' (pinned Pi file-mutation-queue.ts, unmodified, Node 22.15.1)."
builtin_mutation:
  fixture:
    - path: "notes.txt"
      file:
        text: "a file\n"
  queue:
    calls:
      - id: "A"
        tool: "write"
        arguments:
          path: "notes.txt/child.md"
          content: "A"
      - id: "B"
        tool: "write"
        arguments:
          path: "./notes.txt/child.md"
          content: "B"
    gates:
      - id: "a-mkdir"
        operation: "create_dir"
        path: "notes.txt"
      - id: "b-mkdir"
        operation: "create_dir"
        path: "notes.txt"
        occurrence: 2
    steps:
      - release: "a-mkdir"
        error: "not_directory"
      - release: "b-mkdir"
        error: "not_directory"
    expect:
      results:
        A:
          is_error: true
          text: "Cannot create parent directory of notes.txt/child.md: not a directory"
          details: {}
        B:
          is_error: true
          text: "Cannot create parent directory of ./notes.txt/child.md: not a directory"
          details: {}
      order:
        -
          - "p create_dir notes.txt #1 not_directory"
          - "p absolute_path ./notes.txt/child.md #2 start"
      logged:
        - "p canonical_path notes.txt/child.md #1 not_directory"
        - "p canonical_path ./notes.txt/child.md #1 not_directory"
  provider:
    canonical_path:
      - path: "notes.txt/child.md"
        error: "not_directory"
      - path: "./notes.txt/child.md"
        error: "not_directory"

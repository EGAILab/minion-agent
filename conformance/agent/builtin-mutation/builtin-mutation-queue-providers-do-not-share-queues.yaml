name: "builtin-mutation-queue-providers-do-not-share-queues"
family: "agent"
authority: "minion-agent-docs spec/tools.md WP-13.2 (minion-agent#49); pinned Pi write.ts/edit.ts/file-mutation-queue.ts"
pi_revision: "b7bb00b936dbe21b8e160b3e89efdec361846699"
requirements:
  - "TOOL-032"
witnesses:
  - "queue_scoped_per_provider"
notes: "MINION_ARCHITECTURAL_MAPPING: queues are keyed by (ctx.fs instance, key). Two provider instances over the same root, same target: B (provider q) completes while A (provider p) is held. Negative control: a global key without provider scoping serializes B behind A. Ordering authority: queue_authority.json scenario 'different-keys-run-concurrently' (pinned Pi file-mutation-queue.ts, unmodified, Node 22.15.1)."
builtin_mutation:
  fixture:
    - path: "f.txt"
      file:
        text: "original\n"
  queue:
    providers:
      - "p"
      - "q"
    calls:
      - id: "A"
        tool: "write"
        provider: "p"
        arguments:
          path: "f.txt"
          content: "A"
      - id: "B"
        tool: "write"
        provider: "q"
        arguments:
          path: "f.txt"
          content: "B"
    gates:
      - id: "a-write"
        provider: "p"
        operation: "write_file"
        path: "f.txt"
    steps:
      - release: "a-write"
    expect:
      results:
        A:
          is_error: false
          text: "Successfully wrote 1 bytes to f.txt"
        B:
          is_error: false
          text: "Successfully wrote 1 bytes to f.txt"
      order:
        -
          - "result B"
          - "p write_file f.txt #1 ok"
      files_after:
        - path: "f.txt"
          text: "A"

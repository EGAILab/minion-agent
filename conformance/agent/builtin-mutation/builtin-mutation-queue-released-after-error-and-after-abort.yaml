name: "builtin-mutation-queue-released-after-error-and-after-abort"
family: "agent"
authority: "minion-agent-docs spec/tools.md WP-13.2 (minion-agent#49); pinned Pi write.ts/edit.ts/file-mutation-queue.ts"
pi_revision: "b7bb00b936dbe21b8e160b3e89efdec361846699"
requirements:
  - "TOOL-032"
  - "TOOL-033"
witnesses:
  - "queue_release_after_error_and_abort"
notes: "A's write fails (scripted) and B's call is pre-aborted; each releases its entry, so the next call for the same target runs. A pre-aborted call still registers and answers only after acquiring the lock. Ordering authority: queue_authority.json scenario 'same-key-waits-and-is-released-after-an-error' (pinned Pi file-mutation-queue.ts, unmodified, Node 22.15.1)."
builtin_mutation:
  fixture:
    - path: "f.txt"
      file:
        text: "original\n"
    - path: "sub"
      dir: true
  queue:
    calls:
      - id: "A"
        tool: "write"
        arguments:
          path: "f.txt"
          content: "A"
      - id: "B"
        tool: "write"
        signal: "pre_aborted"
        arguments:
          path: "./f.txt"
          content: "B"
      - id: "C"
        tool: "write"
        arguments:
          path: "sub/../f.txt"
          content: "C"
    gates:
      - id: "a-write"
        operation: "write_file"
        path: "f.txt"
    steps:
      - release: "a-write"
        error: "permission_denied"
    expect:
      results:
        A:
          is_error: true
          text: "Cannot write f.txt: permission denied"
          details: {}
        B:
          is_error: true
          text: "Operation aborted"
          details: {}
        C:
          is_error: false
          text: "Successfully wrote 1 bytes to sub/../f.txt"
      order:
        -
          - "p canonical_path ./f.txt #1 ok"
          - "result A"
        -
          - "p write_file f.txt #1 permission_denied"
          - "p absolute_path sub/../f.txt #1 start"
      never:
        - "p absolute_path ./f.txt #1 start"
      files_after:
        - path: "f.txt"
          text: "C"

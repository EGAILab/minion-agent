name: "builtin-mutation-queue-same-target-registers-in-call-order"
family: "agent"
authority: "minion-agent-docs spec/tools.md WP-13.2 (minion-agent#49); pinned Pi write.ts/edit.ts/file-mutation-queue.ts"
pi_revision: "b7bb00b936dbe21b8e160b3e89efdec361846699"
requirements:
  - "TOOL-032"
witnesses:
  - "queue_same_target_registration_in_call_order"
notes: "L13-WP132-R001: write A then write B for the same target (A 'f.txt', B './f.txt'), only A's provider calls delayed. B's canonical_path is not invoked before A's registration settles, and A's write completes before B's. Negative control: awaiting absolute_path before registration lets B register first. Ordering authority: queue_authority.json scenario 'same-target-registration-in-call-order' (pinned Pi file-mutation-queue.ts, unmodified, Node 22.15.1)."
builtin_mutation:
  fixture:
    - path: "f.txt"
      file:
        text: "original\n"
  queue:
    calls:
      - id: "A"
        tool: "write"
        arguments:
          path: "f.txt"
          content: "A"
      - id: "B"
        tool: "write"
        arguments:
          path: "./f.txt"
          content: "B"
    gates:
      - id: "a-key"
        operation: "canonical_path"
        path: "f.txt"
      - id: "a-abs"
        operation: "absolute_path"
        path: "f.txt"
      - id: "a-write"
        operation: "write_file"
        path: "f.txt"
    steps:
      - release: "a-key"
      - release: "a-abs"
      - release: "a-write"
    expect:
      results:
        A:
          is_error: false
          text: "Successfully wrote 1 bytes to f.txt"
        B:
          is_error: false
          text: "Successfully wrote 1 bytes to ./f.txt"
      order:
        -
          - "p canonical_path f.txt #1 ok"
          - "p canonical_path ./f.txt #1 start"
        -
          - "p write_file f.txt #1 ok"
          - "p absolute_path ./f.txt #1 start"
        -
          - "p write_file f.txt #1 ok"
          - "p write_file ./f.txt #1 start"
      logged:
        - "p write_file ./f.txt #1 ok"
      files_after:
        - path: "f.txt"
          text: "B"

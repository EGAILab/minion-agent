name: "builtin-mutation-queue-symlink-and-target-share-one-queue"
family: "agent"
authority: "minion-agent-docs spec/tools.md WP-13.2 (minion-agent#49); pinned Pi write.ts/edit.ts/file-mutation-queue.ts"
pi_revision: "b7bb00b936dbe21b8e160b3e89efdec361846699"
requirements:
  - "TOOL-032"
witnesses:
  - "queue_symlink_and_target_share"
notes: "The key is the canonical (symlink-resolved) path when the target exists: a write through a symlink and a write to its target serialize. Ordering authority: queue_authority.json scenario 'symlink-and-target-share-one-queue' (pinned Pi file-mutation-queue.ts, unmodified, Node 22.15.1)."
builtin_mutation:
  fixture:
    - path: "target.txt"
      file:
        text: "original\n"
    - path: "link.txt"
      symlink: "target.txt"
  queue:
    calls:
      - id: "A"
        tool: "write"
        arguments:
          path: "link.txt"
          content: "A"
      - id: "B"
        tool: "write"
        arguments:
          path: "target.txt"
          content: "B"
    gates:
      - id: "a-write"
        operation: "write_file"
        path: "link.txt"
    steps:
      - release: "a-write"
    expect:
      results:
        A:
          is_error: false
          text: "Successfully wrote 1 bytes to link.txt"
        B:
          is_error: false
          text: "Successfully wrote 1 bytes to target.txt"
      order:
        -
          - "p write_file link.txt #1 ok"
          - "p absolute_path target.txt #1 start"
      files_after:
        - path: "target.txt"
          text: "B"

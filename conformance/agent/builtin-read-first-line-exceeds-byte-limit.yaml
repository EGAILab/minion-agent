name: builtin-read-first-line-exceeds-byte-limit
family: agent
authority: minion-agent-docs spec/tools.md WP-13.1 (master f46051fb)
pi_revision: b7bb00b936dbe21b8e160b3e89efdec361846699
requirements:
- TOOL-025
witnesses:
- read_first_line_exceeds_byte_limit
notes: A selected first line over 50 KiB yields Pi's sed/head diagnostic (NOT empty content) and details.truncation.first_line_exceeds_limit
  = true. The diagnostic quotes the RAW path argument, not the resolved path (read.ts:300). A fractional
  offset makes read.ts:299 measure allLines[<fraction>] = undefined, and Node throws its own TypeError
  (IMPL-C010).
builtin_tool:
  tool: read
  fixture:
  - path: big.txt
    file:
      text: '

        tail

        '
  - path: second.txt
    file:
      text: 'head

        

        z'
  cases:
  - id: first-line-over-limit
    arguments:
      path: big.txt
    expect:
      is_error: false
      text: '[Line 1 is 50.0KB, exceeds 50.0KB limit. Use bash: sed -n ''1p'' big.txt | head -c 51200]'
      image: null
      details:
        truncation:
          truncated: true
          truncated_by: bytes
          total_lines: 2
          total_bytes: 51207
          first_line_exceeds_limit: true
  - id: raw-path-quoted
    arguments:
      path: ./big.txt
    expect:
      is_error: false
      text: '[Line 1 is 50.0KB, exceeds 50.0KB limit. Use bash: sed -n ''1p'' ./big.txt | head -c 51200]'
      image: null
      details:
        truncation:
          truncated: true
          truncated_by: bytes
          total_lines: 2
          total_bytes: 51207
          first_line_exceeds_limit: true
  - id: offset-selects-huge-line
    arguments:
      path: second.txt
      offset: 2
    expect:
      is_error: false
      text: '[Line 2 is 58.6KB, exceeds 50.0KB limit. Use bash: sed -n ''2p'' second.txt | head -c 51200]'
      image: null
      details:
        truncation:
          truncated: true
          truncated_by: bytes
          total_lines: 2
          total_bytes: 60002
          first_line_exceeds_limit: true
  - id: fractional-offset-undefined-line
    arguments:
      path: second.txt
      offset: 2.5
    expect:
      is_error: true
      text: The "string" argument must be of type string or an instance of Buffer or ArrayBuffer. Received
        undefined
      details: {}

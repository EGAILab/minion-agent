name: builtin-read-image-scale-hint-to-fixed-rounds-exact-binary-value
family: agent
authority: minion-agent-docs spec/tools.md WP-13.1 (master ed72c96f); pinned-Pi authority run of minion-agent#74
pi_revision: b7bb00b936dbe21b8e160b3e89efdec361846699
requirements:
- TOOL-025
witnesses:
- read_image_scale_hint_to_fixed_rounds_exact_binary_value
notes: 'Widths 2150, 2650 and 3050 resize to width 2000; the scale W/2000 is a decimal half-cent tie whose
  binary64 value lies just BELOW the tie, so ECMAScript toFixed(2) rounds DOWN: 1.07, 1.32, 1.52 (not
  1.08, 1.33, 1.53, which rounding binary64(scale * 100) would give). #74 item B.'
builtin_tool:
  tool: read
  fixture:
  - path: png_rgb_2150x4.png
    file:
      base64: 
  - path: png_rgb_2650x4.png
    file:
      base64: 
  - path: png_rgb_3050x4.png
    file:
      base64: 
  cases:
  - id: png_rgb_2150x4.png
    arguments:
      path: png_rgb_2150x4.png
    expect:
      is_error: false
      text: 'Read image file [image/png]

        [Image: original 2150x4, displayed at 2000x4. Multiply coordinates by 1.07 to map to original
        image.]'
      image:
        mime_type: image/png
        sha256: 7627bfd570fc2586682cd1c3aaf24570193850812f348714bdf3d39dfba217fa
        bytes: 28637
        base64_len: 38184
        canonical_base64: true
      details: {}
  - id: png_rgb_2650x4.png
    arguments:
      path: png_rgb_2650x4.png
    expect:
      is_error: false
      text: 'Read image file [image/png]

        [Image: original 2650x4, displayed at 2000x3. Multiply coordinates by 1.32 to map to original
        image.]'
      image:
        mime_type: image/png
        sha256: 95c4402558e8bcf83e6dba31beab343c54e23dedc174377f717b03340d7399bd
        bytes: 23814
        base64_len: 31752
        canonical_base64: true
      details: {}
  - id: png_rgb_3050x4.png
    arguments:
      path: png_rgb_3050x4.png
    expect:
      is_error: false
      text: 'Read image file [image/png]

        [Image: original 3050x4, displayed at 2000x3. Multiply coordinates by 1.52 to map to original
        image.]'
      image:
        mime_type: image/png
        sha256: 11bc63401b6e937b924087bac75f79d3cf9e8b0145e89cbf97f563368b487efc
        bytes: 24071

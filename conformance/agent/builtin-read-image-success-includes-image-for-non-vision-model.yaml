name: builtin-read-image-success-includes-image-for-non-vision-model
family: agent
authority: minion-agent-docs spec/tools.md WP-13.1 (master f46051fb)
pi_revision: b7bb00b936dbe21b8e160b3e89efdec361846699
requirements:
- TOOL-025
witnesses:
- read_image_success_includes_image_for_non_vision_model
notes: 'A model known NOT to accept images gets the non-vision note appended to the text AND the image
  block (never a substitution). A vision model, and a tool with no model knowledge (Pi: ctx.model undefined),
  get no note (IMPL-C001). Image bytes from pinned Pi (R005-A).'
builtin_tool:
  tool: read
  fixture:
  - path: png_small_rgb.png
    file:
      fixture_file: r005a-photon/png_small_rgb.png
  options:
    model_supports_images: false
  cases:
  - id: non-vision-model
    arguments:
      path: png_small_rgb.png
    expect:
      is_error: false
      text: 'Read image file [image/png]

        [Current model does not support images. The image will be omitted from this request.]'
      image:
        mime_type: image/png
        sha256: dd2696b1dbbdce326b193f9d75d876482718f32fbd7f6b66de0b3cd3a2568f05
        bytes: 83
      details: {}

name: builtin-read-leading-ascii-space-not-trimmed
family: agent
authority: minion-agent-docs spec/tools.md WP-13.1 (master f46051fb)
pi_revision: b7bb00b936dbe21b8e160b3e89efdec361846699
requirements:
- TOOL-026
witnesses:
- read_leading_ascii_space_not_trimmed
notes: 'No trim: '' x.txt'' addresses the space-prefixed file. Exactly one leading ''@'' is stripped,
  so ''@x.txt'' reads x.txt and ''@@x.txt'' addresses the missing ''@x.txt''.'
builtin_tool:
  tool: read
  fixture:
  - path: ' x.txt'
    file:
      text: space
  - path: x.txt
    file:
      text: plain
  cases:
  - id: space-prefixed
    arguments:
      path: ' x.txt'
    expect:
      is_error: false
      text: space
      details: {}
  - id: plain
    arguments:
      path: x.txt
    expect:
      is_error: false
      text: plain
      details: {}
  - id: at-stripped
    arguments:
      path: '@x.txt'
    expect:
      is_error: false
      text: plain
      details: {}
  - id: only-one-at-stripped
    arguments:
      path: '@@x.txt'
    expect:
      is_error: true
      text: 'Cannot access {abs:@x.txt}: no such file or directory'
      details: {}

name: builtin-read-offset-limit-then-truncation-ordering
family: agent
authority: minion-agent-docs spec/tools.md WP-13.1 (master f46051fb)
pi_revision: b7bb00b936dbe21b8e160b3e89efdec361846699
requirements:
- TOOL-025
witnesses:
- read_offset_limit_then_truncation_ordering
notes: 'offset/limit select BEFORE head truncation. A caller limit that stops early appends Pi''s ''more
  lines'' notice with NO details.truncation; automatic truncation (lines, then bytes) appends the ''Showing
  lines'' notice and details.truncation, whose total_lines is the SELECTED range (2500), not the file
  (3000). Expected values: pinned Pi read.ts + truncate.ts.'
builtin_tool:
  tool: read
  fixture:
  - path: data100.txt
    file:
      lines:
        count: 100
        template: line {n}
  - path: data3000.txt
    file:
      lines:
        count: 3000
        template: row {n}
  - path: wide.txt
    file:
      lines:
        count: 1000
        template: xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
  cases:
  - id: caller-limit-stops-early
    arguments:
      path: data100.txt
      offset: 41
      limit: 20
    expect:
      is_error: false
      text: 'line 41

        line 42

        line 43

        line 44

        line 45

        line 46

        line 47

        line 48

        line 49

        line 50

        line 51

        line 52

        line 53

        line 54

        line 55

        line 56

        line 57

        line 58

        line 59

        line 60


        [40 more lines in file. Use offset=61 to continue.]'
      image: null
      details: {}
  - id: limit-reaches-eof-no-notice
    arguments:
      path: data100.txt
      offset: 91
      limit: 20
    expect:
      is_error: false
      text: 'line 91

        line 92

        line 93

        line 94

        line 95

        line 96

        line 97

        line 98

        line 99


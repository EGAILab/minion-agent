    file:
      base64: 77u/b25lDQp0d28NdGhyZWUK4oIg8ICAQSDtoIAgw6n/
  cases:
  - id: decode
    arguments:
      path: mixed.bin
    expect:
      is_error: false
      text: "\uFEFFone\r\ntwo\rthree\n\uFFFD \uFFFD\uFFFD\uFFFDA \uFFFD\uFFFD\uFFFD \xE9\uFFFD"
      image: null
      details: {}
  - id: decode-offset
    arguments:
      path: mixed.bin
      offset: 2
    expect:
      is_error: false
      text: "two\rthree\n\uFFFD \uFFFD\uFFFD\uFFFDA \uFFFD\uFFFD\uFFFD \xE9\uFFFD"
      image: null
      details: {}

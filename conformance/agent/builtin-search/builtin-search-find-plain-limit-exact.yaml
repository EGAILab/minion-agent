builtin_search:
  tool: find
  corpus: plain
  arguments:
    pattern: '*.json'
    limit: 1
  expect:
    win32:
      is_error: false
      mode: find_subset
      count: 1
      of:
      - data/x.json
      - data/y.JSON
      notice: '[1 results limit reached. Use limit=2 for more, or refine pattern]'

        resultLimitReached: 1
    linux:
      is_error: false
      mode: find_subset
      count: 1
      of:
      - data/x.json
      - data/y.JSON
      notice: '[1 results limit reached. Use limit=2 for more, or refine pattern]'
      details:
        resultLimitReached: 1

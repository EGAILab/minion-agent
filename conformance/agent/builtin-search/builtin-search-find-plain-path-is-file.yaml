name: builtin-search-find-plain-path-is-file
family: agent
authority: minion-agent-docs spec/tools.md WP-13.4 (master f3ae3ced); pinned-Pi search_probe outputs
pi_revision: b7bb00b936dbe21b8e160b3e89efdec361846699
requirements:
- TOOL-036
witnesses:
- builtin_search_find_plain_path_is_file
builtin_search:
  tool: find
  corpus: plain
  arguments:
    pattern: '*.ts'
    path: src/a.ts
  expect:
    win32:
      is_error: true
      mode: exact
      text: '[fd error]: Search path ''<ROOT>\src\a.ts'' is not a directory.

        [fd error]: No valid search paths given.'
      details: {}
    linux:
      is_error: true
      mode: exact
      text: '[fd error]: Search path ''<ROOT>/src/a.ts'' is not a directory.

        [fd error]: No valid search paths given.'
      details: {}

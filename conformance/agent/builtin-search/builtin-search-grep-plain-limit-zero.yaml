name: builtin-search-grep-plain-limit-zero
family: agent
authority: minion-agent-docs spec/tools.md WP-13.4 (master f3ae3ced); pinned-Pi search_probe outputs
pi_revision: b7bb00b936dbe21b8e160b3e89efdec361846699
requirements:
- TOOL-037
witnesses:
- builtin_search_grep_plain_limit_zero
builtin_search:
  tool: grep
  corpus: plain
  arguments:
    pattern: hit
    path: text/many.txt
    limit: 0
  expect:
    win32:
      is_error: false
      mode: grep_by_file
      files:
        many.txt:
        - 'many.txt:1: hit 1'
      notice: '[1 matches limit reached. Use limit=2 for more, or refine pattern]'
      details:
        matchLimitReached: 1
    linux:
      is_error: false
      mode: grep_by_file
      files:
        many.txt:
        - 'many.txt:1: hit 1'
      notice: '[1 matches limit reached. Use limit=2 for more, or refine pattern]'
      details:
        matchLimitReached: 1

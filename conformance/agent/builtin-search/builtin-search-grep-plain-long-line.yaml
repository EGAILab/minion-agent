name: builtin-search-grep-plain-long-line
family: agent
authority: minion-agent-docs spec/tools.md WP-13.4 (master f3ae3ced); pinned-Pi search_probe outputs
pi_revision: b7bb00b936dbe21b8e160b3e89efdec361846699
requirements:
- TOOL-037
witnesses:
- builtin_search_grep_plain_long_line
builtin_search:
  tool: grep
  corpus: plain
  arguments:
    pattern: needle
    path: text/long.txt
  expect:
    win32:
      is_error: false
      mode: grep_by_file
      files:
        long.txt:
        - 'long.txt:1: ... [truncated]'
        - 'long.txt:2: short needle'
      notice: '[Some lines truncated to 500 chars. Use read tool to see full lines]'
      details:
        linesTruncated: true
    linux:
      is_error: false
      mode: grep_by_file
      files:
        long.txt:
        - 'long.txt:1: ... [truncated]'
        - 'long.txt:2: short needle'
      notice: '[Some lines truncated to 500 chars. Use read tool to see full lines]'
      details:
        linesTruncated: true

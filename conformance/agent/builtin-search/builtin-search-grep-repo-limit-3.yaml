requirements:
- TOOL-037
witnesses:
- builtin_search_grep_repo_limit_3
builtin_search:
  tool: grep
  corpus: repo
  arguments:
    pattern: hit
    path: text/many.txt
    limit: 3
  expect:
    win32:
      is_error: false
      mode: grep_by_file
      files:
        many.txt:
        - 'many.txt:1: hit 1'
        - 'many.txt:2: hit 2'
        - 'many.txt:3: hit 3'
      notice: '[3 matches limit reached. Use limit=6 for more, or refine pattern]'
      details:
        matchLimitReached: 3
    linux:
      is_error: false
      mode: grep_by_file
      files:
        many.txt:
        - 'many.txt:1: hit 1'
        - 'many.txt:2: hit 2'
        - 'many.txt:3: hit 3'
      notice: '[3 matches limit reached. Use limit=6 for more, or refine pattern]'

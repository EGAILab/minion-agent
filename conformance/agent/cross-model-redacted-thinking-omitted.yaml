name: cross-model-redacted-thinking-omitted
pi_revision: b7bb00b936dbe21b8e160b3e89efdec361846699
authority: 2026-08-20-minion-agent-design.md
notes: 'Redacted thinking is opaque encrypted content, only valid for the model that
  produced it (transform-messages.ts''s own comment): crossing to a different target
  drops it entirely, regardless of signature or visible text -- the redacted check
  runs before any signature/empty check (AI-021).

  '
transform:
  messages:
  - role: assistant
    content:
    - type: thinking
      thinking: visible fragment
      thinking_signature: opaque-blob
      redacted: true
    - type: text
      text: the answer
    provider: p
    api: a
    model: m1
    stop_reason: stop
    timestamp: 1
    usage:
      input: 0
      output: 0
      cache_read: 0
      cache_write: 0
      total_tokens: 0
      cost:
        input: 0
        output: 0
        cache_read: 0
        cache_write: 0
        total: 0
  target:
    provider: p
    api: a
    model_id: m2
    supports_images: false
expect:
  messages:
  - role: assistant
    content:
    - type: text
      text: the answer
      text_signature: null
    provider: p
    api: a
    model: m1
    stop_reason: stop
    timestamp: 1
    usage:
      input: 0
      output: 0
      cache_read: 0
      cache_write: 0
      cache_write_1h: null
      reasoning: null
      total_tokens: 0
      cost:
        input: 0
        output: 0
        cache_read: 0
        cache_write: 0
        total: 0
    response_model: null
    response_id: null
    diagnostics: null
    deferred: null
    error_message: null
    raw_stop_reason: null
    end_turn: null

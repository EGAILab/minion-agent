name: cross-model-signatures-stripped
pi_revision: b7bb00b936dbe21b8e160b3e89efdec361846699
authority: 2026-08-20-minion-agent-design.md
notes: >
  text_signature and thought_signature strip cross-model independently of thinking's own
  conversion/removal rules (AI-022) -- an ordinary TextBlock and a ToolCall in the same assistant
  message both lose their opaque replay metadata, while the ToolCall's id/name/arguments/namespace
  all survive untouched.
transform:
  messages:
    - role: assistant
      content:
        - type: text
          text: "checking"
          text_signature: opaque-text-sig
        - type: tool_call
          id: call-1
          name: lookup
          arguments:
            query: weather
          thought_signature: opaque-thought-sig
          namespace: ns-1
      provider: p
      api: a
      model: m1
      stop_reason: tool_use
      timestamp: 1
  target:
    provider: p
    api: a
    model_id: m2
    supports_images: false
expect:
  messages:
    - role: assistant
      content:
        - type: text
          text: "checking"
          text_signature: null
        - type: tool_call
          id: call-1
          name: lookup
          arguments:
            query: weather
          thought_signature: null
          namespace: ns-1
      provider: p
      api: a
      model: m1
      stop_reason: tool_use
      timestamp: 1
    - role: tool_result
      content:
        - type: text
          text: No result provided
          text_signature: null
      tool_call_id: call-1
      tool_name: lookup
      is_error: true

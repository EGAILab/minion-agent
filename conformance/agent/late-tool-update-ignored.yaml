name: late-tool-update-ignored
description: >
  Pinned Pi's `AgentToolUpdateCallback`: "Calls made after the tool promise settles are
  ignored" (`packages/agent/src/types.ts`, Layer 06, TOOL-017). A tool that reports one live
  update, then returns, then reports a second update one cooperative scheduler tick later must
  produce exactly one observable `tools/update` -- the late one is silently dropped, not queued,
  not delivered, not an error.

  Also carries `IR-L06-005`'s payload evidence: pinned Pi's `tool_execution_update` AgentEvent
  carries `toolCallId`/`toolName`/`args`/`partialResult`, and `args` is the call's ORIGINAL
  arguments -- `PreparedToolCall.toolCall.arguments`, confirmed by direct Pi source inspection to
  be the untouched call `prepareToolCall` was given, never the `prepareArguments`-shimmed or
  schema-validated value `execute()` actually runs with. `chatty`'s `prepare_arguments.set` adds a
  `prepared: true` key that only exists after preparation, so `expect_updates.arguments` proves
  the update event reports the call's ORIGINAL `{raw: 1}` -- without `prepared` -- even though
  `execute()` itself receives the prepared, merged arguments.

  `L08-R011`: `partialResult` is structured (pinned Pi's own `AgentToolResult<T>`: `content`/
  `details` REQUIRED -- never omittable, even when empty -- `usage`/`terminate`/`added_tool_names`
  genuinely optional, with NO nested call identity or error field of its own -- those live only on
  the enclosing event's own `tool_call_id`/`tool_name`), never a bare string and never merely a
  `{text: ...}` shorthand: `details`/`usage`/`terminate`/`added_tool_names` are all asserted here
  too, proving canonical evidence observes the full structured shape through the real production
  seam, not only joined text content, and that the schema itself REJECTS a forbidden shape
  (`additionalProperties: false`, `required: [text, details]` -- `agent-scenario.schema.json`'s
  own `toolPartialResult` definition). The first update's own `details: {}` is genuinely EMPTY,
  not absent -- proving the canonical observer serializes a required-but-empty value rather than
  collapsing it, the exact hazard an independent Rust re-review caught in an earlier revision's own
  encoder (`if partial.details: encoded["details"] = ...`, which silently dropped `{}`).
provider_script:
  - content: [{ type: tool_call, id: t1, name: chatty, arguments: { raw: 1 } }]
    stop_reason: tool_use
  - content: [{ type: text, text: done }]
    stop_reason: stop
tools:
  chatty:
    result: { text: finished }
    emits_updates:
      - text: bare
        details: {}
      - text: live
        details: { progress: 1 }
        usage: { input: 5, output: 3, total_tokens: 8 }
        terminate: false
        added_tool_names: [extra]
    late_update: { text: late, details: {} }
    prepare_arguments:
      set: { prepared: true }
steps:
  - followup: go
  - await_idle: true
expect_updates:
  - tool_call_id: t1
    tool_name: chatty
    arguments: { raw: 1 }
    partial:
      text: bare
      details: {}
  - tool_call_id: t1
    tool_name: chatty
    arguments: { raw: 1 }
    partial:
      text: live
      details: { progress: 1 }
      usage:
        input: 5
        output: 3
        cache_read: 0
        cache_write: 0
        cache_write_1h: null
        reasoning: null
        total_tokens: 8
        cost: { input: 0, output: 0, cache_read: 0, cache_write: 0, total: 0 }
      terminate: false
      added_tool_names: [extra]
expect_messages:
  - { role: user, text: go }
  - { role: assistant, text: "" }
  - { role: tool_result, text: finished }
  - { role: assistant, text: done }

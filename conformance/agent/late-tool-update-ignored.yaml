name: late-tool-update-ignored
description: >
  Pinned Pi's `AgentToolUpdateCallback`: "Calls made after the tool promise settles are
  ignored" (`packages/agent/src/types.ts`, Layer 06, TOOL-017). A tool that reports one live
  update, then returns, then reports a second update one cooperative scheduler tick later must
  produce exactly one observable `tools/update` -- the late one is silently dropped, not queued,
  not delivered, not an error.

  Also carries `IR-L06-005`'s payload evidence: pinned Pi's `tool_execution_update` AgentEvent
  carries `toolCallId`/`toolName`/`args`/`partialResult`, and `args` is the call's ORIGINAL
  arguments -- `PreparedToolCall.toolCall.arguments`, confirmed by direct Pi source inspection to
  be the untouched call `prepareToolCall` was given, never the `prepareArguments`-shimmed or
  schema-validated value `execute()` actually runs with. `chatty`'s `prepare_arguments.set` adds a
  `prepared: true` key that only exists after preparation, so `expect_updates.arguments` proves
  the update event reports the call's ORIGINAL `{raw: 1}` -- without `prepared` -- even though
  `execute()` itself receives the prepared, merged arguments.

  `L08-R011`: `partialResult` is structured (pinned Pi's own `AgentToolResult<T>`: `content`/
  `details`/`added_tool_names`/`terminate`, with NO nested call identity or error field of its
  own -- those live only on the enclosing event's own `tool_call_id`/`tool_name`), never a bare
  string and never merely a `{text: ...}` shorthand: `details`/`terminate`/`added_tool_names` are
  asserted here too, proving canonical evidence observes the full structured shape through the
  real production seam, not only joined text content.
provider_script:
  - content: [{ type: tool_call, id: t1, name: chatty, arguments: { raw: 1 } }]
    stop_reason: tool_use
  - content: [{ type: text, text: done }]
    stop_reason: stop
tools:
  chatty:
    result: { text: finished }
    emits_updates:
      - text: live
        details: { progress: 1 }
        terminate: false
        added_tool_names: [extra]
    late_update: { text: late }
    prepare_arguments:
      set: { prepared: true }
steps:
  - followup: go
  - await_idle: true
expect_updates:
  - tool_call_id: t1
    tool_name: chatty
    arguments: { raw: 1 }
    partial:
      text: live
      details: { progress: 1 }
      terminate: false
      added_tool_names: [extra]
expect_messages:
  - { role: user, text: go }
  - { role: assistant, text: "" }
  - { role: tool_result, text: finished }
  - { role: assistant, text: done }

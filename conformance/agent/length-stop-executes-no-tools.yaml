name: length-stop-executes-no-tools
description: >
  Pinned Pi's `failToolCallsFromTruncatedMessage` (`packages/agent/src/agent-loop.ts`, Layer 06,
  TOOL-017): a `length` stop reason means the assistant's output was cut off by the token limit,
  so every tool call the message carries may itself have truncated arguments. None are safe to
  execute -- not even an unknown-tool lookup runs, and no tool's `execute` callback is ever
  invoked. Each call unconditionally becomes the same error result, in source order, and the
  batch never terminates the turn on this account.
provider_script:
  - content:
      - { type: tool_call, id: t1, name: real_tool, arguments: {} }
      - { type: tool_call, id: t2, name: also_never_runs, arguments: {} }
    stop_reason: length
  - content: [{ type: text, text: retrying with complete arguments }]
    stop_reason: stop
tools:
  real_tool: { result: { text: should never run } }
steps:
  - followup: go
  - await_idle: true
expect_messages:
  - { role: user, text: go }
  - { role: assistant, text: "" }
  - role: tool_result
    text: >-
      Tool call "real_tool" was not executed: the response hit the output token limit, so its
      arguments may be truncated. Re-issue the tool call with complete arguments.
  - role: tool_result
    text: >-
      Tool call "also_never_runs" was not executed: the response hit the output token limit, so
      its arguments may be truncated. Re-issue the tool call with complete arguments.
  - { role: assistant, text: retrying with complete arguments }
expect_tool_completion_order: [t1, t2]

name: llm-service-same-fixture-two-handles
family: agent
authority: 2026-08-20-minion-agent-design.md
pi_revision: b7bb00b936dbe21b8e160b3e89efdec361846699
notes: >
  C10-C005: ownership is per REGISTRATION CALL, not per adapter OBJECT (AI-030). Registering the
  SAME adapter fixture twice, under two independent handles, must give each call its own ownership
  -- withdrawing the first (now-stale) handle must not remove the second (current) call's own
  entry, and the second handle must still correctly remove its own entry when withdrawn. This is a
  genuine RED witness against the exact PASS-2 `llm/service.py`: an earlier revision's withdrawal
  closure checked `self._adapters.get(model_id) is adapter` alone, which cannot distinguish two
  registration calls that happen to share the same adapter object, so the FIRST call's own handle
  incorrectly removed the SECOND call's own live entry. The fix stores a fresh, opaque per-call
  token alongside the adapter and checks the TOKEN, not adapter-object identity, on withdrawal.
llm_service:
  adapters:
    - id: adapter-a
      provider: mock
      api: mock
      models: [alpha]
      behavior: ok
  steps:
    - register: { adapter: adapter-a, as: handle-1 }
    - register: { adapter: adapter-a, as: handle-2 }
    - withdraw: handle-1
  queries:
    - id: models_after_stale_withdrawal
      introspect: models
expect:
  models_after_stale_withdrawal:
    models:
      - { provider: mock, model: alpha, api: mock }

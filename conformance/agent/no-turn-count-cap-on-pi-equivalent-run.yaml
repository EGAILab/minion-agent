name: no turn-count cap exists on the Pi-equivalent run path
description: >
  L08-R005: pinned Pi has no `max_steps`-equivalent stop rule at all, and
  Minion's own prior turn-counter cap has been removed from the
  `prompt()`/`continue()` semantic path entirely -- it is not merely
  repositioned or relabeled parity-neutral. This scenario is what the
  removed cap used to bound (a turn that only ever calls tools) and proves
  the opposite of what it used to prove: the run keeps going for as many
  tool-driven turns as the model actually requests, with no host-imposed
  stop after any fixed count.

  Twenty assistant/tool-result turns are scripted before the final stopping
  turn -- deliberately more than the REMOVED IMPLEMENTATION's own former
  default (`AgentDefinition.max_steps == 16`, not any scenario-supplied
  override a prior revision of this file compared against by mistake, which
  proved nothing about the actual default). Against the pre-removal
  implementation and no `config.max_steps` override, this scenario would
  have stopped at the 16th tool turn with reason `max_steps`; it does not.

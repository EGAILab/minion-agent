    - type: tool_call
      id: orphan-at-end
      name: cleanup
      arguments: {}
    provider: p
    api: a
    model: m1
    stop_reason: tool_use
    timestamp: 5
    usage:
      input: 0
      output: 0
      cache_read: 0
      cache_write: 0
      total_tokens: 0
      cost: *id001
  target:
    provider: p
    api: a
    model_id: m1
    supports_images: false

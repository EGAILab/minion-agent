name: orphan-tool-result-synthesized
pi_revision: b7bb00b936dbe21b8e160b3e89efdec361846699
authority: 2026-08-20-minion-agent-design.md
notes: 'Three placements from Pi''s second transform pass (AI-024): a tool call resolved
  by a real result needs nothing synthesized; an unresolved call is flushed the moment
  a later user message interrupts; an unresolved call left at the very end of history
  is flushed once more after the loop. The synthesized result must be a fully valid
  ToolResultMessage carrying the real tool_name from its own ToolCall (LLM-F011 --
  tool_name is required, not fabricated or omitted).

  '
transform:
  messages:
  - role: assistant
    content:
    - type: tool_call
      id: resolved-1
      name: search
      arguments: {}
    provider: p
    api: a
    model: m1
    stop_reason: tool_use
    timestamp: 1
    usage:
      input: 0
      output: 0
      cache_read: 0
      cache_write: 0
      total_tokens: 0
      cost: &id001
        input: 0
        output: 0
        cache_read: 0
        cache_write: 0
        total: 0
  - role: tool_result
    content:
    - type: text
      text: found it
    tool_call_id: resolved-1
    tool_name: search
    is_error: false
    timestamp: 2
  - role: assistant
    content:
    - type: tool_call
      id: orphan-before-user
      name: fetch
      arguments: {}
    provider: p
    api: a
    model: m1
    stop_reason: tool_use
    timestamp: 3
    usage:
      input: 0
      output: 0
      cache_read: 0
      cache_write: 0
      total_tokens: 0
      cost: *id001
  - role: user

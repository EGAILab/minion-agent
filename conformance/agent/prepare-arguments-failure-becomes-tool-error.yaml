name: prepare-arguments-failure-becomes-tool-error
description: >
  `TOOL-017`: `prepare_arguments` always runs before schema validation (pinned Pi's
  `AgentTool.prepareArguments`). A `prepare_arguments` exception is an immediate (pre-execute)
  failure, same taxonomy as a validation or before-hook failure -- `execute` is never invoked.
provider_script:
  - content: [{ type: tool_call, id: t1, name: finicky, arguments: {} }]
    stop_reason: tool_use
  - content: [{ type: text, text: done }]
    stop_reason: stop
tools:
  finicky:
    result: { text: should never run }
    prepare_arguments: { raises: cannot repair these arguments }
steps:
  - followup: go
  - await_idle: true
expect_messages:
  - { role: user, text: go }
  - { role: assistant, text: "" }
  - { role: tool_result, text: "cannot repair these arguments" }
  - { role: assistant, text: done }

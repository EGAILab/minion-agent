name: public-llm-vocabulary-schema
description: >
  Proves the frozen LLM-### vocabulary (design spec section 4) is observable end-to-end through the
  real agent loop and mock adapter, not just at the unit level (LLM-F010). Two turns: the first
  scripts every optional AssistantMessage/content-block field the real reference adapter can carry,
  proving presence survives the real construction/session-log/derivation path; the second scripts
  none of them, proving the real implementation reports absence as null rather than the runner or the
  adapter fabricating a value.
provider_script:
  - content:
      - type: text
        text: "Here is my answer."
        text_signature: sig-text-1
      - type: thinking
        thinking: "Reasoning about the answer."
        thinking_signature: sig-think-1
        redacted: false
    stop_reason: stop
    usage:
      input: 10
      output: 5
      cache_read: 2
      cache_write: 1
      cache_write_1h: 1
      reasoning: 3
      total_tokens: 15
      cost:
        input: 0.001
        output: 0.002
        cache_read: 0.0001
        cache_write: 0.0001
        total: 0.0032
    response_model: mock-1-router
    response_id: resp_1
    diagnostics:
      - type: retry
        timestamp: 1
        error:
          message: transient timeout
          name: TimeoutError
          code: 504
        details:
          attempt: 2
    raw_stop_reason: stop_natural
    end_turn: true
  - content:
      - type: text
        text: "Second answer, nothing extra scripted."
    stop_reason: stop
steps:
  - followup: first question
  - await_idle: true
  - followup: second question
  - await_idle: true
expect_assistant_details:
  - api: mock
    provider: mock
    model: mock-1
    timestamp: 1
    response_model: mock-1-router
    response_id: resp_1
    stop_reason: stop
    raw_stop_reason: stop_natural
    end_turn: true
    error_message: null
    usage:
      input: 10
      output: 5
      cache_read: 2
      cache_write: 1
      cache_write_1h: 1
      reasoning: 3
      total_tokens: 15
      cost:
        input: 0.001
        output: 0.002
        cache_read: 0.0001
        cache_write: 0.0001
        total: 0.0032
    diagnostics:
      - type: retry
        timestamp: 1
        error:
          message: transient timeout
          name: TimeoutError
          stack: null
          code: 504
        details:
          attempt: 2
    deferred: null
    content:
      - type: text
        text: "Here is my answer."
        text_signature: sig-text-1
      - type: thinking
        thinking: "Reasoning about the answer."
        thinking_signature: sig-think-1
        redacted: false
  - api: mock
    provider: mock
    model: mock-1
    timestamp: 2
    response_model: null
    response_id: null
    stop_reason: stop
    raw_stop_reason: null
    end_turn: null
    error_message: null
    usage:
      input: 0
      output: 0
      cache_read: 0
      cache_write: 0
      cache_write_1h: null
      reasoning: null
      total_tokens: 0
      cost:
        input: 0
        output: 0
        cache_read: 0
        cache_write: 0
        total: 0
    diagnostics: null
    deferred: null
    content:
      - type: text
        text: "Second answer, nothing extra scripted."
        text_signature: null

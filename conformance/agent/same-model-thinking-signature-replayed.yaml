notes: 'Split from provider-wire replay by ownership (Layer 02/04 assurance §6): this
  scenario proves only Question A -- what Message blocks survive transform_messages()
  for the same target model. A signed ThinkingBlock is retained unchanged, signature
  included, even with empty visible text (Pi''s own OpenAI-encrypted-reasoning case).
  Question B -- how a retained thinking_signature is encoded back into a real Responses-family
  provider request -- remains Phase-5-deferred (assurance/layers/02-llm.md §7''s own
  disposition, unchanged by this scenario); no provider wire encoder is invoked or
  simulated here.

  '

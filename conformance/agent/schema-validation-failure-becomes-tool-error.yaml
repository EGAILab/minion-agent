name: schema-validation-failure-becomes-tool-error
description: >
  Arguments that do not satisfy the tool's parameter schema fail before `execute` ever runs
  (Layer 06, TOOL-017) -- an immediate (pre-execute) failure, same taxonomy as a `prepare_arguments`
  or before-hook failure. The model chose these arguments, so it is the one told what was wrong.
provider_script:
  - content: [{ type: tool_call, id: t1, name: strict, arguments: {} }]
    stop_reason: tool_use
  - content: [{ type: text, text: done }]
    stop_reason: stop
tools:
  strict:
    result: { text: should never run }
    parameters: { requires: [name] }
steps:
  - followup: go
  - await_idle: true
expect_messages:
  - { role: user, text: go }
  - { role: assistant, text: "" }
  - role: tool_result
    text_contains: "invalid arguments"
  - { role: assistant, text: done }

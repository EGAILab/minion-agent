name: tool-call-id-normalization-empty-string
pi_revision: b7bb00b936dbe21b8e160b3e89efdec361846699
authority: 2026-08-20-minion-agent-design.md
notes: 'XFORM-R005: pinned Pi''s ToolCall rewrite and its later ToolResult rewrite are governed
  by two different, asymmetric conditions. The ToolCall rewrite is unconditional on
  `returned != original`, including when `returned` is the empty string -- so a callback that
  returns "" still rewrites ToolCall.id to "". The matching ToolResult rewrite additionally
  requires the mapped value be truthy (`if (normalizedId && normalizedId !== msg.toolCallId)`),
  so a mapped empty string is falsy and does NOT rewrite the real result -- it keeps its original
  id. The two representations of the same call no longer match, so the transformed call is left
  unresolved and orphan synthesis (rule 14) fires for it, alongside the real, now-unmatched
  result. This is a deliberate reproduction of Pi''s own JavaScript truthiness quirk, not a
  simplification target -- see spec/target-model-transformation.md rule 13.

  '

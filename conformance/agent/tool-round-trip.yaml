name: a tool call closes and the model is asked again
description: >
  The Phase 3 milestone. The model requests a tool, the loop executes it and
  logs the result, and the model is asked again with that result in history.
provider_script:
  - content: [{ type: tool_call, id: t1, name: echo, arguments: { value: pong } }]
    stop_reason: tool_use
  - content: [{ type: text, text: all done }]
    stop_reason: stop
tools:
  echo: { result: { text: pong } }
steps:
  - followup: ping
  - await_idle: true
description: >
  Two pi turns, not one: the tool-call response and the tool execution/result
  close pi's first turn (`turn_start`/`turn_end` bracket exactly one assistant
  response plus its tool calls/results); the model is asked again inside a
  second, freshly bracketed turn within the same run (`agent_start`/
  `agent_end` unchanged). An earlier revision bracketed both provider
  requests inside one `turn_start`/`turn_end` pair -- observably wrong once
  checked against pinned Pi's `agent-loop.ts` (Layer 08).
expect_events:
  - agent_start
  - turn_start
  - message_start
  - message_end
  - message_start
  - message_end
  - tool_execution_start
  - tool_execution_end
  - message_start
  - message_end
  - turn_end
  - turn_start
  - message_update
  - message_start
  - message_end
  - turn_end
  - agent_end
expect_messages:
  - { role: user, text: ping }
  - { role: assistant, text: "" }
  - { role: tool_result, text: pong }
  - { role: assistant, text: all done }

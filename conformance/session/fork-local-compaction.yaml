name: compaction inside a fork leaves its ancestor untouched
description: >
  A fork's sequence numbers restart, so a compaction's superseded range refers
  to that log's own events. Inherited history is superseded wholesale rather
  than filtered by sequence, and the ancestor derives unchanged.
steps:
  - append: { role: user, text: inherited one }
  - append: { role: user, text: inherited two }
  - fork: {}
  - append: { role: user, text: own one }
  - append: { role: user, text: own two }
  - compact: { summary: summarised, keep: 1 }
  - derive: {}
expect_messages:
  - { role: user, text: summarised }
  - { role: user, text: own two }

name: a later compaction supersedes an earlier one without stacking summaries
description: >
  Compactions produced by the API supersede monotonically, because each one
  computes its range from the current effective surface. Derivation must
  therefore yield one summary, never a chain of them, and must not emit both
  an original entry and a retained copy of it.
steps:
  - append: { role: user, text: one }
  - append: { role: user, text: two }
  - append: { role: user, text: three }
  - compact: { summary: first summary, keep: 1 }
  - append: { role: user, text: four }
  - compact: { summary: second summary, keep: 2 }
  - derive: {}
expect_messages:
  - { role: user, text: second summary }
  - { role: user, text: three }
  - { role: user, text: four }

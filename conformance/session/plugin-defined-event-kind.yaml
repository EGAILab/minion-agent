name: a plugin-declared event kind derives like a core one
description: >
  The event-name string is the language-neutral identity; core constants are
  ergonomics, not a closed set. A plugin event declared as surface projects
  into model history exactly as a core one does, in log order.
surface_kinds: [plugin/note]
steps:
  - append: { role: user, text: from a user }
  - append: { role: plugin/note, text: from a plugin }
  - append: { role: assistant, text: answered }
  - derive: {}
expect_messages:
  - { role: user, text: from a user }
  - { role: user, text: from a plugin }
  - { role: assistant, text: answered }

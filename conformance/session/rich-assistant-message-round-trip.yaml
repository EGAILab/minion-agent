name: rich-assistant-message-round-trip
description: >
  The remaining AssistantMessage/ToolResultMessage fields (SES-F001, Rust
  review items 1-2) not covered by the content-signature, deferred-handle, or
  diagnostic round-trip scenarios -- provider, model, timestamp, error_message,
  api, response_model, response_id, raw_stop_reason, end_turn, and full
  usage/cost accounting; plus tool_call_id, timestamp, tool_name, details,
  usage, added_tool_names on the tool-result side -- must survive the log's
  encode/decode round trip. One assistant/tool_result pair scripts every
  optional field with genuinely non-default values (not just the runner's
  defaults), proving real variability round-trips, not merely presence; a
  second pair scripts none of the *optional* fields, proving absence/defaults
  stay exactly that rather than being synthesized. `tool_name` is required on
  every tool-result, matching Pi's non-optional `ToolResultMessage.toolName`
  (delta finding A) -- both pairs script it, with a distinct value in each to
  prove the required field round-trips too, not merely defaults.
steps:
  - append:
      role: assistant
      text: "calling a tool"
      provider: real-provider
      model: real-model-x
      timestamp: 42
      error_message: "a transient note"
      api: mock
      response_model: mock-1-router
      response_id: resp_1
      raw_stop_reason: stop_natural
      end_turn: true
      usage:
        input: 10
        output: 5
        cache_read: 2
        cache_write: 1
        cache_write_1h: 1
        reasoning: 3
        total_tokens: 15
        cost: { input: 0.001, output: 0.002, cache_read: 0.0001, cache_write: 0.0001, total: 0.0032 }
  - append:
      role: tool_result
      text: "tool ran"
      tool_call_id: call-99
      timestamp: 43
      tool_name: lookup
      details: { attempt: 1 }
      usage: { input: 0, output: 0, cache_read: 0, cache_write: 0, total_tokens: 0 }
      added_tool_names: [followup_tool]
  - append:
      role: assistant
      text: "second answer, nothing extra scripted"
  - append:
      role: tool_result
      text: "second tool result, nothing extra scripted"
      tool_name: generic_tool
expect_messages:
  - role: assistant
    text: "calling a tool"
  - role: tool_result
    text: "tool ran"
  - role: assistant
    text: "second answer, nothing extra scripted"
  - role: tool_result
    text: "second tool result, nothing extra scripted"

name: a block that terminates ends the turn
description: >
  A blocked call participates in the batch fold like any other result. With
  one call in the batch, a terminating block is unanimous, so the turn ends
  without a second request -- and the model still sees why.
listeners:
  - event: tools/pre-execute
    action: block
    reason: hard stop
    terminate: true
provider_script:
  - content: [{ type: tool_call, id: t1, name: danger, arguments: {} }]
    stop_reason: tool_use
  - content: [{ type: text, text: never reached }]
    stop_reason: stop
tools:
  danger: { result: { text: should never run } }
steps:
  - followup: go
  - await_idle: true
expect_messages:
  - { role: user, text: go }
  - { role: assistant, text: "" }
  - { role: tool_result, text: hard stop }

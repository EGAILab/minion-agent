name: an unresolvable model raises before any stream exists
description: >
  The other side of section 4's boundary, and the only agent scenario that
  asserts a raised error. Resolving a model happens *before* a stream is
  returned, so an unresolvable one is a caller bug and is reported eagerly --
  never smuggled into history as an error message the model appears to have
  produced.

  "Before any event" is deliberately *not* what this asserts, and cannot be:
  a turn opens, claims its prompt, and records its request header before the
  model is ever resolved, so those entries exist by the time the error is
  raised. What the eager contract actually guarantees is the shape pinned
  here -- the call raises, the prompt survives on the surface, and no
  assistant message exists. An implementation that logged an error-stopped
  assistant message instead would satisfy a naive "it failed" check and still
  be wrong.
config: { model: no-such-model }
provider_script:
  - content: [{ type: text, text: never reached }]
    stop_reason: stop
steps:
  - followup: hello
  - await_idle: true
expect_error:
  type: UnknownModelError
  message_contains: no-such-model
expect_messages:
  - { role: user, text: hello }
expect_assistant_stop_reasons: []

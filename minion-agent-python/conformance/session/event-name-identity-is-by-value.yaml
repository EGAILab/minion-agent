name: an event's identity is its name string, compared by value
description: >
  A language may offer constants for the core names, but those are ergonomics:
  "user/message" and whatever constant an implementation uses for it are the
  same event. This scenario spells one append with the literal name and one
  with the conventional role alias; both must derive identically.

  An implementation comparing by identity rather than value passes this case
  for the surface path and still fails on operations, which is why the rule is
  stated normatively in the design rather than left to this scenario alone.
steps:
  - append: { role: user, text: via the alias }
  - append: { role: user/message, text: via the literal name }
  - derive: {}
expect_messages:
  - { role: user, text: via the alias }
  - { role: user, text: via the literal name }

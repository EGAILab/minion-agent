[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "minion-agent-python"
version = "0.1.0"
description = "Agent runtime with a Cordis-inspired plugin architecture"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "jsonschema>=4.22",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/minion_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --cov --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/minion_agent"]

[tool.coverage.run]
source = [
    "src/minion_agent/runtime",
    "src/minion_agent/llm",
    "src/minion_agent/session",
    "src/minion_agent/telemetry",
]

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_lines = [
    "pragma: no cover",
    # Type-checking imports never execute at runtime by construction.
    "if TYPE_CHECKING:",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "minion-agent-python"
version = "0.1.0"
description = "Agent runtime with a Cordis-inspired plugin architecture"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "jsonschema>=4.22",
    "httpx>=0.27",
    "url-py>=2026.5.1",
    "ada-url==1.15.3",
    # WP-13.1 `read` image processing (R005-A): executes the pinned photon-node 0.3.4
    # photon_rs_bg.wasm, exactly the runtime the R005-A evidence proved against pinned Pi.
    "wasmtime==49.0.0",
    # WP-13.1 `ls` collation (R006-C): PyICU 2.16.2 linked against ONE pinned ICU 78.3 build.
    # There is no usable wheel; see scripts/pinned-icu/README.md for building it.
    "pyicu==2.16.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-jsonschema>=4.22",
]

# PyICU is built from its sdist against the pinned ICU 78.3 (scripts/pinned-icu/). Static metadata
# lets `uv lock` resolve it without building; the lock still pins the sdist's hash.
[[tool.uv.dependency-metadata]]
name = "pyicu"
version = "2.16.2"
requires-dist = []

[tool.hatch.build.targets.wheel]
packages = ["src/minion_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --cov --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/minion_agent"]

[[tool.mypy.overrides]]
# PyICU ships no type information (WP-13.1 `ls` collation).
module = ["icu"]
ignore_missing_imports = true

[tool.coverage.run]
source = [
    "src/minion_agent/runtime",
    "src/minion_agent/auth",
    "src/minion_agent/execution",
    "src/minion_agent/llm",
    "src/minion_agent/session",
    "src/minion_agent/telemetry",
    "src/minion_agent/agent",
    "src/minion_agent/agent_loop",
    "src/minion_agent/tools",
]

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_lines = [
    "pragma: no cover",
    # Type-checking imports never execute at runtime by construction.
    "if TYPE_CHECKING:",
]

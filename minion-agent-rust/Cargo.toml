[workspace]
members = ["crates/minion-agent", "xtask"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.97"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
ada-url = "=3.1.0"
async-trait = "0.1"
base64 = "0.22"
futures = "0.3"
getrandom = "0.4"
indexmap = "2"
jsonschema = "0.33"
nix = { version = "0.30", features = ["fs", "user"] }
parking_lot = "0.12"
proptest = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
ryu-js = "1"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"
url = "2"
uuid = { version = "1", features = ["v4"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

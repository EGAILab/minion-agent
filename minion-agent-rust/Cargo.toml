[workspace]
members = ["crates/minion-agent", "xtask"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.97"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
futures = "0.3"
indexmap = "2"
jsonschema = "0.33"
parking_lot = "0.12"
proptest = "1"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
tokio-util = "0.7"

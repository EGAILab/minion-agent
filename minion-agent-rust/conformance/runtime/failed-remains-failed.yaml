name: a failed fiber stays failed and never retries
description: >
  Initialization failure is terminal until disposal (design spec section 3:
  `Failed` is stable, has no restart operation, and recovery is disposal
  followed by a fresh mount). The subject injects a service, so both the
  disappearance and the reappearance of that service reach reconciliation --
  and neither must move the fiber.

  This pins three things a second implementation could plausibly get wrong.
  Losing a dependency must not unload a failed fiber back to `Pending`: that
  would let the next reconcile silently re-run an initialization that already
  reported failure. Regaining the dependency must not retry it. And disposal
  goes straight to `Disposed` without announcing `Unloading`, because the
  effects created before the failure were already unwound when it failed --
  the trace shows `only_once` created and disposed exactly once, at failure
  time, and never again.
plugins:
  - id: provider
    provides: tools
  - id: subject
    inject: [tools]
    fails: true
    effects:
      - label: only_once
steps:
  - mount: provider
  - mount: subject
  - unmount: provider
  - mount: provider
  - unmount: subject
expect_trace:
  - { event: fiber_state, plugin: provider, state: loading }
  - { event: service_provided, plugin: provider, service: tools }
  - { event: fiber_state, plugin: provider, state: active }
  - { event: fiber_state, plugin: subject, state: loading }
  - { event: effect_created, plugin: subject, label: only_once }
  - { event: effect_disposed, plugin: subject, label: only_once }
  - { event: fiber_state, plugin: subject, state: failed }
  # The dependency disappears: the failed fiber does not react.
  - { event: fiber_state, plugin: provider, state: unloading }
  - { event: fiber_state, plugin: provider, state: disposed }
  # The dependency returns: still no retry.
  - { event: fiber_state, plugin: provider, state: loading }
  - { event: service_provided, plugin: provider, service: tools }
  - { event: fiber_state, plugin: provider, state: active }
  # Disposal is the only exit, and it needs no unloading phase.
  - { event: fiber_state, plugin: subject, state: disposed }

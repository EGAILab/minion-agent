    `prompt()` rejects with pinned Pi''s exact text
    ("Agent is already processing a prompt. Use steer() or followUp() to queue messages, or wait
    for completion.") while a run is active (`test_prompt_rejects_while_active`); accepts a single
    message or a tuple, entering a new run directly, not through the follow-up queue
    (`test_prompt_starts_a_run_with_the_given_message`,
    `test_prompt_accepts_a_tuple_of_typed_messages_unchanged`).

    `prompt(text, images?)` (Layer 08, PASS 3, `L08-R007`): pinned Pi''s own convenience overload,
    confirmed against source -- a plain string (optionally with images) normalizes into exactly one
    `UserMessage` whose content is `[{type:"text",...}, ...images]`, text first then the supplied
    images in order. This is an ADDITIONAL accepted form, not a narrowing of the typed
    `Message | tuple[Message, ...]` boundary AG-006 already certified above -- both forms coexist
    unchanged (`test_prompt_accepts_a_plain_string`,
    `test_prompt_string_with_one_image_orders_text_then_image`,
    `test_prompt_string_with_multiple_images_preserves_order`,
    `test_prompt_accepts_a_tuple_of_typed_messages_unchanged`).

    `continue_()` rejects with its own, DIFFERENT exact text ("Agent is already processing. Wait
    for completion before continuing.") while active (`test_continue_rejects_while_active`);
    rejects with "No messages to continue from" on an empty transcript
    (`test_continue_rejects_with_no_transcript`); when the last message is assistant, drains
    steering (else follow-up, else rejects with "Cannot continue from message role: assistant")
    (`test_continue_drains_steering_when_last_message_is_assistant`,
    `test_continue_drains_follow_up_when_last_message_is_assistant_and_no_steering`,
    `test_continue_rejects_when_last_message_is_assistant_and_nothing_queued`); otherwise runs a
    plain continuation (`test_continue_sends_full_history_when_last_message_is_not_assistant`).

    A THIRD, distinct "already processing" string
    (`runWithLifecycle`''s own internal guard, "Agent is already processing.") is also reproduced,
    in `_run_wrapped`, defensive against a caller bypassing `prompt()`/`continue_()`''s own public
    checks -- pinned Pi keeps this dead-under-normal-use guard too, for the same reason
    (`test_run_wrapped_defensive_guard_rejects_when_not_idle`). All four "already processing"
    strings across the certified surface (this row''s two, `runWithLifecycle`''s, and Layer-07''s own
    certified `reset()` string) are distinct, matching pinned Pi exactly -- never consolidated into
    one shared message.'

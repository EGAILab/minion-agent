    `L09-R007`: this row''s own rule states `signal` is live for the run''s ENTIRE active duration
    and `None` while idle. `AgentInstance.set_status` emits `agent/status` and calls `on_status_
    change` SYNCHRONOUSLY (`AG-008`), so a status-transition observer runs INSIDE the same
    synchronous call that publishes RUNNING/IDLE. PASS 1 through PASS 3''s own `_run_wrapped`
    published RUNNING BEFORE calling `_start_run_signal()`, and published IDLE BEFORE calling
    `_end_run_signal()` -- so a RUNNING observer saw `instance.signal is None` (its own `abort()`
    call was consequently a no-op) and an IDLE observer saw the JUST-FINISHED run''s still-live
    signal, not `None`. The independent review''s own executable witness: `status_observations =
    [(''running'', True, None), (''idle'', False, False)]` -- read as "the RUNNING observer saw NO
    signal (`True` marks the defect), and its `abort()` call left the following request
    un-aborted; the IDLE observer saw a NON-`None` signal (`False` marks the defect)." Remediation:
    `_run_wrapped` now calls `_start_run_signal()` BEFORE `set_status(RUNNING)`, and `_end_run_
    signal()` BEFORE `set_status(IDLE)` -- reordering only the signal calls relative to `set_
    status`, without changing the relative order of `set_status`/`streaming_message`/`error_
    message`/`pending_tool_calls` themselves, which `AG-008` already certifies matches pinned Pi''s
    own `runWithLifecycle`/`finishRun` write order. A new discriminating test registers `on_status_
    change`, reads `instance.signal` and calls `instance.abort()` during the RUNNING callback, and
    reads `instance.signal` during the IDLE callback -- confirmed to FAIL against the PASS-3
    candidate (RUNNING observer saw `None`; the following request''s own signal was NOT aborted),
    then to PASS once the reorder was applied.

    PASS-4''s own fix survived one more targeted review (`L09-R008`/`L09-R009` provisionally

- id: AG-005
  phase: 3
  pi: packages/agent/src/agent-loop.ts::runLoop
  surface: follow-up timing
  rule: 'Layer 08, PASS 2, resolved this pass -- a genuine architectural gap, not merely an
    evidence gap (`PI_PARITY_DEFECT`, closed): PASS 1''s own assurance disclosed that Minion''s
    `run_until_idle()` pump started a *new* `AGENT_START`/`AGENT_END` bracket per queued follow-up
    batch, rather than continuing the *same* run the way pinned Pi''s own outer `runLoop` loop does
    (`pendingMessages = followUpMessages; continue outer` when the inner loop has exhausted and
    follow-up is queued -- confirmed directly against source, agent-loop.ts:261-272). This pass
    restructures `AgentLoop._run_inner` into pinned Pi''s real nested loop shape: an inner loop over
    turns within one continuation, and an outer loop that polls follow-up only once the inner loop
    would otherwise exit (no more tool calls, no steering claimed) and, if follow-up is found,
    continues the *same* run rather than returning. `run_until_idle()` itself is now a thin pump
    over this: it still claims one batch and calls `_run_wrapped` once per claim, but because
    `_execute_run` now drains follow-up internally while a run stays open, a single pump iteration
    typically consumes every queued follow-up batch in one run -- the outer pump''s own loop becomes
    a safety net for the one case pinned Pi does NOT auto-continue either (a `shouldStopAfterTurn`
    listener stopping the run early while follow-up is still queued; Pi would leave that queued for
    an explicit `continue()` call, and Minion''s pump substitutes for that, an already-disclosed,
    intentional extension -- AG-019''s own wake note).

    The prior text''s own citations (`followup-only-when-otherwise-idle`,
    `terminate-allows-follow-up-when-otherwise-idle`) were both unfilled placeholders and are not
    cited here.'

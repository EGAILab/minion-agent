    used to deliver that behavior, not the behavior itself.

    `L09-R010`: the convergence contract (`assurance/layers/09-active-abort-contract-checkpoint-
    r007-convergence.md`) approved an OBSERVABLE rollback result and explicitly left the mechanism
    implementation-owned -- it did not approve a new unrestricted caller-facing operation. PASS 5''s
    own `Inbox.restore(target, envelopes)` was an ordinary PUBLIC method: it accepted any envelope
    tuple, tracked no claim ownership, and had no one-shot guard, so ANY caller could restore an
    envelope still queued and never claimed, restore the same envelope repeatedly, or move a
    claimed batch across targets -- manufacturing duplicate queue entries sharing the same id and
    directly contradicting `AG-011`''s own certified exactly-once invariant. The independent
    review''s own executed witness: `inbox.followup(a); inbox.restore(NEXT_TURN, (a,))` produced
    TWO entries sharing `a`''s own id; calling `restore` again produced three -- with no claim or
    failed run-entry involved at all. Pinned Pi''s own `PendingMessageQueue` is PRIVATE to `Agent`
    and exposes no restore operation a caller could misuse this way; Minion''s `Inbox` is
    intentionally public, so this method''s own visibility was itself observable, not a
    Python-only implementation detail dismissible as such.

    Remediation removes the restoration surface entirely rather than merely restricting it --
    `Inbox.restore` no longer exists at all. `Inbox.peek(target, policy)` (new, PUBLIC, read-only)
    returns exactly what `claim(target, policy)` would, without removing anything -- structurally
    incapable of corrupting the queue no matter how a caller uses it, since it never mutates
    anything. The actual destructive removal is deferred to `Inbox._commit_claim(target,
    envelopes)` (new, PRIVATE -- the same "Layer 07 owns vocabulary, Layer 08 owns per-run
    lifecycle" split already established for `AgentInstance._start_run_signal`/`_end_run_signal`),
    called by `AgentLoop._run_wrapped` itself ONLY once `set_status(RUNNING)` has already
    succeeded, with no intervening `await` between the caller''s own `peek()` and `_run_wrapped`''s
    own commit. `continue_()`''s steering/follow-up branches and `run_until_idle()`''s follow-up
    claim now PEEK, not `claim()`, before calling `_run_wrapped`, passing a `commit_entry_claim`
    closure `_run_wrapped` invokes only on success. A RUNNING-notification failure therefore needs
    NO restoration step at all: nothing was ever removed from `Inbox` in the first place, so there
    is nothing to put back and no way to duplicate an id -- `_commit_claim` is removal-only, by
    COUNT from the queue''s own front, and structurally cannot INSERT an envelope, so even a
    caller that bypasses the `_` naming convention and calls it directly, repeatedly, can only
    ever remove more of whatever is currently queued, never manufacture a duplicate.

    Nine tests changed in `agent/test_inbox.py`: the four PASS-5 `Inbox.restore` unit tests are
    replaced with `peek`/`_commit_claim` unit coverage plus two dedicated negative witnesses --
    `test_the_old_public_restore_method_no_longer_exists` (asserts `hasattr(inbox, "restore")` is
    now `False`) and `test_the_reviewers_duplicate_id_witness_is_no_longer_expressible` (reproduces
    the review''s own exact scenario and asserts it now raises `AttributeError` instead of
    manufacturing a duplicate id) -- the required negative evidence the review asked for. All
    eight PASS-5 `agent_loop/test_active_abort.py` preclaimed-input/status-signal witnesses needed
    NO changes at all and continue to pass unchanged, confirming the OBSERVABLE contract is
    identical under the new mechanism -- only the internal implementation changed. Confirmed via
    revert-and-confirm: all nine new/changed `test_inbox.py` tests were run against the reverted
    PASS-5 candidate and FAILED as expected (the two negative witnesses specifically reproduced the
    review''s own duplicate-id defect before the fix, and correctly could not after), then PASSED
    once restored; the eight `test_active_abort.py` witnesses were confirmed unaffected by the
    revert (passed both before and after, since they exercise observable behavior only).

    PASS 7 (targeted re-review of the PASS-6 candidate): `L09-R007`/`L09-R010` `PROVISIONALLY
    CLOSED`, but two new findings blocked the final review -- `L09-R011` (`CONTRACT_ASSURANCE_
    DEFECT`) and `L09-R012` (`CONTRACT_ASSURANCE_DEFECT`, documentary, see `AG-011`).

    `L09-R011`: PASS 6''s own `_commit_claim` removed envelopes by COUNT from the queue''s own
    front (`queue[:len(envelopes)] = []`), never checking that the envelopes actually still
    occupying that front were the SAME ones a prior `peek()` returned. The synchronous RUNNING
    notification `_run_wrapped` awaits BETWEEN peek and commit may itself call any public `Inbox`
    operation on the same target before returning normally -- claim the peeked envelopes itself,
    clear the target, enqueue more input, or any combination. The independent review''s own
    executable witness: queue `A, B`; `A` peeked; the RUNNING observer itself claims `A` and
    returns (queue now `[B]`); a count-only commit for the peeked `(A,)` then deleted `B` too --
    input never selected for this run and never touched by the observer''s own action. Remediation:
    `_commit_claim` now verifies IDENTITY, position by position (`queue[i] is not envelopes[i]`),
    not merely count, before removing anything -- if the queue''s own front no longer matches
    exactly what was peeked, it removes NOTHING at all, leaving whatever the observer itself
    already did as the sole source of truth for that target. Two new through-the-real-driver
    witnesses reproduce the review''s own required scenarios (`ONE_AT_A_TIME` observer-claims-the-
    peeked-envelope; `ClaimPolicy.ALL` observer-clears-and-enqueues), plus two new `Inbox`-level
    unit tests; the existing `test_calling_commit_claim_repeatedly_only_removes_never_duplicates`
    (PASS 6) was itself flagged by the review as codifying the exact defect (it asserted an
    UNRELATED envelope `B` was ALSO removed by a second commit call) and is corrected to assert
    the fixed, safe-no-op behavior instead -- renamed `test_calling_commit_claim_again_with_a_
    stale_batch_is_a_safe_no_op`.

    `L09-R012` (documentary only, no code/behavior change): `AG-011`''s own `python:` evidence
    pointer still named the removed `Inbox.restore`, contradicting that same row''s own already-
    corrected prose (updated under `L09-R010`) and the actual current implementation. Corrected to

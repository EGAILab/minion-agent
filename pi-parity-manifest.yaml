- id: AG-006
  phase: 3
  pi: packages/agent/src/agent.ts::Agent.prompt / Agent.continue
  surface: prompt/continue caller rules
  rule: 'Layer 08, PASS 2, resolved this pass -- a genuine implementation gap, not merely an
    evidence gap (`PI_PARITY_DEFECT`, closed): `AgentInstance`/`AgentLoop` had no `prompt()`/
    `continue()`-equivalent public entry points at all before this pass; `run_until_idle()` only
    ever drained whatever was already queued, with no caller-facing rejection surface. This pass
    adds `AgentLoop.prompt(message)` and `AgentLoop.continue_()` (`continue` is a Python keyword),
    reproducing pinned Pi''s exact caller rules, confirmed directly against source (agent.ts:

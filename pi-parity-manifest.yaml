- id: TOOL-015
  phase: 4
  pi: 'N/A -- Minion registry architecture, see TOOL-010'
  surface: disposed requesting-scope observation
  rule: 'previously untraced (L05-R002, CONTRACT_ASSURANCE_DEFECT): a disposed/inactive requesting

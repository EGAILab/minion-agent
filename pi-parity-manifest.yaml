- id: TOOL-005
  phase: 4
  pi: packages/agent/src/agent-loop.ts::finalizeExecutedToolCall
  surface: after hook success-path merge and failure conversion
  rule: 'the after-hook may replace content/details/usage/terminate/is_error field-by-field --
    omitted fields keep their prior value, no deep merge (removing a key requires supplying the
    whole replacement). tool_call_id, tool_name, and added_tool_names are NOT overridable fields
    at all; a hook cannot add, remove, or replace them. This is enforced structurally at the
    production dispatch boundary (_finalize), not merely by a constrained registration helper
    (L06-R003, corrected a THIRD time this pass): register_after_tool_call_hook accepts a hook
    returning an AfterToolCallOverride (exactly Pi''s five AfterToolCallResult fields) or None, a
    type with structurally no slot for identity/added_tool_names -- but tools/post-execute remains
    a public Runtime event, so a raw ctx.events.on(TOOLS_POST_EXECUTE, ...) registration could
    still return/replace the entire ToolResult and observably rewrite those fields even after the
    first repair (a genuine PI_PARITY_DEFECT the independent Rust re-review caught: the helper
    alone is convention, not enforcement). A second repair had _finalize unconditionally restore
    tool_call_id/tool_name/added_tool_names after the ENTIRE tools/post-execute waterfall
    completed -- correct for the final result, but the Rust final-closure review proved a listener
    could still delegate a forged replacement to a LATER listener via next(...), which observed
    the forgery before the end-of-waterfall restoration ever ran, and could copy it into an
    allowed field such as details. The actual rule -- and the third repair -- is per-step, not
    final-only: EventBus.waterfall''s normalize_step parameter (an additive, opt-in per-dispatch
    hook, not a change to any other event''s default behavior) now restores identity/
    added_tool_names on every listener-to-listener handoff, so no listener anywhere in the chain,
    helper-registered or raw, ever observes a predecessor''s unauthorized replacement -- only a
    listener that short-circuits without delegating skips normalize_step, and that value is still
    covered by the (retained) end-of-waterfall restoration since there is no next listener to
    protect from. If the after-hook itself throws, the ENTIRE prior result -- success or failure,
    with whatever usage/details/terminate it carried -- is discarded and replaced with a plain
    error result (message per L06-R002, no class-name prefix). This is a replacement, not a merge.
    With N listeners (L06-R006, an intentional Minion architectural extension pinned Pi does not
    itself define): each sees the result exactly as merged AND normalized by every earlier
    listener; a mid-chain exception stops later listeners and replaces the accumulated result the
    same way a single listener''s exception would -- true for a mix of helper-registered and raw
    listeners alike, in either registration order. Omitted vs. explicit override (IR-L06-002,
    PI_PARITY_DEFECT, Rust-only, OPEN): re-audited directly against pinned Pi''s
    AfterToolCallResult -- every field is a single-level optional (e.g. details?: unknown), merged
    by nullish-coalescing; Pi has no way to distinguish "the hook explicitly cleared this field" from
    "the hook omitted it" -- both are the same absent/undefined value. Python''s AfterToolCallOverride
    (decisions.py) mirrors this exactly: flat `X | None` fields with no second Optional layer, so
    Python is structurally incapable of representing the extra "clear" state Pi lacks -- already
    conformant, proven by test_omitted_fields_are_unchanged/test_there_is_no_deep_merge, no Python
    change needed. Independent review found Rust''s AfterToolCallOverride instead uses a doubly-
    nested Option (Option<Option<Value>> for details, Option<Option<Usage>> for usage), which DOES
    expose that extra, Pi-incompatible "explicitly clear" state at the public API boundary -- a
    genuine language-specific defect, not a shared-contract gap: this row''s RULE already states
    the correct nullish semantics precisely enough for a conforming Rust type; the Rust API itself
    still needs repair (assurance/layers/05-06-independent-review-remediation.md), out of scope for
    this shared/Python-only pass.'
  tests:

    Agent-surface point that applies to AG-011''s `steer`/`follow_up`). This is new Python
    implementation added a prior pass -- the corresponding Pi operations had no Minion equivalent
    at all before it (`CONTRACT_ASSURANCE_DEFECT`, resolved: a genuine Pi-visible public operation
    was simply missing, not merely undocumented). Clearing does not touch the independent wake/
    settle signal a host driver (Layer 08) uses to decide when to poll a target -- an orthogonal
    concern pinned Pi has no analogue for at all (`wake_requested`/`take_wake` are an intentional
    Minion architectural extension with no Pi counterpart, not Pi parity -- see AG-019, which owns
    wake''s own disposition; an earlier revision of this cross-reference pointed at AG-014 instead,
    stale since the manifest split that created AG-019 -- flagged by the third independent Rust
    review as a nonblocking traceability issue and corrected here),
    so this row does not constrain it either way beyond noting the two are intentionally decoupled.
    This row is scoped to clearing/pending ONLY; pinned Pi''s `reset()` is a separate, broader
    operation with its own requirement (`AG-016`) -- an earlier revision of this row also described
    reset, calling fresh-instance replacement an intentional divergence while keeping this row''s
    own disposition `adopted`, an incoherent pairing the independent review caught: that
    description is removed here, not merely re-labeled, since AG-016 now owns reset on its own
    terms. Language-neutral canonical evidence (`L07-R004`):

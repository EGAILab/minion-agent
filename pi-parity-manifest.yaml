  - test_omitted_fields_are_unchanged
  - test_there_is_no_deep_merge
  - test_a_hook_cannot_override_execution_identity_or_added_tool_names
  - test_a_hook_that_returns_none_leaves_the_result_unchanged
  - test_a_raising_after_hook_replaces_the_entire_prior_result

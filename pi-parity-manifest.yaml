- id: AG-004
  phase: 3
  pi: packages/agent/src/agent-loop.ts::runLoop
  surface: turn definition/order
  rule: 'Layer 08, PASS 3 (this pass) -- the coherent current statement, superseding PASS 1''s
    disclosed gap and PASS 2''s mis-scoped `prepareNextTurn`, both of which the independent Rust
    review of the PASS-2 candidate caught (`L08-R001`, `L08-R004`).

    A turn is exactly one assistant response plus the tool calls/results it triggers -- never more
    than one provider request -- bracketed by `turn_start`/`turn_end`, confirmed directly against
    `runLoop` (agent-loop.ts:95-275; unchanged since PASS 1, `_run_step` owns exactly one bracket).

    The complete post-turn ordering, confirmed directly against `runLoop`''s own body
    (agent-loop.ts:161-245): `turn_end` (`_run_step`''s own close) -> `prepareNextTurn` ->
    `shouldStopAfterTurn` -> steering poll for the next turn -> follow-up polled only if the run
    would otherwise stop (`AG-005`). PASS 1 disclosed `prepareNextTurn` as an unimplemented,
    tracked gap; PASS 2 implemented an event (`AGENT_PREPARE_NEXT_TURN`) but let it replace only
    `system_prompt`, a truncation the independent review caught against the exact source:
    `AgentLoopTurnUpdate.context: AgentContext` replaces the WHOLE `{systemPrompt, messages, tools}`
    object, not one field (types.ts:138-145; `runLoop`''s own
    `currentContext = nextTurnSnapshot.context ?? currentContext`, agent-loop.ts:226-231 -- a
    whole-object swap via `??`, never a per-field merge). `model`/`thinkingLevel` are independently
    optional per-field replacements alongside it (agent-loop.ts:232-238), with the same
    `"off"`-vs-`undefined` special case already certified at Layer-07 `AG-014`.

    PASS 3 corrects the implementation to match: `RunConfigUpdate.context: RunContext | None`
    replaces `_run_inner`''s run-local `context` wholesale when set
    (`if update.context is not None: context = update.context`), while `RunConfigUpdate.model`/
    `.thinking_level` remain independent optional replacements on the run-local `RunConfig`. The
    replacement is proven run-local-only, never persisted back to the certified Layer-07
    `AgentInstance`, and never leaking into an unrelated second run
    (`test_prepare_next_turn_can_replace_the_whole_context`,
    `test_prepare_next_turn_can_replace_model_and_thinking_level`,
    `test_prepare_next_turn_context_replacement_does_not_persist_to_the_next_run`). Listener
    signatures for both `AGENT_PREPARE_NEXT_TURN` and `AGENT_TURN_STOPPING` now mirror pinned Pi''s
    own `PrepareNextTurnContext`/`ShouldStopAfterTurnContext` exactly --
    `(message, tool_results, context, new_messages)`, not the tool-batch-outcome-only shape PASS 2
    passed listeners -- confirmed against types.ts:126-147
    (`test_should_stop_and_prepare_next_turn_receive_pis_full_context`).

    `terminate`''s own scope is unchanged and remains correctly narrow (`TOOL-007`): it suppresses
    only the tool-driven inner-loop continuation (`has_more_tool_calls`), never `prepareNextTurn`/
    `shouldStopAfterTurn`/the steering poll for that same turn -- still evidenced by
    `test_a_stop_decision_ends_the_turn_early`/`test_no_opinion_continues`.

    A represented `error`/`aborted` assistant message is the one turn-ending case this ordering
    does NOT apply to at all: pinned Pi returns immediately after that turn''s own `turn_end`,
    running none of `prepareNextTurn`/`shouldStopAfterTurn`/the steering or follow-up poll
    (agent-loop.ts:196-200) -- certified separately at `AG-021` (`L08-R008`), not a carve-out of
    this row''s own ordering claim.

    PASS 4 (`L08-R004`): this row''s own content was already correct and evidenced when the
    independent re-review ran -- the defect it found was that `spec/agent.md`''s normative Layer-08
    section still described PASS-2''s narrower `prepareNextTurn` and a stale `streaming_message`
    text-only claim, contradicting this row and the actual implementation. PASS 4 rewrote
    `spec/agent.md`''s Layer-08 section as one coherent current statement (no historical PASS-1/
    PASS-2 narrative mixed into normative text) and ran a full consistency pass across pinned Pi,
    this manifest, `spec/agent.md`, canonical conformance, and the Python implementation together --
    not merely re-reading the lines the review named.'

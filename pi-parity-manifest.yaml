- id: AI-026
  phase: 2
  pi: packages/ai/src/api/transform-messages.ts::transformMessages
  surface: legacy null content normalization
  rule: 'null/undefined legacy content normalizes to role-valid empty content before typed XFORM stages execute
    (XFORM-001, spec/target-model-transformation.md rule 1), unconditionally, first, on every role. The
    normalization is library-owned at the dynamic/legacy transform boundary, not Session-owned and not
    runner-owned -- language-neutral wording corrected by XFORM-R007, which no longer overstates a
    single-implementation architecture (see the python:/rust: fields for where each implementation places the
    boundary).'
  tests:
  - null-content-normalizes-empty
  python: 'src/minion_agent/llm/transform_messages.py::_normalize_legacy_content -- Python''s dataclasses cannot
    themselves hold null content statically (unlike Pi''s TS types, unenforced at runtime), so the defensive
    normalization lives directly inside the typed transform entry, matching Pi''s own placement exactly.'
  rust: 'minion-agent-rust/crates/minion-agent/src/llm/transform_compat.rs::transform_legacy_messages -- Rust''s
    typed Message cannot represent null content at all, so the dynamic/legacy compatibility boundary is a
    separate, feature-gated module (only reachable behind the non-default `conformance` feature) that decodes
    untyped JSON into the typed Message vocabulary before delegating to the ordinary typed transform_messages();
    it is not inside transform_messages() itself. Merged PR #7 @ 439651e;
    tests/llm_transform.rs::legacy_null_content_is_normalized_by_the_library_before_typed_transformation.'
  disposition: adopted
- id: AG-001
  phase: 3
  pi: packages/agent/src/agent-loop.ts::runAgentLoop
  surface: initial prompt event order
  rule: 'Layer 08, PASS 1 (this pass): `agent_start -> turn_start -> initial prompt message
    lifecycle`, confirmed directly against `runAgentLoop` (agent-loop.ts:95-118): it emits
    `agent_start`, `turn_start`, and one `message_start`/`message_end` pair per initial prompt
    message, in that order, before `runLoop`''s own body ever runs.

    This row previously cited only the still-unfilled placeholder scenario
    `initial-prompt-order-after-turn-start` (`TO_BE_FILLED_FROM_PINNED_PI_BEHAVIOR`) as its
    evidence while carrying `disposition: adopted` -- a false certification claim this pass
    corrects, not merely re-labels: nothing backed it. `driver.py` itself also had this order
    backwards until this pass (`USER_MESSAGE` appended before `TURN_START`, the reverse of Pi''s
    own order), caught by the corrected canonical scenarios below failing until the append order
    was swapped. That placeholder scenario remains unfilled and is not cited as evidence here;
    real evidence exists via the already-passing legacy-shape scenarios and focused tests listed
    below. Filling the placeholder itself (a differently-shaped, `family`/`given`/`when`/`expect`
    unified scenario) is left as separate, explicitly flagged follow-up work, not silently
    dropped.'
  tests:
  - test_the_turn_is_logged_in_order
  - turn-lifecycle (legacy-shape canonical)
  - tool-round-trip (legacy-shape canonical)
  python: src/minion_agent/agent_loop/driver.py::AgentLoop._run_once/_run_step
  rust: PENDING -- Layer 08 not yet implemented in Rust
  disposition: adopted
- id: AG-002
  phase: 3
  pi: packages/agent/src/agent-loop.ts::runAgentLoop / runLoop
  surface: initial steering poll
  rule: 'Layer 08, PASS 4 (this pass), correcting a PASS-3 ordering defect the independent Rust
    re-review caught (`L08-R006`): pinned Pi''s `runAgentLoop` emits `agent_start`, `turn_start`,
    then the initial prompt messages'' own COMPLETE `message_start`/`message_end` lifecycle, and only
    THEN does `runLoop`''s own body run -- whose first statement is the initial steering poll
    (`pendingMessages = getSteeringMessages() ?? []`), confirmed directly against source
    (agent-loop.ts:95-118, 161). The initial steering claim is strictly a post-prompt-lifecycle
    event, not merely a post-`turn_start` event.

    PASS 3''s own fix was necessary but insufficient: it moved `TURN_START` before the initial claim,
    but the claim (`_claim_step_input()`) still ran before the prompt''s own messages were admitted
    at all -- `_run_step` logged the ENTIRE combined `entering + claimed_steering` batch together,
    afterward. A listener present at claim time would observe `TURN_START` already logged but NOT
    the prompt''s own lifecycle -- observably weaker than pinned Pi''s real order. PASS 4 restructures
    `_run_inner`''s first-turn handling into two explicit, sequential admission stages, each using
    the SAME `AgentLoop._admit_messages` helper every other admission point already uses: (1) a
    `PreStepReason.INITIAL` decision governs `entering` (the caller''s own prompt) ALONE, admitted
    (logged, dispatched live, and accumulated into `context.messages`/`new_messages`) immediately;
    (2) only THEN is `_claim_step_input()` called, and if non-empty, a SECOND, independent
    `PreStepReason.STEERING` decision governs the claimed batch, admitted the same way. Both
    decisions'' messages feed the SAME first provider request (pinned Pi never splits them into
    separate turns) -- only their own admission/lifecycle timing is staged. Proven with a listener
    trace across BOTH the live `AGENT_LIFECYCLE_EVENT` seam (proving the prompt''s own
    `message_start`/`message_end` fire before the steering-reason claim marker) and the final
    request (proving both messages still land in one combined request)
    (`test_the_initial_prompt_lifecycle_precedes_the_steering_claim`).

    `continue-steering-no-double-drain` (unchanged since PASS 2): pinned Pi''s `Agent.continue()`
    pre-drains steering itself when the last transcript message is assistant, then sets a one-shot
    `skipInitialSteeringPoll` flag so the freshly started run''s own initial poll does not claim the
    identical batch a second time. `AgentLoop.continue_()` reproduces this exactly: its
    steering-drain branch passes `skip_initial_steering_poll=True` into `_run_wrapped`/
    `_execute_run`/`_run_inner`, which then skips stage (2) above entirely, and stage (1) alone
    admits the pre-drained batch under `PreStepReason.INITIAL`
    (`test_continue_does_not_double_drain_steering_after_pre_drain`).'
  tests:
  - test_the_initial_prompt_lifecycle_precedes_the_steering_claim
  - test_the_initial_steering_claim_happens_after_turn_start
  - test_a_rejection_during_the_initial_steering_admission_ends_the_turn
  - test_steering_is_claimed_at_the_step_boundary
  - test_continue_drains_steering_when_last_message_is_assistant
  - test_continue_does_not_double_drain_steering_after_pre_drain
  python: src/minion_agent/agent_loop/driver.py::AgentLoop._run_inner (staged first-turn admission), AgentLoop._admit_messages, AgentLoop.continue_ (skip_initial_steering_poll)
  rust: PENDING -- Layer 08 not yet implemented in Rust; both the PASS-2 (L08-R006) and PASS-3 (L08-R006) candidates were independently rejected on this row, PASS 4 is the remediated candidate awaiting re-review
  disposition: adopted
- id: AG-003
  phase: 3
  pi: packages/agent/src/agent-loop.ts::runAgentLoopContinue
  surface: continuation invocation output
  rule: 'Layer 08, PASS 2, resolved this pass: pinned Pi''s `runAgentLoopContinue` seeds
    `newMessages` empty (`[]`), unlike `runAgentLoop`''s own prompt-message pre-seed -- so a plain
    continuation''s `agent_end.messages` carries only what that invocation itself produced, never
    the pre-existing transcript, confirmed directly against source (agent-loop.ts:120-143).

    Section 1''s audit (`CONTRACT_ASSURANCE_DEFECT`, this row''s prior text): the row previously had
    no implementation to be true OF at all -- `AgentInstance`/`driver.py` had no `continue_()`
    entry point, and its sole citation (`agent-end-messages-prompt-vs-continuation`) was an
    unfilled placeholder. Both gaps are closed this pass. `AgentLoop.continue_()` (new) implements
    pinned Pi''s full branch structure: last-message-assistant steering/follow-up pre-drain (both
    pre-seeded, `runAgentLoop`-style, matching Pi''s own routing of that sub-case through
    `runPromptMessages` rather than `runAgentLoopContinue` -- confirmed by direct audit, not
    assumed), and the plain-continuation case (last message not assistant) with empty entering
    messages (`entering=()`), letting `_execute_run`''s run-scoped `AgentEnd.messages` accumulator
    (Layer 08, PASS 2 -- see AG-010) naturally produce an empty-until-this-run''s-own-content list,
    exactly matching `runAgentLoopContinue`''s own empty seed
    (`test_continue_sends_full_history_when_last_message_is_not_assistant`, which additionally
    proves the request still carries the FULL prior history even though nothing new entered).
    `agent-end-messages-prompt-vs-continuation` remains unfilled and is not cited here; real
    evidence exists via the language tests and the `continuation-excludes-the-prior-runs-messages`
    canonical scenario (language-neutral, exercises the steering/follow-up-drain pre-seeded
    sub-case specifically -- see that scenario''s own description for why it does not claim to
    prove the plain empty-seeded case, which remains Python-test-only).'
  tests:
  - test_continue_sends_full_history_when_last_message_is_not_assistant
  - continuation-excludes-the-prior-runs-messages (language-neutral canonical)
  python: src/minion_agent/agent_loop/driver.py::AgentLoop.continue_, AgentLoop._execute_run
  rust: PENDING -- Layer 08 not yet implemented in Rust
  disposition: adopted
- id: AG-004
  phase: 3
  pi: packages/agent/src/agent-loop.ts::runLoop
  surface: turn definition/order
  rule: 'Layer 08, PASS 3 (this pass) -- the coherent current statement, superseding PASS 1''s
    disclosed gap and PASS 2''s mis-scoped `prepareNextTurn`, both of which the independent Rust
    review of the PASS-2 candidate caught (`L08-R001`, `L08-R004`).

    A turn is exactly one assistant response plus the tool calls/results it triggers -- never more
    than one provider request -- bracketed by `turn_start`/`turn_end`, confirmed directly against
    `runLoop` (agent-loop.ts:95-275; unchanged since PASS 1, `_run_step` owns exactly one bracket).

    The complete post-turn ordering, confirmed directly against `runLoop`''s own body
    (agent-loop.ts:161-245): `turn_end` (`_run_step`''s own close) -> `prepareNextTurn` ->
    `shouldStopAfterTurn` -> steering poll for the next turn -> follow-up polled only if the run
    would otherwise stop (`AG-005`). PASS 1 disclosed `prepareNextTurn` as an unimplemented,
    tracked gap; PASS 2 implemented an event (`AGENT_PREPARE_NEXT_TURN`) but let it replace only
    `system_prompt`, a truncation the independent review caught against the exact source:
    `AgentLoopTurnUpdate.context: AgentContext` replaces the WHOLE `{systemPrompt, messages, tools}`
    object, not one field (types.ts:138-145; `runLoop`''s own
    `currentContext = nextTurnSnapshot.context ?? currentContext`, agent-loop.ts:226-231 -- a
    whole-object swap via `??`, never a per-field merge). `model`/`thinkingLevel` are independently
    optional per-field replacements alongside it (agent-loop.ts:232-238), with the same
    `"off"`-vs-`undefined` special case already certified at Layer-07 `AG-014`.

    PASS 3 corrects the implementation to match: `RunConfigUpdate.context: RunContext | None`

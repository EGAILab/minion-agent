- id: TOOL-001
  phase: 4
  pi: packages/agent/src/agent-loop.ts::executeToolCalls
  surface: batch execution mode contagion
  rule: 'the run-level default being sequential, OR any tool call in the batch resolving to a
    tool whose own execution_mode is sequential, forces the entire batch to run one call at a
    time in source order -- not merely that one exclusive call, and not partial grouping around
    it (config.toolExecution === "sequential" || hasSequentialToolCall). An unresolvable name is
    never exclusive: it never runs, so it has no exclusivity to spread.'
  tests:
  - tool-batch-sequential-contagion
  - tool-batch-parallel
  - test_one_sequential_tool_serializes_the_whole_batch
  - test_a_sequential_tool_serializes_the_batch_from_any_position
  - test_an_unknown_tool_does_not_serialize_the_batch
  - test_the_run_level_default_serializes_the_batch_even_without_a_sequential_tool
  - test_the_run_level_default_is_parallel_when_unspecified
  python: src/minion_agent/tools/batch.py::execute_batch, _is_sequential
  rust: Phase 4 tools
  disposition: adopted
- id: TOOL-002
  phase: 4
  pi: packages/agent/src/agent-loop.ts::failToolCallsFromTruncatedMessage
  surface: length-stop tool safety
  rule: 'a length stop reason means the assistant output may carry truncated tool-call
    arguments; no call in the batch is resolved, prepared, validated, or executed -- not even an
    unknown-tool lookup runs. Each call becomes the identical error result in source order;
    tool_execution_start/tool_execution_end still fire for each; terminate is unconditionally
    False for this batch (never folded through the terminate rule at all).'
  tests:
  - length-stop-executes-no-tools
  - test_length_stop_executes_nothing_and_fails_every_call
  python: src/minion_agent/tools/batch.py::execute_length_stop_batch, src/minion_agent/agent_loop/driver.py (stop-reason dispatch)
  rust: Phase 4 tools
  disposition: adopted
- id: TOOL-003
  phase: 4
  pi: packages/agent/src/agent-loop.ts::prepareToolCall
  surface: prepare/validate failure conversion
  rule: 'prepareArguments and schema validation failures -> error tool result, execute skipped
    entirely. This is an "immediate" outcome (TOOL-017): the after-hook (tools/post-execute)
    never runs for it, distinguishing it from an execute() failure (TOOL-004), which does reach
    the after-hook. Validation applies to BOTH parameter representations with no exemption
    (L06-R001, corrected this pass -- an earlier revision let a raw JSON-Schema dict skip
    validation entirely, a genuine PI_PARITY_DEFECT, since pinned Pi''s validateToolArguments
    validates every Tool.parameters: TSchema with no such exemption): a pydantic-model-backed
    tool validates via pydantic; a raw, object-valued JSON-Schema dict validates via the
    `jsonschema` library against the exact Layer-05-approved schema. Neither path reproduces
    pinned Pi''s TypeBox-specific coercion algorithm byte-for-byte -- a disclosed, intentional
    divergence, not a validation exemption. Failure text is the validator''s own clean message,
    never a Python exception class name (L06-R002). ToolDefinition.parameters'' own docstring
    (definition.py) previously still said a raw dict was "not Python-validated" even after this
    row''s runtime fix landed -- a genuine CONTRACT_ASSURANCE_DEFECT (L06-R001, second closure):
    public documentation must agree with the actual production validator, not merely the
    manifest/spec. Corrected this pass; no further runtime change.'
  tests:
  - prepare-arguments-failure-becomes-tool-error
  - schema-validation-failure-becomes-tool-error
  - test_a_prepare_arguments_failure_produces_an_error_result
  - test_invalid_arguments_produce_an_error_result_the_model_can_act_on
  - test_a_raw_object_schema_accepts_valid_arguments
  - test_a_raw_object_schema_rejects_invalid_arguments
  - test_prepare_arguments_repairs_raw_schema_arguments_before_validation
  - test_prepare_arguments_can_invalidate_previously_valid_raw_schema_arguments
  python: src/minion_agent/tools/execute.py::_prepare, _validate, ArgumentValidationError, execute_call
  rust: Phase 4 tools
  disposition: adopted
- id: TOOL-004
  phase: 4
  pi: packages/agent/src/agent-loop.ts::prepareToolCall (before-hook), executePreparedToolCall (execute)
  surface: before hook + execution failure conversion
  rule: 'pinned Pi wraps prepareArguments + validateToolArguments + beforeToolCall in ONE
    try/catch: a before-hook listener that throws (rather than returning a structured block)
    collapses to the same generic error result as a prepare/validation failure -- an "immediate"
    outcome (TOOL-017), execute skipped, after-hook never runs. A beforeToolCall block
    (Minion: tools/pre-execute Block) is likewise immediate. execute() itself throwing/rejecting
    is a DIFFERENT outcome class: it reached execute(), so it still flows through the after-hook
    exactly like success would (TOOL-005). Failure text in every case is the raised error''s own
    message, never a Python exception class name prefixed onto it (L06-R002, corrected this pass
    -- an earlier revision emitted e.g. "RuntimeError: boom" instead of pinned Pi''s own
    error.message-only convention, "boom"). This holds identically whether zero, one, or several
    before-hook listeners are registered (L06-R006): a raised exception unwinds the whole
    waterfall regardless of listener count.'
  tests:
  - before-hook-failure-becomes-tool-error
  - execute-failure-becomes-tool-error

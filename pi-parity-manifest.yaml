  phase: 5
  pi: 'packages/ai/src/auth/oauth/openai-codex.ts (device_auth_id/user_code guards, `:219-224`;
    authorization_code/code_verifier guard, `:254`; access_token/refresh_token guard, `:138`) --
    field-type validation specifically, characterized here to disclose where this row intentionally
    does NOT reproduce Pi''s own observed runtime behavior'
  surface: Layer 11 Pass 2, Slice C -- PROV-012''s own provider-network response-field-type
    validation boundary (`L11-SC-R005`)
  rule: 'INTENTIONAL, NARROW, OWNER-APPROVED PI DIVERGENCE (`L11-SC-R005`, second independent Rust
    contract review; `GOVERNANCE_SOURCE` recorded verbatim at
    `https://github.com/EGAILab/minion-agent/issues/29#issuecomment-5676459844`, per
    `agent-workflow.md` §11.10).

    PINNED PI: for six `PROV-012` network-response fields (`device_auth_id`, `user_code`,
    `authorization_code`, `code_verifier`, `access_token`, `refresh_token`), pinned Pi''s own runtime
    validation is JAVASCRIPT TRUTHINESS ONLY, accepting any truthy value of any JSON type -- the
    TypeScript field annotations declaring these `string` are ERASED at runtime and enforce nothing;
    confirmed directly against `openai-codex.ts:219-224,254,138`, none of which performs a
    `typeof value === "string"` check on any of these six fields. A truthy JSON number, boolean, or
    object for any of them is NOT rejected by Pi''s own real code. Pi''s own downstream handling of
    such a value is well-defined, not merely unobserved: a non-string `code`/`code_verifier` reaching
    `exchangeAuthorizationCode`''s own `new URLSearchParams({...})` call is coerced via JavaScript''s
    own implicit `String()` conversion (empirically confirmed live against Node:
    `new URLSearchParams({code_verifier: 123})` -> `code_verifier=123`).

    MINION DECISION: this project does NOT reproduce that truthy-any-type acceptance for these six
    fields. At `PROV-012`''s own response-validation boundary, all six MUST be actual JSON strings; a
    present-but-non-string (truthy) value is rejected via the SAME invalid-response path an
    absent/falsy value already takes, never admitted into the typed Minion domain.

    RATIONALE: Pi''s own broader acceptance is a byproduct of erased JavaScript runtime typing at an
    external-data boundary, not a documented, load-bearing part of the real Codex OAuth API contract
    -- no confirmed real `auth.openai.com` response or Pi call site has ever been observed exercising
    it. Faithfully reproducing it would require widening TWO already-certified shared types
    (`PROV-006`''s own `OAuthCredential.refresh: str`; `PROV-014`''s own
    `AuthEventDeviceCode.user_code: str`) to an open `JsonValue`, and then standardizing JavaScript
    `String()`/`URLSearchParams` coercion semantics at every downstream consumer -- disproportionate
    for an edge case with no confirmed real trigger. Strict validation at this row''s own ingress
    instead preserves every already-certified typed surface unchanged and localizes the entire
    divergence to `PROV-012`''s own provider-response decoder alone.

    SCOPE, EXACTLY: this approval covers ONLY these six fields'' own type validation at `PROV-012`''s
    own response-decoding boundary. It does NOT authorize generalized stricter validation elsewhere
    in `PROV-012` (the `interval` field''s own rule is UNCHANGED Pi-faithful behavior, already a real
    `typeof` check, not covered by this divergence); does NOT change `PROV-006`''s own credential
    semantics; does NOT change `PROV-014`''s own interaction semantics; and does NOT authorize
    silently "cleaning up" any other Pi runtime quirk a future audit might find.

    RUST: this decision is a general instruction, not Python mechanics to replicate. Rust''s own
    typed request/response surfaces are expected to enforce this same string requirement naturally
    as part of ordinary strict deserialization; any Rust-specific representation is reviewed
    independently when Rust implements `PROV-012`.'

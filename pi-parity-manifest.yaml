  rule: 'Layer 08, PASS 2, resolved this pass -- narrowed to the transition-timing scope this row
    always meant to own (the config-facing subset -- `system_prompt`/`model`/`thinking_level`
    existence and initial values -- is already certified at Layer-07 `AG-014`; runtime-field
    vocabulary/initial values at `AG-018`; this row owns only WHEN each field changes during a run,
    which both of those explicitly deferred to Layer 08).

    `is_streaming`: pinned Pi''s `isStreaming` flips `true` at the very start of `runWithLifecycle`
    and `false`, unconditionally via `finally`, at `finishRun()` -- once per `prompt()`/`continue()`
    invocation, not once per pump. `AgentLoop._run_wrapped` reproduces this exactly, and -- a
    correction this pass makes to Minion''s own prior pump behavior, not a Pi-parity regression --
    `run_until_idle()` now calls `_run_wrapped` once per claimed batch rather than wrapping its
    whole multi-batch pump in one shared RUNNING/IDLE bracket, so status genuinely toggles per
    pi-equivalent run even when the pump drains several
    (`test_continue_rejects_while_active`/`test_prompt_rejects_while_active` prove the guard
    observes real-time status; `test_status_always_alternates`, unchanged, still holds since
    alternation does not depend on pair count).

    `streaming_message`: non-`None` for exactly the duration of one provider request, matching
    pinned Pi''s own `message_start`/`message_update` -> partial, `message_end` -> `None` write
    points. PASS 2''s own content-fidelity simplification (text-only, accumulated `TextDelta`s) was
    itself a false premise the independent Rust review caught (`L08-R003`): the already-certified
    Layer-02/04 `StreamChunk` type carries a complete `partial: AssistantMessage` field on EVERY
    variant (`stream.py`''s own module docstring -- "every chunk carries `partial`, the message as
    assembled so far"), confirmed directly against pinned Pi''s equivalent chunk shape too. PASS 3
    corrects this: `_run_step`''s own `log_chunk` closure sets
    `self.instance.streaming_message = chunk.partial` directly from each chunk''s own already-complete
    partial -- text, thinking, and tool-call content alike -- with no independent reconstruction
    from raw deltas attempted. Since the certified `MockAdapter` only ever streams text deltas, a
    test-local-only `_RichStreamAdapter` (implementing the same informal `Adapter` protocol,
    `tests/agent_loop/test_run_entry_points.py`) supplies the thinking/tool-call evidence without
    touching certified adapter code

- id: AG-016
  phase: 3
  pi: packages/agent/src/agent.ts::Agent.reset
  surface: in-place instance reset (assurance Layer 07)
  rule: 'L07-R003, PI_PARITY_DEFECT, fully resolved this pass (a prior pass classified the
    `messages`-clearing sub-piece as an unresolvable cross-layer dependency; the second independent
    Rust review correctly rejected that conclusion -- see below). Re-audited directly: `reset()`
    rejects outright while `this.activeRun` is set
    (`throw new Error("Agent is already processing. Wait for completion before resetting.")`,
    exact text), with no partial mutation on rejection. When idle, it clears `messages` (to `[]`),
    `isStreaming` (to `false`), `streamingMessage` (to `undefined`), `pendingToolCalls` (to a new
    empty `Set`), `errorMessage` (to `undefined`), and both queues -- and retains everything else:
    `systemPrompt`, `model`, `thinkingLevel`, `tools`, queue modes, `listeners`, and Agent object
    identity. It is a method that mutates `this` in place; it is never a replacement object.

    A prior revision substituted "create a fresh Agent instance" for this operation and called
    that substitution an intentional divergence while leaving this row (folded into `AG-013` at
    the time) at `disposition: adopted` -- an incoherent pairing an earlier independent review
    caught: fresh-instance replacement is observably different in identity, references, listener
    registrations, active-run rejection, and retained configuration, none of which a brand-new
    object can share with the one a caller was holding. `AgentInstance.reset()` (this pass) is
    genuinely in-place: the same `Inbox`/`SessionLog`/scope objects survive, only their content
    changes, exactly matching Pi (test_reset_is_in_place_not_a_fresh_instance,
    test_reset_retains_identity_configuration_and_tool_relationship). The exact rejection text and
    atomicity (no field touched before the precondition check) are both reproduced
    (test_reset_while_running_is_rejected_atomically).

    `messages` clearing (this pass, closing L07-R003 completely): a prior pass concluded
    `SessionLog` had no truncate/clear primitive and classified message-clearing as an
    unresolvable Layer-03 dependency. That conclusion was wrong -- it overlooked
    `session/operations.py::reset(log)`, an already-certified Layer-03 operation that appends a
    `session/reset` marker event rather than truncating the append-only log; `derive_messages`
    already treats the latest such marker as an exclusive floor
    (`effective_surface`/`_derive` in `session/derive.py`). `AgentInstance.reset()` now calls this
    exact function, so `AgentInstance.messages` reads `()` immediately after reset while the full
    event history remains intact and readable underneath, exactly matching Pi''s own observable
    behavior without adding any new primitive to `SessionLog` itself
    (test_reset_clears_messages_via_the_session_reset_marker,
    test_reset_preserves_full_history_for_audit_after_clearing_the_projection).

    Wake-on-reset (L07-R003, second independent Rust review -- specified normatively here, not left
    implicit): a pending `Inbox.wake_requested` signal, if any, is deliberately NOT cleared by
    `reset()`. This is an explicit decision, not an untested side effect of delegating to
    `clear_all()`: wake and queued content are orthogonal (see AG-013/AG-019), and pinned Pi has no
    wake concept to take a position on either way, so nothing about Pi parity constrains this
    choice. A wake that arrived before a caller reset an idle instance still describes a real,
    unconsumed signal, so it survives (test_reset_does_not_clear_a_pending_wake_signal).'
  tests:
  - test_reset_clears_runtime_state_and_both_queues
  - test_reset_clears_messages_via_the_session_reset_marker
  - test_reset_preserves_full_history_for_audit_after_clearing_the_projection

  surface: registration lifecycle (effect-owned; ownership, not first-of-plugin-or-scope, decides withdrawal)
  rule: 'registration is a reversible effect owned by whichever context performed it. An unscoped
    registration is fiber-owned: unloading the registering plugin withdraws it. A scoped
    registration (via ctx.scope(key)) is owned by that scope from registration onward: only that
    scope''s own disposal or an explicit handle withdrawal withdraws it -- unloading the
    registering plugin alone does not (L05-R003, previously underspecified this pass as an
    either/or; verified empirically against the certified Runtime''s Context.effect() routing,

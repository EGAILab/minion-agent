- id: TOOL-023
  phase: 4
  pi: packages/agent/src/agent-loop.ts::executeToolCallsParallel, prepareToolCall
  surface: sequential preflight barrier within a parallel batch
  rule: 'IR-L06-001, CONTRACT_ASSURANCE_DEFECT + PI_PARITY_DEFECT, found by independent review
    against a candidate both Python and Rust had already certified: "parallel" execution mode does
    NOT mean every call''s complete pipeline begins concurrently. Pinned Pi''s
    executeToolCallsParallel resolves/prepares/validates/before-hooks (prepareToolCall) every call
    STRICTLY SEQUENTIALLY, in source order -- tool_execution_start for call N+1 never fires until
    call N''s entire preflight has settled -- and starts execute()/the after-hook concurrently only
    once EVERY call in the batch has survived preflight (confirmed directly: prepareToolCall
    results are pushed into an array across a plain sequential for-loop; only entries of kind
    "prepared" become deferred closures, invoked together via a single Promise.all AFTER that loop
    completes). An immediate outcome (unknown tool, prepare/validate/before-hook exception, or an
    explicit before-hook block) finalizes -- and emits tool_execution_end -- right there in the
    sequential phase, before the barrier; it does not enter the concurrent phase, and does not
    block or delay any later call''s own preflight. A single asyncio.gather (or Promise.all) over
    each call''s WHOLE pipeline cannot express this: it preflights every call concurrently too,
    which is observably different from pinned Pi whenever a before-hook (or, in principle, prepare/
    validate) is slow, asynchronous, or order-sensitive across calls. The prior candidate did
    exactly that (batch.py::execute_batch wrapped execute_call -- resolve through after-hook -- in
    one asyncio.gather), which both Python and Rust had certified in agreement with each other,
    illustrating why prior certification is evidence, not semantic authority: agreement between
    implementations does not establish agreement with Pi. This barrier applies only within
    PARALLEL mode; TOOL-001''s sequential-serialization case trivially satisfies it already, since
    every call''s pipeline there completes fully before the next call''s preflight even begins.
    Language-neutral canonical evidence (PASS 1B, closing the shared-assurance half a first pass
    left open): parallel-preflight-settles-sequentially-before-execute needs no timing/sleep
    primitive -- a second call whose before-hook unconditionally blocks it produces an immediate
    outcome pinned Pi finalizes strictly before the first (executable) call may begin execute(),
    which a per-call-gather implementation cannot reproduce even without any artificial delay: the
    conformance schema gained expect_tool_trace (an ordered [stage, tool_call_id] execution trace
    -- start/before/execute/end -- observed directly against the real production executor, never
    constructed by the runner) to make this externally, cross-language observable. Confirmed
    directly to fail against the pre-fix candidate (temporarily restored the pre-fix execute.py/
    batch.py and re-ran this scenario alone: produced execute(t1)/end(t1) before before(t2)/
    end(t2)) and to pass after the fix. tool-batch-parallel remains, unchanged, the evidence that
    phase 2 (execute/finalize once every call has survived preflight) stays genuinely concurrent.'
  tests:
  - test_preflight_is_sequential_and_settles_before_any_execute_begins
  - test_an_immediate_preflight_failure_does_not_block_a_later_calls_preflight
  - parallel-preflight-settles-sequentially-before-execute (language-neutral canonical, PASS 1B)
  - tool-batch-parallel (unchanged; proves phase 2 remains concurrent)

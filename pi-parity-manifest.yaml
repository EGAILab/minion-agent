- id: EXEC-004
  phase: 6
  pi: 'packages/agent/src/harness/types.ts:285-315 (ShellExecOptions, Shell); env/nodejs.ts:136-
    238 (shell resolution), 278-345 (waitForChildProcess, the actual completion mechanism),
    367-500 (exec, the concrete process-management/timeout/abort/callback behaviors);

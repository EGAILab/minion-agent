- id: PROV-008
  phase: 5
  pi: 'packages/ai/src/auth/resolve.ts::resolveStoredOAuth:122-179 (double-checked-locking refresh);
    resolveProviderAuth:44-49 (stored-credential-owns-the-provider ownership comment)'
  surface: Layer 11 Pass 1 -- credential ownership / refresh mutation authority
  rule: 'A stored credential owns the provider: Minion may refresh/mutate it only through the
    store''s own serialized `modify()`, never by independently reading/rewriting a token from some
    other source outside this seam (no silent env/external fallback after a failed refresh). A
    refresh triggers when a credential is within the EFFECTIVE trigger window of expiring --
    `max(default_five_minutes, explicit_caller_minimum_or_zero)` -- matching Pi''s own
    `DEFAULT_OAUTH_MINIMUM_VALIDITY_MS`; the actual `refresh` callable runs INSIDE `modify()`''s own
    callback, re-checking expiry under the lock against that SAME effective threshold, so two
    concurrent callers that both observed "expiring soon" via the optimistic outside-lock read
    refresh EXACTLY ONCE -- the second sees the already-refreshed credential and returns it without
    calling `refresh` again. Errors split the same way Pi''s own `ModelsError` code does: the
    injected `refresh` callable failing raises `OAuthRefreshError`; the store''s own read/modify
    mechanism failing raises `CredentialStoreError`.

    Refresh signal/timeout (`L11-R002`, remediated): a prior revision called `refresh` with only
    the expiring credential, omitting Pi''s own `OAuthAuth.refresh(credential, signal)` second
    argument entirely. The corrected contract: `refresh` receives a live, `Abortable` second
    argument composing the CALLER''s own cancellation with a fixed 15-second timeout budget (Pi
    `AbortSignal.any([signal, AbortSignal.timeout(15_000)])`, `resolve.ts:149-153`) -- aborting on
    its own after the budget elapses even if the caller never cancels anything, so a hung refresh
    cannot hold this credential''s own store lock forever. This composition is an additive,
    auth-owned seam (`auth/signal.py::Abortable`/`CombinedSignal`), not a change to certified Layer
    09''s own poll-only `RunSignal`.

    Post-refresh threshold (`L11-R011`, remediated, final-complete-review finding): a prior
    revision post-validated a refreshed credential''s own new expiry against the RAW,
    caller-supplied `minimum_validity_ms` directly, instead of the SAME effective (`max`''d)
    threshold the initial trigger and under-lock recheck both already use. Pi''s own
    `resolveStoredOAuth` builds exactly ONE `expiresSoon` closure from the effective threshold and
    reuses it for all three checks -- there is no separate "raw explicit minimum" check anywhere in
    Pi. The bug was invisible whenever the explicit minimum was >= the five-minute default (the
    pre-existing test only covered that case); an explicit minimum SMALLER than the default (e.g.
    one minute) would incorrectly accept a refreshed credential still expiring within the default
    five-minute window. Corrected to reuse the SAME effective threshold for all three checks.

    Explicit-`NaN` threshold (`L11-R015`, new, fourth-final-complete-review finding): the effective
    threshold computation (`max(DEFAULT_MINIMUM_VALIDITY_MS, minimum_validity_ms or 0.0)`) used
    Python''s own plain `max()`, which silently discards a `NaN` `minimum_validity_ms` and falls
    back to the five-minute default (`max(300000.0, nan)` returns `300000.0` in Python) -- whereas
    Pi''s own `Math.max` PROPAGATES `NaN` if EITHER argument is `NaN`, making the effective
    threshold `NaN` too, which then makes EVERY `expiresSoon` comparison `False` (a comparison
    against `NaN` is always `False`), permanently SUPPRESSING refresh for that call regardless of
    actual proximity to expiry. Fixed with a dedicated `_js_style_max` helper that explicitly
    checks `math.isnan` on both operands before falling back to ordinary comparison, matching JS
    `Math.max`''s own NaN-propagation rule exactly rather than Python''s incidental one.'
  tests:
  - test_no_stored_credential_returns_none_without_calling_refresh
  - test_a_non_oauth_stored_credential_returns_none_without_calling_refresh
  - test_a_credential_with_ample_validity_is_returned_unrefreshed
  - test_a_credential_expiring_soon_is_refreshed_and_persisted
  - test_refresh_receives_a_combined_signal_reflecting_caller_abort
  - test_refresh_signal_aborts_on_its_own_after_the_timeout_budget_elapses
  - test_refresh_failure_raises_oauth_refresh_error_and_leaves_credential_unchanged
  - test_a_store_modify_failure_unrelated_to_refresh_raises_credential_store_error
  - test_a_store_read_failure_raises_credential_store_error
  - test_two_concurrent_expiring_callers_refresh_exactly_once
  - test_logged_out_meanwhile_returns_none
  - test_explicit_minimum_validity_override_rejects_a_too_short_refresh
  - test_explicit_minimum_smaller_than_default_still_uses_the_effective_threshold
  - test_explicit_minimum_validity_nan_suppresses_refresh_entirely
  - tests/auth/test_signal.py (5 tests -- CombinedSignal budget/caller-signal composition)

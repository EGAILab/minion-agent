    Cancellation (`L12-R001`/`L12-R008` -- REVERSED at convergence): a first remediation adopted
    pinned Pi''s own FileSystem INTERFACE-declared `signal?` contract (every operation checks it)
    as a stricter MINION_ARCHITECTURAL_MAPPING. Convergence review found this was an UNAPPROVED
    intentional divergence: Pi''s own reference implementation (`NodeExecutionEnv`, `nodejs.ts`)
    does not actually accept/check `signal` on TEN of sixteen methods (`absolute_path`,
    `join_path`, `append_file`, `file_info`, `canonical_path`, `exists`, `create_dir`, `remove`,
    `create_temp_dir`, `create_temp_file` -- confirmed ten, not nine as an earlier revision
    miscounted its own adjacent list), and this project''s own established epistemology treats
    live OBSERVED behavior, never a type declaration''s unfulfilled promise, as authoritative for
    "Pi behavior" without exception. Minion now adopts Pi''s own OBSERVABLE reference-
    implementation cancellation behavior exactly, including its incompleteness, as
    DIRECT_PI_PARITY:

    Complete checkpoint table (refined `L12-R009`, final complete review, `minion-agent-docs#114`,
    convergence episode `CE-L12-01-02` -- checkpoint COUNT and ORDER per operation, not merely a
    pre-aborted/mid-operation binary): read_text_file/read_binary_file -- pre-check; signal
    threaded into the single underlying read call (single-phase, no separate checkpoint,
    `nodejs.ts:502-511,544-553`). write_file -- pre-check; awaits recursive parent mkdir (itself
    NOT abort-checked); checks AGAIN immediately after mkdir completes, before the write begins;
    signal also threaded into the underlying write call -- THREE checkpoints, not one
    (`nodejs.ts:555-572`). read_text_lines -- pre-check (before opening the stream); signal passed
    to the stream; re-checks at EACH loop iteration; checks ONCE MORE after the loop completes,
    before returning success -- FOUR checkpoints (`nodejs.ts:513-542`). list_dir -- pre-check;
    re-checks at each loop iteration; NO check after the loop completes -- genuinely FEWER
    checkpoints than read_text_lines despite both superficially "looping over entries"
    (`nodejs.ts:611-633`). rename_file -- pre-check only; the underlying rename() call accepts no
    signal option at all (`nodejs.ts:585-600`). Accepts signal (uniform typed API, below) but does
    NOT inspect it -- matches Pi exactly, not a Minion gap: absolute_path, join_path, append_file,
    file_info, canonical_path, exists, create_dir, remove, create_temp_dir, create_temp_file.

    Public API shape (refined `L12-R001`, targeted closure review, `minion-agent-docs#114`): the
    typed operation signature declares `signal?` UNIFORMLY on every operation, including the ten
    above -- matching pinned Pi''s own FileSystem INTERFACE shape exactly. This is a single,
    explicit decision about the PUBLIC API SURFACE, separate from the OBSERVABLE-BEHAVIOR decision
    above: every operation ACCEPTS an optional signal (a uniform seam-wide signature); whether it
    is INSPECTED is the separate, per-operation fact stated above. No operation''s typed signature
    omits the parameter; no operation raises/errors merely for being passed a signal it does not
    inspect. A Rust implementation exposes this as an ordinary `Option<&CancelToken>` parameter on
    every trait method, unused in the body for the ten non-inspecting operations -- not a second,
    narrower trait shape. (An earlier revision of this row left the typed signature and this
    behavior table implicitly inconsistent -- the operation inventory in `spec/execution.md` §3
    already declared `signal?` everywhere, but §3.1''s own prose read as "does not accept," which a
    typed Rust API cannot satisfy simultaneously with "accepts." Resolved by stating explicitly
    that the parameter is always present and the distinction is inspection-only.)

    This resolves `L12-R008` for this row directly: no divergence is bundled into `adopted`
    anymore, so no split disposition or PI_BEHAVIOR_UNCERTAIN flag is needed.

    Path resolution (confirmed against `nodejs.ts:51-65`): paths may be absolute or cwd-relative;
    bare `~` and `~/`-prefixed (or, on Windows, `~\`-prefixed) paths expand against the home
    directory; a `file://` URL is parsed to a filesystem path, with a malformed URL kept as an
    ordinary (almost certainly invalid) path string rather than raising, preserving the
    never-throw contract.

    `file://` URL conversion (`L12-PY-R002`, resolved at the `CE-L12-PY-01-01` checkpoint,
    `minion-agent-docs#121` @ `2db656c01126bfb775d1fe453241e191ed78b2f0`, `AGREED FOR
    IMPLEMENTATION: YES`): pinned Pi delegates 100% of `file://`-to-path conversion to Node''s
    own `url.fileURLToPath` (`nodejs.ts:18,20,51-65`) -- Pi has no narrower Pi-authored subset of
    this behavior, so DIRECT_PI_PARITY for this row means direct Node parity specifically. The
    Python candidate''s own hand-rolled predecessor was differentially tested against a 65-case
    corpus (`minion-agent-docs/assurance/layers/data/12-python-r002-differential-corpus.md`,
    Node `v22.19.0` -- Pi''s exact declared `engines.node` floor, checksum-verified -- as the
    primary oracle, with a `v22.23.2` drift check confirming byte-for-byte identical output) and
    found to diverge on 4/65 cases, all IPv4-range-validation/IPv6-canonicalization/disallowed-
    codepoint shaped. No off-the-shelf Python package reproduces Node''s full algorithm in one
    call (that artifact''s own library-research table); the Python implementation
    (`filesystem.py`''s `_file_url_to_path`) now composes `ada_url` (the SAME URL engine Node
    itself has used internally since 18.17, for host syntax/IPv4/IPv6/forbidden-code-point
    validation and canonicalization) with `idna.decode()` as a strict bidi/combining-mark/
    Punycode-decode gate (`ada_url`''s own `idna_to_unicode()` is lenient and does not perform
    this validation -- confirmed live) on top, plus a hand-written layer for the
    `fileURLToPath`-SPECIFIC rules neither library attempts (encoded-separator rejection,
    drive-letter validation, backslash pre-normalization). Reverified against the FULL 65-case
    corpus: `65/65`. An earlier revision of this row characterized one residual divergence as
    "observably identical for every corpus case, not yet differentially verified beyond it": a
    host that is non-ASCII only after PERCENT-DECODING is round-tripped through `ada_url`''s own
    ToASCII step into Punycode before `_domain_to_unicode` decodes it back to Unicode, rather
    than kept exactly as percent-decoded the way Node does.

    Correction (targeted section 11.8.7 closure review of the `CE-L12-PY-01-01` R002
    remediation, `minion-agent-docs#120` @ `09423f0a962d1139ba16155eff6113c026a1f89a`): that
    "observably identical" claim was FALSIFIED by a direct counterexample -- `file://%E2%98%83.
    com/share`/`file://%F0%9F%92%A9.com/share` (a snowman/pile-of-poo, decoding to Unicode
    category `"So"`, Symbol-other) round-tripped through `ada_url`''s ToASCII step into a
    Punycode label the STRICT `idna.decode()` then rejected as a disallowed codepoint (RFC 5892),
    while live Node (v22.15.1/v22.19.0/v22.23.2, all checksum-verified) accepts both and returns
    a UNC path containing the literal glyph. Fixed: `_domain_to_unicode` now retries, on strict
    rejection specifically for `InvalidCodepoint`/`InvalidCodepointContext`, through
    `_relaxed_punycode_label` -- the SAME structural validation (canonical Punycode form, NFC,
    hyphen placement, leading-combining-mark, bidi, CONTEXTJ/CONTEXTO), but additionally
    accepting a disallowed codepoint specifically in Unicode category `"So"` (see
    `filesystem.py`''s `_relaxed_codepoint_ok` for the exact, narrowly-evidenced scope of that
    widening). Reverified against the FULL corpus, now 67 cases (the two new witnesses added as
    permanent regression evidence): `67/67`. The malformed-punycode/bidi/combining-mark
    rejections this fix must NOT reopen (`"xn--"`, `"xn--zzzz"`, `"xn--a"`, `"xn--abc-ppe"`,
    `"xn--abc-jdc"`) were reverified unchanged. NO CLAIM is made that every OTHER
    not-yet-witnessed disallowed-codepoint category (unassigned, private-use, control, ...)
    Node''s ICU-backed UTS46 profile might also accept is now covered by this fix -- a future
    witness in one of those categories would be a SEPARATE characterized finding, not silently
    resolved here.

    `minion-agent-rust`''s own `expand_path`/`Url::parse(...).to_file_path()` branch matched only
    `48/67` against the SAME extended oracle (including the two new emoji witnesses, both also
    mismatching -- Rust keeps the Punycode form, does not decode to Unicode) and remains
    `REVALIDATE_REQUIRED` -- untouched by this Python-side remediation, a Rust-owned follow-up
    per `CE-L12-PY-01-01`''s own scope.

    Root characterization and FINAL resolution (checkpoint invalidated under section 11.8.10
    after this finding failed a SECOND targeted closure review with `Sc`/`Sm`-category
    witnesses beyond the `"So"`-only fix above; `minion-agent-docs#121` @
    `00afd5178d5c1bed4ec5175eea873061a9928fb1`, `AGREED FOR IMPLEMENTATION: YES` after five
    checkpoint correction rounds): the category-by-category `idna`-package patching approach
    above is SUPERSEDED, not extended further. Root cause, confirmed directly from Node
    v22.19.0''s own source (`node_url.cc`): `fileURLToPath`/`domainToUnicode` delegate this
    ENTIRE responsibility -- host validation (bidi, leading-combining-mark, codepoint-assignment)
    AND Punycode-to-Unicode decoding -- to a single concrete engine, Ada, specifically Ada
    `2.9.2` (`ada::idna::to_unicode(get_hostname())`, confirmed via the vendored
    `ADA_VERSION` macro). A direct Ada 2.9.2 executable oracle was built (the exact vendored
    C++ source, checksummed, compiled with a harness mirroring Node''s own call sequence) and
    differentially tested against an 8,246-case systematic corpus
    (`minion-agent-docs/assurance/layers/data/12-python-r002-ada-oracle/`): Node v22.19.0 vs
    direct Ada 2.9.2, `0/8246` mismatches (Strategy A''s premise proven, not assumed). The
    project''s own `idna`-package-based composition (both the strict and `"So"`-relaxed forms
    above) was found NOT to be a faithful structural match to Ada''s actual validity gate,
    independent of Unicode-table-version alignment -- including a genuine, source-verified bug
    in Ada 2.9.2''s own `is_label_valid` (an LTR-bidi validation loop with an off-by-one bound
    that never checks a label''s own last character), which any correct reimplementation would
    need to deliberately REPRODUCE, not merely avoid, to match the pinned oracle exactly. PyPI
    release history was checked for an `ada-url` version whose vendored Ada core matches 2.9.2
    exactly: `ada-url==1.15.3` (the project''s own contemporary release, ~September 2024) matches
    the direct Ada 2.9.2 oracle EXACTLY across all `8,246` corpus cases, INCLUDING Ada 2.9.2''s
    own bidi bug (required for, not in tension with, that exact match) -- independently
    reproduced by TWO separate checkpoint re-reviews from fresh isolated installs.

    RESOLVED implementation: pin `ada-url==1.15.3` EXACTLY (not a range) in `pyproject.toml`.
    `filesystem.py`''s `_domain_to_unicode` is now a thin wrapper over
    `ada_url.idna_to_unicode()` directly -- the `idna` package, `_relaxed_punycode_label`, and
    `_relaxed_codepoint_ok` are REMOVED entirely, not merely superseded in prose. Host validation
    (bidi, leading-combining-mark, codepoint-assignment, hyphen -- NONE enforced by Ada, an
    additional finding beyond WHATWG''s own documented `CheckHyphens=false` flag, confirmed
    directly in Ada''s own source) now happens exclusively at the EARLIER `ada_url.URL(...)`
    construction step, which `ada-url==1.15.3`''s own constructor raises for directly -- unlike
    `ada-url==4.0.0` (the project''s prior dependency), whose `.host` property passed several of
    these through unvalidated, a genuine, now-corrected regression risk that motivated the exact
    pin over a floor. Two independent version-stability mechanisms are in place: the exact pin
    itself, and a permanent differential-gate pytest fixture
    (`tests/execution/test_filesystem_r002_ada_oracle_gate.py`, `minion-agent-python`) asserting
    the pinned `ada-url` reproduces the FULL committed 8,246-case Ada-2.9.2-oracle-verified
    corpus (copied into this repo from the checkpoint''s own committed evidence) exactly -- a
    future deliberate version bump fails this gate loudly rather than silently drifting.
    Reverified against the production 67-case corpus: `67/67` (unchanged). `minion-agent-rust`
    remains untouched and `REVALIDATE_REQUIRED`; its own future revalidation should use this
    SAME direct Ada 2.9.2 oracle, not merely a comparison against Python''s own output.

    Symlinks (`L12-R002` -- corrected twice: an earlier revision of this row wrongly claimed
    symlinks are "never followed... except canonical_path"; a first remediation then
    MISCLASSIFIED `rename_file` as ordinary symlink-following content I/O and omitted `remove`
    entirely -- both confirmed wrong against pinned Pi directly at convergence): lexical path
    resolution never traverses symlinks (it never touches the filesystem at all).
    `file_info`/`list_dir`/`exists` use the non-following `lstat`-equivalent form, reporting a
    symlink itself as kind `symlink`. `canonical_path` is the one explicit, opt-in full-resolution
    operation. Ordinary CONTENT I/O (`read_text_file`/`read_binary_file`/`write_file`/
    `append_file`) DOES follow a symlink at its final path component, matching the underlying OS
    `open()` semantics with no no-follow flag (`nodejs.ts:502-577`) -- reading through a symlink
    returns the target''s own content; writing/appending mutates the target, not the link.
    `rename_file` NEVER traverses -- it calls raw `rename(source, destination)` (`nodejs.ts:594`)
    and operates on the SOURCE directory entry itself (the link object, if source is a symlink);
    replacing an existing destination replaces the destination''s own directory entry, not a
    target it might point to (confirmed by an executable witness: renaming a symlink produces a
    renamed symlink, target file untouched). `remove` NEVER traverses -- it calls raw
    `rm(resolved, {recursive, force})` (`nodejs.ts:664`) and removes the addressed symlink itself;
    recursive removal of a directory-symlink removes the link only, never recurses into the
    target directory''s own contents (safety-relevant: this is the guarantee a caller relies on to
    avoid an accidental cascading delete through a link). `create_dir` through an existing symlink
    follows platform `mkdir` semantics at the existing prefix; no separate Minion rule.

    `read_text_lines`''s `max_lines` stops reading once that many lines have been produced, never
    reading a large file in full merely to return its first few lines; `max_lines<=0` returns an
    empty list without touching the file. `write_file`/`append_file` both create missing parent
    directories recursively before writing. `rename_file` is atomic and REPLACES an existing
    destination (a real OS rename, not copy-then-delete); it does not copy cross-filesystem.
    `create_temp_file` creates a fresh, private temp DIRECTORY first and places the temp file
    inside it with a random-UUID-based name -- this CREATION shape is adopted directly.

    Cleanup/temp-resource scope (`L12-R003` resolved -- an earlier revision of this row implied
    cleanup must remove a temp file''s own private directory; confirmed false against pinned Pi
    directly): `NodeExecutionEnv.cleanup()` does nothing with temporary files/directories at all.
    This row makes NO cleanup-obligation claim for temp resources, adopted or otherwise; a future
    implementation tracking/removing them would be a separately-dispositioned MINION_EXTENSION,
    not something adopted here.

    Correction (`L12-R017`, second final complete review, `minion-agent-docs#114`, convergence
    episode `CE-L12-01-03`): an earlier revision of this row also said `ctx.fs.cleanup()` "kills
    active tracked child-process PIDs (itself really a ctx.subprocess-owned concern this method
    happens to also expose)." That misattributes pinned Pi''s own COMBINED
    `NodeExecutionEnv.cleanup()` behavior to the WRONG split provider -- in Pi''s unsplit
    environment, `cleanup()` kills active children because `exec()`''s own spawned child shares the
    SAME `activeChildPids` set `cleanup()` iterates (`nodejs.ts:429,691-694`), making this a
    `ctx.shell`-owned concern, not `ctx.fs`-owned. Corrected: `ctx.fs.cleanup()` makes NO
    child-process claim at all -- it has no observable effect beyond best-effort/must-not-raise; a
    conforming implementation MAY be a true no-op. `ctx.shell`''s own active-command cleanup is now
    specified in `EXEC-004`.

    Architecture-rationale scope (`L12-R003` resolved -- `EXEC-001`''s companion §1 correction,
    also now applied to `design/2026-08-20-minion-agent-design.md` §7 at convergence): Pi''s own
    EXECUTION TOOLS (bash/read/write/edit) require the combined ExecutionEnv; Pi''s own
    session-persistence layer does not (`JsonlSessionRepoFileSystem = Pick<FileSystem, ...>`,
    consumed by `JsonlSessionRepoOptions.fs` with no Shell dependency at all) -- a real,
    FileSystem-only Pi consumer. An earlier revision of the architecture rationale overgeneralized
    to "no Pi consumer takes FileSystem or Shell alone," which this counter-example refutes; the
    frozen design document contained the same overgeneralization and has now been corrected to
    match.

    Full detail: `spec/execution.md` §3, §3.1-§3.8.'

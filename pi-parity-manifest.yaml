  - test_claiming_never_invents_input
  - test_injection_alone_never_requests_a_wake
  - test_steer_accepts_an_assistant_message
  - test_followup_accepts_an_assistant_message
  - test_steer_accepts_a_tool_result_message
  - test_claim_returns_mixed_message_variants_in_fifo_order
  - test_steer_and_follow_up_delegate_to_the_inbox_at_the_agent_surface
  - test_inject_delegates_to_the_inbox_without_waking

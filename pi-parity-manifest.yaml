- id: EXEC-005
  phase: 6
  pi: 'no direct Pi seam -- see spec/execution.md §6; the required primitive set is derived from
    the process-management primitives env/nodejs.ts:392-499 (Shell.exec''s own concrete
    implementation) demonstrates ctx.shell''s own local provider needs, per the design''s own
    statement that ctx.shell''s local provider spawns through ctx.subprocess'
  surface: Layer 12, WP-12.1 -- ctx.subprocess (raw argv-direct process spawning capability seam),
    including its own SubprocessErrorCode taxonomy
  rule: 'REMEDIATED (independent Rust contract review, `L12-R006`/`L12-R008`; convergence episode
    `CE-L12-01-01`, `minion-agent-docs#113`, resolving refined `L12-R006` gaps from a second
    independent review, `minion-agent-docs#112`). MINION_EXTENSION, owner-directed: "Its contract
    must be designed from the frozen master architecture rather than represented as Pi parity."
    `spawn(argv, options?) -> Result[Process, SubprocessError]` where `options{cwd?, env?,
    inherit_env=true, stdin: StdioMode=null, stdout: StdioMode=piped, stderr: StdioMode=piped,
    signal?}` and `StdioMode = inherit|piped|null`; `Process{pid, stdin?, stdout?, stderr?,
    wait() -> Result[ExitStatus, SubprocessError], terminate()}` where `ExitStatus{exit_code:
    int|None}`. NOTE: `wait()` takes NO signal parameter of its own (convergence correction,
    below).

    SubprocessErrorCode (MINION_EXTENSION -- moved here from `EXEC-001` per `L12-R008`, since
    `ctx.subprocess` has no Pi seam to inherit a taxonomy from at all): aborted | spawn_error |
    pipe_error | unknown. `timeout` REMOVED (`L12-R006`): no operation in this contract accepts a
    timeout parameter that could ever produce it -- ctx.subprocess has no native timeout concept;
    a caller composes its own signal with a timer, exactly how ctx.shell layers its own timeout on
    top (`EXEC-004`).

    Complete process/stream contract (`L12-R006`, first remediation, resolved an earlier revision
    that left stdio configuration, stream operations, cancellation-vs-termination semantics,
    idempotence, ownership, and chunk type all unspecified or self-contradictory): `argv`-direct
    only, MUST NOT shell-interpret under any circumstance. Stdio streams are typed
    (`WritableStream{write(bytes) -> Result[None,SubprocessError], close()}`;
    `ReadableStream{read_chunk() -> Result[bytes|None,SubprocessError]}`), populated on `Process`
    only for streams configured `piped`; chunks are raw bytes, never decoded text (unlike
    ctx.shell''s own higher-level `exec()`). `wait()` and `terminate()` are both idempotent
    (repeated/concurrent calls return/produce the same outcome). A pipe read/write failure is
    observed at that operation alone and does NOT change what `wait()` returns -- the two failure
    domains are kept independent. `terminate()` and signal-triggered cancellation both kill the
    whole process tree/group, matching `ctx.shell`''s own `EXEC-004` guarantee -- the SAME
    underlying mechanism `ctx.shell`''s local provider is built from. A failure to start the
    process at all is `spawn_error`.

    `cwd`/environment defaults (`L12-R012`, final complete review, `minion-agent-docs#114`,
    convergence episode `CE-L12-01-02`): MINION_EXTENSION -- `ctx.subprocess` has no Pi seam to
    source these from, but the frozen design''s own statement that `ctx.shell`''s local provider
    spawns THROUGH `ctx.subprocess` requires this seam''s own cwd/environment rule to be
    well-defined, so it mirrors `ctx.shell`''s own already-specified rule (`EXEC-004`) exactly
    rather than inventing a second, independent one. `cwd`, when omitted, defaults to the
    provider''s own current working directory; when supplied and relative, it resolves against
    that same provider cwd, using the identical lexical resolution rule `ctx.fs`''s own
    `absolute_path` (`EXEC-002`) uses. `inherit_env=true` (default): effective environment is the
    provider''s own base/inherited environment overlaid by any per-call `env` -- identical to
    `ctx.shell`''s own `EXEC-004` rule. `inherit_env=false`: effective environment is EXACTLY the
    per-call `env` and nothing else.

    Second correction (`L12-R006`, convergence -- the first remediation''s own `wait(signal?)`
    shape created an unresolved ambiguity for "abort the original spawn signal, then call wait()
    with no argument," left wait()''s own relationship to stdio drain unstated, and mixed an
    unconditional "MUST NOT leak" with only a "SHOULD attempt termination" on implicit disposal --
    not achievable in idiomatic Rust, since Drop cannot await async cleanup): ONE signal, not two.
    `wait()` takes no signal parameter; cancellation flows only through `spawn()`''s own
    `options.signal`. A pre-aborted `signal` supplied to `spawn()` short-circuits before any
    process starts, returning `aborted`. `wait()` returns `Err(aborted)` when the process was
    killed because the spawn-supplied signal fired (at any point); it returns
    `Ok(ExitStatus{exit_code})` when killed via an explicit, signal-free `terminate()` call
    (the caller''s own deliberate action, not an unexpected failure).

    `exit_code` after `terminate()` is CONDITIONAL, not unconditionally `None` (post-closure
    finding `L12-R020`, discovered during the first independent Rust closure review of the merged
    contract, `minion-agent#41`/`minion-agent-docs#118`): an earlier revision of this row said
    `terminate()`-caused kills ALWAYS settle `exit_code: None`. That is structurally incompatible
    with `EXEC-004`''s own `L12-R017` rule that `ctx.shell.cleanup()` -- architecturally built ON
    `ctx.subprocess.terminate()`, with no other sanctioned kill mechanism -- must PRESERVE a real
    exit code when one is reported; the two previously-settled rules were jointly unsatisfiable as
    written. Corrected: `exit_code` reflects whatever the OS actually reports -- a REAL numeric
    code `K` when the OS provides one (not guaranteed to be absent merely because the process was
    killed), `None` ONLY when genuinely absent. This is the SAME code-preserving rule `EXEC-004`''s
    own `ctx.shell.cleanup()` settlement already used -- now unified, since they are
    architecturally the same underlying mechanism.

    `wait()` settles on the
    PROCESS''s own exit ALONE, independent of stdio stream state -- it does not wait for, and is
    not affected by, `stdout`/`stderr`/`stdin`; a caller wanting both "process exited" and "output
    drained" does both explicitly. `ctx.shell`''s own idle-grace completion heuristic (`EXEC-004`)
    is a SEPARATE, higher-level concern layered on top of these primitives, not part of this
    contract. Disposal: `wait()` or `terminate()` is the ONLY guaranteed-safe disposal path, in
    EITHER language equally -- a CALLER obligation, not an implicit-cleanup guarantee. Dropping a
    `Process` without calling either first is UNDEFINED behavior (a caller bug), not a scenario
    this API promises to handle safely -- removing the unconditional "MUST NOT leak" claim
    implicit disposal cannot actually satisfy in idiomatic Rust. Python MAY additionally offer an
    async context-manager form whose `__aexit__` calls `terminate()` as an ergonomic convenience,
    but the contract does not depend on it.

    Disposition correction (`L12-R008`): redispositioned `adopted` -> `intentional divergence`.
    This row''s own text always said "MINION_EXTENSION... no Pi seam"; `adopted` was incoherent
    alongside that admission. Matches existing manifest precedent (`MINION-001`).

    Full detail: `spec/execution.md` §6.'

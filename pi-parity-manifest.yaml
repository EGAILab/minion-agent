  surface: Layer 12, WP-12.E1 -- an additive extension to ctx.fs (list_dir_raw, probe_dir_entry)
  rule: 'CONTRACT_APPROVED and MERGED (owner-approved as `R007-b`, minion-agent#48, governance
    record issuecomment-5771291305; coordinated as its own isolated work package, minion-agent#53).
    Independent review history: round 1 (minion-agent-docs#148, WP12E1-R001 through R005, all
    CHANGES REQUIRED, fixed in revision 2); round 2 (minion-agent-docs#149, refined WP12E1-R003 --
    `DirEntryProbe.path` identity, fixed in revision 3); round 3 (minion-agent-docs#150, narrow
    documentary WP12E1-R006, fixed in revision 4); round 4 (minion-agent-docs#151, revision 4
    APPROVED, WP12E1-R001 through R006 all CLOSED). Merged to minion-agent-docs/master @
    `bf4eacdafbf9f66cb3ec80befb657575813dd46c` (PR #147) and this manifest row merged to
    minion-agent/main @ `1465953717d7a0ad1c96c417453ae0b5fe963e52` (PR #54), per owner merge
    authorization ("WP-12.E1 Owner Authorization", this session, 2026-09-23). Python implementation
    is merged at minion-agent/main `a7a5ca723f73730957141553b2502dfa91a108a9` (PR #55).
    A later explicit owner authorization recorded in minion-agent#53 authorized the separate Rust
    implementation after that merge was verified. Rust implementation is merged at minion-agent/main
    `0b1dd8a870c11087f8414e831a5f86003c8c489a` (PR #56), with its assurance record at
    minion-agent-docs/master `6c807fd92d9876610b14f2a523715069a43bb004` (PR #157). Both were
    independently reviewed at their exact SHAs before merge; cross-language closure is recorded in
    minion-agent#53.

    Two new operations, additive to EXEC-002''s existing ctx.fs inventory, with EVERY existing
    operation in that inventory (list_dir, file_info, and the rest) unchanged in both wording and
    semantics: `list_dir_raw(path, signal?) -> Result[list[str], FsError]` returns raw,
    provider-order, unclassified entry names (no per-entry work at all); `probe_dir_entry(path,
    signal?) -> Result[DirEntryProbe, FsError]` performs its own symlink-FOLLOWING single-entry
    classification (kind in file|directory|symlink_to_file|symlink_to_directory|other), returning
    a per-CALL Result error (never a whole-call abort) for any per-entry failure including a
    broken symlink''s target-resolution failure. `DirEntryProbe.name`/`.path` describe the
    ADDRESSED entry (the link itself, when applicable), matching FileInfo''s own established
    convention -- never silently substituted with a resolved target''s identity. Both operations
    reuse EXEC-001''s existing FsErrorCode taxonomy; no new error type. This extension exists
    because EXEC-002''s `list_dir` mirrors Pi''s HARNESS listDir (see `pi:` above), not the `ls`
    TOOL''s own separate loop that WP-13.1''s `ls` implementation must reproduce -- five
    independently live-verified divergences (kind-inclusion, whole-call-failure-vs-per-entry-skip,
    cap-boundary content, directory-symlink classification, broken-symlink inclusion) are detailed
    in minion-agent-docs/assurance/layers/13-wp131-ce-l13-wp131-01-r007-ls-enumeration.md. The
    required Layer-13 consumption pattern (spec/execution.md section 11.5) is itself normative:
    the caller sorts list_dir_raw''s output, then calls probe_dir_entry lazily, one sorted name at
    a time, checking its own cap BEFORE each call -- never probing an entry beyond the cap
    boundary, matching Pi''s own lazy structure exactly, not merely its final content.

    MINION_ARCHITECTURAL_MAPPING, not DIRECT_PI_PARITY: neither operation is a literal Pi
    interface method (Pi has no `list_dir_raw`/`probe_dir_entry`-named operations), matching this
    manifest''s own established precedent for a real behavioral mapping derived from genuine
    pinned Pi source that does not correspond 1:1 to any single existing Pi FileSystem interface
    method (`EXEC-003`''s own FsTarget/target_key row cites the identical reasoning for an
    analogous case). Python and Rust implementations are both accepted on minion-agent/main
    (below).
    Cancellation, error mapping, and the complete discriminating-evidence plan are specified in
    spec/execution.md sections 11.3-11.6.'

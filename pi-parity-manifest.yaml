    Confirmed via revert-and-confirm: the two new through-the-driver witnesses and the two new/
    corrected `Inbox`-level unit tests were run against the reverted (count-only) PASS-6 candidate
    and all FAILED as expected, reproducing the review''s own witness exactly (`B`/`C` incorrectly
    lost), then PASSED once the identity check was restored.

    PASS 8 (implementing the agreed `L09-R012`/`R013`/`R014` convergence contract, `assurance/
    layers/09-active-abort-contract-checkpoint-r012-convergence.md`, revisions 1-2, `CONVERGENCE
    CONTRACT AGREED FOR IMPLEMENTATION`; also closes the bundled, non-blocking `L09-R015`/`L09-R016`
    from the same review pass): PASS 7''s own final `?11.8.8` complete review (mandatory once
    `L09-R007`/`L09-R010`/`L09-R011` were all provisionally closed) REJECTED FOR RUST IMPLEMENTATION
    with five findings. `L09-R012` recurred for a SECOND time -- `AG-011`''s own `rule:` prose (not
    merely its `python:` pointer, which PASS 7 already corrected) still described the removed
    `peek`/`_commit_claim` design as this row''s own settled mechanism -- meeting workflow `?11.8`''s
    "same material finding survives two independent reviews" convergence trigger on its own. Four
    new findings accompanied it: `L09-R013` (a RUNNING observer that itself claims the peeked batch
    and then THROWS loses it -- `_commit_claim`''s identity check correctly leaves nothing removed
    when the front no longer matches, but PASS 7 never restored the OBSERVER''S OWN claimed batch on
    the RUNNING-failure rollback path, so it vanished regardless); `L09-R014` (a `ClaimPolicy.
    ONE_AT_A_TIME` re-entrant claim on the SAME target during the RUNNING notification could still
    leave a PARTIAL prefix of the originally peeked batch queued for duplicate admission on a later
    claim, since peek/commit only ever validated the batch AS A WHOLE, not a legitimately-narrower
    re-entrant sub-claim); `L09-R015` (`PI_PARITY_DEFECT`: `AGENT_PREPARE_NEXT_TURN`''s own waterfall
    dispatch never protected its `instance` payload slot the way `L09-R006` already protects
    `signal` -- a delegating listener could redirect a later listener to a fabricated `instance`, or
    drop it entirely; pinned Pi''s own public `Agent.createLoopConfig()` (`agent.ts:445-471`) wraps
    `AgentOptions.prepareNextTurn(signal)`/`prepareNextTurnWithContext(context, signal)` with the
    SAME Agent''s own live `this.signal` before handing them to the low-level loop, so this is a
    faithful mapping of an existing Pi guarantee, not a Minion-added one); `L09-R016` (stale
    Layer-05-era prose in `spec/tools.md`/this manifest''s own `TOOL-009` row/`tools/execute.py`''s
    own `_execute_and_finalize` docstring still described the cancellation-signal half as open,
    contradicting Layer 09''s own already-implemented `wants_signal`-based dispatch -- see `TOOL-009`
    below for the correction).

    Root-cause reassessment (`?11.8.3` characterization) traced the WHOLE `L09-R012` lineage
    (`L09-R007` -> `L09-R010` -> `L09-R011` -> `L09-R013`/`L09-R014`) to one architectural decision:
    PASS 6''s own "peek, notify RUNNING, then commit" design left a WINDOW, between `peek()` and
    `_commit_claim()`, during which a re-entrant observer could act on the same target -- every
    finding since PASS 6 was a different exploit shape THROUGH that same window, not an independent
    defect. Rather than adding a further case-by-case check for `L09-R013`/`L09-R014` individually,
    the agreed remediation removes the window entirely: the entering batch is now destructively
    `claim()`''d ATOMICALLY, before the RUNNING notification ever runs, so a re-entrant observer on
    the same target can never see or touch it at all, and a private rollback restores it verbatim if
    the run-entry attempt itself then fails.

    A first convergence-checkpoint revision proposing this direction was independently challenged
    (`assurance/layers/09-active-abort-contract-checkpoint-r012-convergence.md` revision 1,
    `CONVERGENCE CONTRACT -- CHANGES REQUIRED`): `C09-1`, the proposed rollback method
    (`Inbox._restore_claimed(target, envelopes)`) still took a caller-supplied envelope tuple with
    no one-shot guard -- materially the SAME authority defect `L09-R010` already rejected under a
    different name, not closed by a leading underscore alone; `C09-2`, the checkpoint''s own
    "correction" of the reviewer''s `L09-R015` Pi citation was itself wrong (the checkpoint had read
    only `agent-loop.ts`''s low-level shape and missed `agent.ts`''s own public wrapper). Revision 2
    remediated both and was independently AGREED FOR IMPLEMENTATION.

    Implementation: `Inbox` gains a private `_reserve(target, policy) -> _Reservation`, the sole
    construction path for a new `_Reservation` object (`agent/inbox.py`) -- `.envelopes` is
    read-only and bound at construction; `.commit()`/`.rollback()` take NO argument at all (closing
    the "foreign/duplicate envelope" half of `C09-1` by the absence of a parameter, not convention)
    and are guarded by a private `_settled` flag that raises `RuntimeError` on any second terminal
    call, whichever method it is (closing the "double action" half structurally). `Inbox.peek`/
    `_commit_claim` (PASS 6/7''s own mechanism) are removed entirely, not merely superseded --
    `Inbox.claim()` remains the only OTHER removal path, unchanged. `AgentLoop._run_wrapped`
    (`agent_loop/driver.py`) now takes an `entry_reservation: _Reservation | None` in place of PASS
    7''s own `commit_entry_claim` closure parameter: a RUNNING-failure now calls `entry_reservation.
    rollback()` before re-raising, and a successful entry calls `entry_reservation.commit()`;
    `continue_()`''s steering/follow-up branches and `run_until_idle()` each now call `inbox.
    _reserve(target, policy)` directly in place of the old `peek()` + closure pair, passing the
    `_Reservation` straight through. Because the reservation''s own `.envelopes` are removed from
    `Inbox` at RESERVE time, not commit time, a re-entrant observer during the RUNNING notification
    can no longer see or touch them at all, regardless of whether it throws, returns normally, or
    performs its own unrelated claim/clear/enqueue on the same target -- closing `L09-R013` and
    `L09-R014` by construction, not by adding a check for either exploit shape individually.

    `L09-R015`: `_prepare_next_turn`''s own `AGENT_PREPARE_NEXT_TURN` waterfall dispatch gains a
    `normalize_step` closure (`_restore_instance`) that forces the payload tuple''s own `instance`
    slot back to the closure-captured ORIGINAL value at every listener-to-listener handoff,
    regardless of what a delegating listener passes -- the same `normalize_step` mechanism already
    certified for `AGENT_TRANSFORM_CONTEXT`''s own `signal` slot (`L09-R006` precedent) and
    `TOOL-024`''s own `tool_call_id`/`tool_name` slots (`L06-R003` precedent), now applied to
    `instance` for the first time. A full audit of every `.waterfall()` dispatch in `src/` (five call
    sites total) found `AGENT_PRE_STEP`''s own `_pre_step` had the IDENTICAL unprotected `instance`
    slot, not itself separately reported by any review -- fixed proactively with the same closure
    pattern, closing the adjacent surface of the same mechanism before an independent review had to
    find it separately. `AGENT_TURN_STOPPING`/other `.waterfall()` sites were inspected and confirmed
    already protected or structurally immune (`EventBus.serial()` dispatches have no delegation
    seam at all, so cannot exhibit this defect).

    Nine tests replace/extend PASS 7''s own `peek`/`_commit_claim` coverage in `agent/test_inbox.py`
    (`_reserve`/`_Reservation` unit coverage: atomic claim on reserve, commit, rollback, an empty
    target, a never-settled reservation, `hasattr`/`peek` absence, the reviewer''s own duplicate-id
    witness, double-rollback non-duplication, a foreign-envelope rejection by construction, commit-
    then-rollback and rollback-then-commit both refused a second time, rollback ordering ahead of
    input enqueued after the reservation, and a re-entrant same-target claim seeing only genuinely
    unrelated input); `agent_loop/test_active_abort.py` replaces the now-incorrect-under-claim-first
    `test_a_running_observer_that_claims_the_peeked_input_does_not_lose_other_input` (its own
    assumption that an unclaimed remainder stays queued no longer holds once ONE_AT_A_TIME reserves
    only the one entering envelope) with four witnesses reproducing `L09-R013`/`L09-R014`''s own
    exact scenarios under `ClaimPolicy.ALL`, and adds four new `AGENT_PRE_STEP`/
    `AGENT_PREPARE_NEXT_TURN` authority-redirect witnesses paralleling the already-certified
    `AGENT_TRANSFORM_CONTEXT` ones. Confirmed via revert-and-confirm: all eighteen new/changed tests
    across both files were run against the reverted PASS-7 candidate (`peek`/`_commit_claim` restored)
    and FAILED as expected, reproducing the reviewers'' own described defects exactly, then PASSED
    once the `_Reservation` implementation was restored. Fresh full gate run: 1123 passed, 19
    xfailed, 100% coverage, ruff/mypy clean, `ruff format --check` unchanged at the same seven
    pre-existing drift files.

    PASS 9 (targeted `§11.8.7` re-review of the PASS-8 candidate): REJECTED FOR PROVISIONAL
    CLOSURE. `L09-R012`/`L09-R013`/`L09-R014`/`L09-R016` all PROVISIONALLY CLOSED -- the
    claim-before-observer architecture was confirmed to close the exact `L09-R013`/`L09-R014`
    re-entrancy window and `AG-011`''s current prose was confirmed repaired. `L09-R015` remained
    STILL OPEN, and a new finding, `L09-R017`, was raised.

    `L09-R015` (still open): PASS 8''s own `_restore_instance` closures fixed the REDIRECT half (a
    listener delegating with a fabricated replacement `instance`) but not the OMISSION half. The
    review''s own witness: a listener delegates via `next_(message, tool_results, context,
    new_messages)` -- genuinely omitting `instance`, one element shorter than the full five-element
    `AGENT_PREPARE_NEXT_TURN` payload, not `next_()` (which `EventBus.waterfall`''s own `forwarded =
    replacement or current` treats as an unchanged forward and never even reaches `normalize_step`
    with a shortened tuple). PASS 8''s own PASS-8 `test_..._cannot_drop_the_instance_for_a_later_
    listener` witnesses both called `next_()`, which cannot discriminate this case at all -- the
    review correctly identified them as non-discriminating, not merely weak. Against the actual
    omission, PASS 8''s own `_restore_instance` unconditionally sliced `current[1:]`, silently
    discarding the genuinely-first transformable field (`message`/`reason`) instead of `instance`,
    and handed the next listener one argument short of its own declared arity -- observed as a
    represented failure (`TypeError: ...missing 1 required positional argument: ''next_''`), not the
    agreed "later listener observes the original instance" outcome.

    `L09-R017` (new, `CONTRACT_ASSURANCE_DEFECT`): the agreed `C09-1` contract requires
    `_Reservation.envelopes` bound read-only to the exact batch its own `claim()` call removed, with
    no path for a caller to substitute a replacement. PASS 8''s own implementation stored it as a
    plain `__slots__` attribute with no property, ordinary Python attribute assignment included --
    the review''s own executable witness: reserve `A`, reassign `reservation.envelopes = (B,)` where
    `B` is a genuinely different, still-queued envelope, then `.rollback()` -- this restored `B` (not
    the genuinely reserved `A`, silently lost) and left two copies of `B`''s own id across both
    queues, the exact class of defect `L09-R010`/`C09-1` were meant to close for good. PASS 8''s own
    `test_rollback_cannot_accept_a_foreign_envelope` proved only that `.rollback()`/`.commit()`
    themselves take no argument -- it never exercised assignment to `.envelopes` directly, so it
    could not have caught this.

    Remediation (PASS 9, this pass): `_restore_instance` (both `_prepare_next_turn` and `_pre_step`)
    is now ARITY-AWARE rather than unconditional -- it checks `len(current)`: when it equals the
    full payload length MINUS one (`instance` genuinely omitted), it PREPENDS the original instead
    of slicing anything off; otherwise (an `instance` slot present, whether original or a forged
    replacement) it slices `current[1:]` as before. A `current` of any other length remains a
    malformed delegation this method does not specially handle -- `EventBus.waterfall`''s own
    existing arity-mismatch behavior governs it unchanged, matching the review''s own explicit
    instruction. `_Reservation.envelopes` is now a READ-ONLY property backed by a private
    `_envelopes` slot with no setter at all -- assignment raises `AttributeError` before any
    caller-supplied value could ever reach `.rollback()`, closing `L09-R017` structurally rather
    than by adding a defensive copy or an isinstance check.

    Four new/rewritten tests: `test_pre_step_cannot_drop_the_instance_for_a_later_listener` and
    `test_prepare_next_turn_cannot_drop_the_instance_for_a_later_listener` (`agent_loop/
    test_active_abort.py`) rewritten to use TRUE omission (`next_(reason, messages)`/`next_(message,
    tool_results, context, new_messages)`), reproducing the review''s own exact scenario -- the
    PASS-8 versions are corrected in place, not merely renamed, since their own non-discriminating
    `next_()` body was itself the defect the review flagged; `test_envelopes_has_no_setter` and
    `test_reassigning_envelopes_is_refused` (`agent/test_inbox.py`) added, the latter reproducing
    the review''s own exact `L09-R017` scenario (reserve `A`, attempt to reassign to a foreign
    queued `B`, roll back) and confirming the reassignment itself is refused before `.rollback()` is
    ever reached, so `A` is never lost and `B` is never duplicated. Confirmed via revert-and-confirm
    against the exact rejected PASS-8 candidate SHA (`551aa162cb0ff0c6b052f6a1500d8687d0ded825`):
    all four FAILED as expected -- the two omission witnesses raised `IndexError` (the downstream
    listener never appended, reproducing the review''s own represented-failure finding) and the two
    `_Reservation` witnesses failed to raise `AttributeError` at all (assignment silently succeeded)
    -- then PASSED once the fixes were restored. Fresh full gate run: 1125 passed, 19 xfailed, 100%
    coverage, ruff/mypy clean, `ruff format --check` unchanged at the same seven pre-existing drift
    files.

    PASS 10 (`L09-R018` convergence -- full finding, root cause, agreed `{0, 1, 3}` delegation
    grammar, and evidence at `AG-023`, not duplicated here): the mandatory `§11.8.8` final review
    of the PASS-9 candidate rejected it on `AGENT_TRANSFORM_CONTEXT`''s own delegation-omission
    ambiguity -- the only current waterfall payload with authoritative fields on BOTH sides of its
    transformable field. Closed via a two-revision `§11.8.4`/`§11.8.5` convergence checkpoint
    (`assurance/layers/09-active-abort-contract-checkpoint-r018-convergence.md`, `CONVERGENCE
    CONTRACT AGREED FOR IMPLEMENTATION`); the fix restricts legal `_transform_context` delegation
    lengths to `{0, 1, 3}` and rejects any other length directly at the authority boundary via
    `WaterfallError`, settled as an ordinary represented Layer-08 run failure. Fresh full gate run:
    1131 passed, 19 xfailed, 100% coverage, ruff/mypy clean, `ruff format --check` unchanged at the
    same seven pre-existing drift files.'

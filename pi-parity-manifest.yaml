  surface: adapter/implementation-module contract -- the `fetchDeferred`/`cancelDeferred` operations (Layer 10, provider abstraction)
  rule: 'New row (`L10-R006`, an independent Rust contract review found neither operation had any
    disposition at all -- `AI-028`/the prior spec text mentioned `fetchDeferred?`/`cancelDeferred?`
    only to contrast their optionality against required `stream`/`streamSimple`, and `AI-009`
    covers only the `DeferredHandle` VOCABULARY these two operations'' own BEHAVIOR builds on, not
    either operation itself). Convergence checkpoint
    `10-provider-abstraction-contract-checkpoint-r005-r007-convergence.md`, revision 2 (`C10-D002`),
    `AGREED FOR IMPLEMENTATION`.

    `fetchDeferred`/`cancelDeferred` are Pi-required-when-present, capability-gated, per-wire-
    protocol-module operations -- the SAME status class as `streamSimple` (`AI-031`): nothing
    generic to specify at Layer 10''s own provider-agnostic abstraction level until a real provider
    exists to implement one. Pinned Pi keeps FOUR distinct observable layers separate, and whichever
    pass eventually closes this row must preserve all four, not collapse them:

    1. Low-level, per-API-module (`types.ts::ProviderStreams.fetchDeferred?`/`cancelDeferred?`):
    `fetchDeferred`, when present, returns a NEW `AssistantMessageEventStream` (the SAME
    never-raises boundary `stream` already has, `AI-012`). `cancelDeferred`, when present, returns
    `Promise<void>` -- not stream-shaped at all.

    2. High-level, caller-facing (`models.ts::ModelsImpl.fetchDeferred`/`cancelDeferred`): NOT
    symmetric. `fetchDeferred` wraps provider lookup, capability lookup, auth, and delegation
    ENTIRELY inside `lazyStream(...).result()` -- an unknown provider, a missing capability, or a
    delegated failure all settle as a REPRESENTED (resolved, in-band) `AssistantMessage` with an
    error `stopReason`, never a rejected promise. `cancelDeferred` performs the SAME provider/
    capability lookup EAGERLY, outside any `lazyStream` wrapper -- an unknown provider or a missing
    capability THROWS (a rejected promise), not a represented error. This is a genuine, deliberate
    ASYMMETRY between the two operations at the high-level boundary, not an oversight to smooth
    over.

    3. Provider-level, mixed-API capability selection (`models.ts::createProvider`): a provider
    built from an api-map synthesizes `provider.fetchDeferred`/`cancelDeferred` only if AT LEAST
    ONE api entry supports it -- but a caller may still pick a model whose OWN specific api entry
    lacks it. That per-model mismatch inherits the IDENTICAL fetch-vs-cancel asymmetry as (2): the
    synthesized `fetchDeferred` wraps its own capability check in `lazyStream` (in-band settlement);
    the synthesized `cancelDeferred` is a plain function with a direct throw for the same mismatch
    (eager rejection).

    4. Reference (faux/mock) implementation''s own concrete unknown/cancelled-handle behavior
    (`providers/faux.ts`): for a SUPPORTED capability, an unknown or already-cancelled
    `DeferredHandle` is NOT the same case as (2)/(3)''s missing-provider/missing-capability case
    above -- `fetchDeferred`''s own unknown/cancelled-handle failure settles as an in-band error
    event on the returned stream (never throwing out of `fetchDeferred` itself); `cancelDeferred`''s
    own unknown handle is a SILENT NO-OP -- not an error, not a throw. This "best-effort, idempotent
    for unknown handles" behavior applies ONLY to a supported capability''s own handle-resolution
    outcome, not to a missing provider/capability at all -- conflating the two would let cancel
    appear "always idempotent" when in fact only its handle-resolution failure mode is.

    Disposition: `deferred parity`, not `adopted` and not silently omitted. Minion''s own generic
    `Adapter` protocol at Layer 10 maps only to `stream` (`AI-028`); `fetchDeferred`/`cancelDeferred`
    have no Layer-10 surface of their own to build yet -- Minion has no `fetch_deferred`/
    `cancel_deferred` method anywhere (`Adapter`/`LlmService`), and this row does not propose adding
    speculative plumbing for an operation with no Layer-11 provider to exercise it.

    Closure criterion (binding on whichever future pass closes this row): the closing pass must
    expose an externally invocable operation preserving ALL FOUR distinctions above -- it must NOT
    make `cancel_deferred` globally never-raising (collapsing (2) into (1)''s shape), and it must
    NOT make `fetch_deferred` throw eagerly on a missing/unsupported capability (collapsing (2) into
    (3)''s cancel-side behavior). Executable provider witnesses remain deferred until that pass
    (Layer 10 has no concrete wire-protocol implementation to test against); this row commits only
    to the observable closure criteria stated here. A future revision marked "complete" by building
    some internal translation helper without ever exposing a callable, or by satisfying only some of
    the four layers, would NOT satisfy this row; it must be re-opened, not silently accepted.


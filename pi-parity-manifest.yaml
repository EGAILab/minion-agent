- id: PROV-007
  phase: 5
  pi: packages/ai/src/auth/types.ts::CredentialStore; auth/credential-store.ts::InMemoryCredentialStore
  surface: Layer 11 Pass 1 -- CredentialStore serialized read-modify-write semantics
  rule: '`modify(provider_id, fn)` is the ONLY write path; two concurrent `modify()` calls for the
    SAME provider id never run their own `fn` concurrently -- the second call''s own `fn` sees
    whatever the first call''s own `fn` committed (CASE 3). `fn` returning `None` leaves the entry
    UNCHANGED, which is NOT the same as deletion -- `delete()` is the separate, dedicated removal
    primitive (CASE 6). A raising `fn` leaves the stored credential untouched and its own exception
    propagates (CASE 2). `read`/`list` are NOT serialized against `modify`/`delete` (CASE 4).
    `modify` on an absent credential sees `None` (CASE 5). Different provider ids never serialize
    against each other. The in-memory reference implementation proves IN-PROCESS serialization
    ONLY -- it makes no claim of cross-process, filesystem, or distributed locking. One call''s own
    failure never sours the FIFO chain for a later queued call for the same provider id.

    `list()` ordering (`L11-R007`, remediated): pinned as a normative production rule, not merely
    an incidental property of one language''s map/dict type -- `list()` enumerates providers in
    INSERTION order of each provider''s own CURRENT entry; a provider deleted and later given a
    fresh credential re-appears at the END of that order, not its original position.

    Cancellation checkpoints (`L11-R001`, remediated): a prior revision checked the signal only
    immediately before entering the store''s own lock and again after `fn` resolved, missing TWO
    Pi checkpoints entirely. The corrected, complete set: (1) immediately, if already aborted;
    (2) once a queued `modify`/`delete` call''s own turn begins -- after every EARLIER call for the
    same provider id has settled -- and BEFORE its own `fn`/removal runs at all, so an abort
    observed here means `fn`/removal never runs; (3) for `modify` only, again immediately after
    `fn` resolves but before its result would commit, discarding a too-late result; and,
    independently of all three, (4) the CALLER''S OWN WAIT races against the signal separately (Pi
    `raceWithAbortSignal`) -- an abort observed while the caller is still waiting, even while `fn`
    is already running past checkpoint 2, makes the caller''s own call raise promptly WITHOUT
    stopping the underlying operation, which keeps running to its own natural conclusion (settling
    checkpoint 3 on its own timetable).'
  tests:
  - test_case1_single_modify_transitions_from_initial_to_new_state
  - test_case2_modify_callback_failure_leaves_stored_credential_unchanged
  - test_case3_two_concurrent_modify_calls_serialize_and_see_committed_state
  - test_case4_read_is_not_serialized_against_an_in_flight_modify
  - test_case5_modify_on_an_absent_credential_sees_none

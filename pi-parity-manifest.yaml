- id: AI-013
  phase: 2
  pi: packages/ai/src/api/openai-responses-shared.ts
  surface: Responses-family thinking/text signature replay
  rule: 'Two distinct questions, corrected this pass (XFORM-R003) after same-model-thinking-signature-replayed.yaml
    and cross-model-signatures-stripped.yaml were rescoped to invoke only the generic transform_messages() seam:
    QUESTION A (XFORM, Layer 04, executable now) -- does a thinking/text/thought signature survive the generic
    target-model transform for the same model, and get stripped cross-model? Answered by the two tests below, which
    prove only Message-level block survival/stripping, never a Responses wire payload. QUESTION B (Phase 5 provider
    replay, NOT YET EVIDENCED) -- does a retained thinking_signature/text_signature get correctly re-encoded into a
    real Responses-family request (content-owned opaque-string replay; message id/phase preservation)? No scenario
    currently exercises a Responses encoder because none exists in this repository (Layer 02''s own exhaustive
    git-history search, assurance/layers/02-llm.md section 7). This row''s tests: list is Question-A prerequisite
    evidence only and must not be read as proof of Question B; Question B evidence is deferred until a real
    Responses-family adapter exists to supply it.'
  tests:
  - same-model-thinking-signature-replayed
  - cross-model-signatures-stripped
  python: 'target: src/minion_agent/llm/ (Responses-family replay logic, Phase 5 -- the text_signature/thinking_signature/thought_signature vocabulary fields this depends on already exist, see AI-001/AI-002/AI-003; the Question-A prerequisite orchestration these fields flow through, transform_messages(), is implemented -- src/minion_agent/llm/transform_messages.py, AI-021/AI-022)'
  rust: 'target: Phase 5 llm Responses replay'
  disposition: adopted
- id: AI-020
  phase: 2
  pi: packages/ai/src/api/transform-messages.ts::transformMessages
  surface: unsupported image downgrade
  rule: 'exact user/tool placeholder strings, gated only on the target model''s own image-input capability; consecutive
    raw images in one message collapse into one placeholder, a non-image block breaks the run, and a real text block
    already matching the placeholder string suppresses the next image''s own placeholder too (XFORM-002/XFORM-003,
    spec/target-model-transformation.md rules 2-4)'
  tests:
  - nonvision-user-image-placeholder
  - nonvision-tool-image-placeholder
  python: src/minion_agent/llm/transform_messages.py
  rust: Phase 2 target-model transform
  disposition: adopted
- id: AI-021
  phase: 2
  pi: packages/ai/src/api/transform-messages.ts::transformMessages
  surface: thinking compatibility
  rule: 'same-model signed retention (even empty); same-model unsigned non-empty retention; same-model unsigned empty
    removal; same-model redacted retention unchanged (missing from the frozen spec until Layer 04''s Pi re-audit found
    it -- the redacted check runs before every other case); cross-model non-redacted non-empty -> text, signature
    discarded; cross-model non-redacted empty removal; cross-model redacted omission regardless of signature
    (XFORM-004/XFORM-005, spec/target-model-transformation.md rules 5-11)'
  tests:
  - same-model-thinking-signature-replayed
  - same-model-unsigned-thinking-not-replayed
  - cross-model-thinking-converts-to-text
  - cross-model-redacted-thinking-omitted
  python: src/minion_agent/llm/transform_messages.py
  rust: Phase 2 target-model transform
  disposition: adopted
- id: AI-022
  phase: 2
  pi: packages/ai/src/api/transform-messages.ts::transformMessages
  surface: cross-model replay metadata stripping
  rule: strip text_signature and thought_signature cross-model, independently of the thinking rules; an empty-string
    thought_signature is left untouched (matches Pi's own truthy check, not a presence check); namespace/id/name/
    arguments never touched (XFORM-006/XFORM-007, spec/target-model-transformation.md rules 12-13)
  tests:
  - cross-model-signatures-stripped
  python: src/minion_agent/llm/transform_messages.py
  rust: Phase 2 target-model transform
  disposition: adopted
- id: AI-023
  phase: 2
  pi: packages/ai/src/api/transform-messages.ts::transformMessages
  surface: tool-call ID normalization
  rule: transform_messages has no built-in normalization algorithm -- Pi injects normalizeToolCallId as a per-adapter
    callback (every real Pi provider supplies its own), invoked cross-model only, in transcript order; this module
    owns only the generic map-building/consistent-rewrite orchestration (XFORM-008, spec/target-model-transformation.md
    rule 13). The concrete per-target-API algorithm is Phase-5/provider territory, not this row's scope.
  tests:
  - tool-call-id-normalization
  python: src/minion_agent/llm/transform_messages.py
  rust: Phase 2 target-model transform
  disposition: adopted
- id: AI-024
  phase: 2
  pi: packages/ai/src/api/transform-messages.ts::transformMessages
  surface: orphan tool result synthesis
  rule: synthesize is_error=true result "No result provided" before a later user/assistant message and at end of
    history; tool_call_id/tool_name sourced from the real ToolCall (tool_name is required, not fabricated -- LLM-F011);
    only calls belonging to a kept (non-error/aborted) assistant are ever tracked as pending (XFORM-009/XFORM-010,
    spec/target-model-transformation.md rule 14)
  tests:
  - orphan-tool-result-synthesized
  python: src/minion_agent/llm/transform_messages.py
  rust: Phase 2 target-model transform
  disposition: adopted
- id: AI-025
  phase: 2
  pi: packages/ai/src/api/transform-messages.ts::transformMessages
  surface: errored/aborted history exclusion
  rule: exclude historical assistant error/aborted (and only those two stop reasons) from provider replay; its own
    tool calls are discarded with it and never receive a synthetic result (XFORM-011/XFORM-012,
    spec/target-model-transformation.md rule 15)
  tests:
  - errored-assistant-excluded-from-replay
  - aborted-assistant-excluded-from-replay
  python: src/minion_agent/llm/transform_messages.py
  rust: Phase 2 target-model transform
  disposition: adopted
- id: AI-026
  phase: 2
  pi: packages/ai/src/api/transform-messages.ts::transformMessages
  surface: legacy null content normalization
  rule: null/undefined legacy content -> empty list, unconditionally, first, on every role (XFORM-001,
    spec/target-model-transformation.md rule 1). Minion's typed Message dataclasses cannot themselves hold null
    content (unlike Pi's TS types, unenforced at runtime); the defensive check lives inside transform_messages()
    itself, exactly where Pi places it, not at the Session decode boundary.
  tests:
  - null-content-normalizes-empty
  python: src/minion_agent/llm/transform_messages.py
  rust: Phase 2 target-model transform
  disposition: adopted

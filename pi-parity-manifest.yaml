  rule: 'Layer 08, PASS 2, resolved this pass -- a genuine implementation gap, not merely an
    evidence gap (`PI_PARITY_DEFECT`, closed): PASS 1''s own `project()` bracketed `AgentStart`/
    `AgentEnd` around the WHOLE log unconditionally, with no run-local `messages` accumulation at
    all. This pass makes `AGENT_START`/`AGENT_END` real, per-run log boundaries (see `AG-005`) and
    has `project()` accumulate every message produced/consumed since the matching `AGENT_START`
    into that run''s own `AgentEnd.messages` -- pinned Pi''s own invocation-local field, confirmed
    exactly: a run triggered via the pre-seeded path (Minion''s `prompt()`, and `continue_()`''s
    steering/follow-up-drain sub-case, which pinned Pi itself routes through `runPromptMessages`
    rather than `runAgentLoopContinue`) starts its own accumulator with the entering messages
    already logged; a run triggered via the empty-seeded path (`continue_()`''s plain-continuation
    sub-case) starts empty and accumulates only what that run itself produces
    (`test_continue_sends_full_history_when_last_message_is_not_assistant`). Two independently
    scoped runs never see each other''s messages
    (`test_a_second_run_does_not_see_the_first_runs_messages`,

  - test_a_queued_modify_still_runs_after_an_earlier_queued_modify_raised
  - test_delete_is_the_dedicated_removal_primitive_not_modify
  - test_delete_serializes_against_modify_for_the_same_provider_id
  - test_different_provider_ids_do_not_serialize_against_each_other
  - test_list_reports_every_provider_without_secrets_in_insertion_order
  - test_list_order_follows_the_current_entry_not_the_original_insertion
  - test_modify_raises_immediately_if_the_signal_is_already_aborted
  - test_modify_discards_its_result_if_the_signal_aborts_during_fn
  - test_read_and_list_raise_immediately_if_the_signal_is_already_aborted
  - test_modify_queued_behind_another_never_runs_its_fn_once_aborted_while_still_queued
  - test_delete_queued_behind_a_modify_never_runs_once_aborted_while_still_queued

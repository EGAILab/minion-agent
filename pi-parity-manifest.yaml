- id: AI-026
  phase: 2
  pi: packages/ai/src/api/transform-messages.ts::transformMessages
  surface: legacy null content normalization
  rule: 'null/undefined legacy content normalizes to role-valid empty content before typed XFORM stages execute
    (XFORM-001, spec/target-model-transformation.md rule 1), unconditionally, first, on every role. The
    normalization is library-owned at the dynamic/legacy transform boundary, not Session-owned and not
    runner-owned -- language-neutral wording corrected by XFORM-R007, which no longer overstates a
    single-implementation architecture (see the python:/rust: fields for where each implementation places the
    boundary).'
  tests:
  - null-content-normalizes-empty
  python: 'src/minion_agent/llm/transform_messages.py::_normalize_legacy_content -- Python''s dataclasses cannot
    themselves hold null content statically (unlike Pi''s TS types, unenforced at runtime), so the defensive
    normalization lives directly inside the typed transform entry, matching Pi''s own placement exactly.'
  rust: 'minion-agent-rust/crates/minion-agent/src/llm/transform_compat.rs::transform_legacy_messages -- Rust''s
    typed Message cannot represent null content at all, so the dynamic/legacy compatibility boundary is a
    separate, feature-gated module (only reachable behind the non-default `conformance` feature) that decodes
    untyped JSON into the typed Message vocabulary before delegating to the ordinary typed transform_messages();
    it is not inside transform_messages() itself. Merged PR #7 @ 439651e;
    tests/llm_transform.rs::legacy_null_content_is_normalized_by_the_library_before_typed_transformation.'
  disposition: adopted
- id: AI-027
  phase: 2
  pi: packages/agent/src/agent-loop.ts::streamAssistantResponse (streamFunction(model, context, {...config, signal}))
  surface: optional active-run cancellation-signal capability at the generic LLM request/adapter seam
  rule: 'Layer 09 (`assurance/layers/09-active-abort-rust-checkpoint-rereview.md`, targeted
    re-review, `L09-C001`..`L09-C003` all `PROVISIONALLY CLOSED`): resolved as a Layer-09-owned,
    ADDITIVE post-certification delta to already-certified Layer 02 -- NOT a Layer-02 semantic
    reopen, and NOT requiring `process/agent-workflow.md` §11.7 owner escalation. Reasoning,
    independently confirmed: `AG-007` already explicitly deferred active propagation to Layer 09;
    `PROV-004` already records adopted transport-abort parity for the later real-provider phase;
    the certified Layer-02 contract governs NON-CANCELLED stream vocabulary/settlement and does not
    prohibit an optional signal capability; omitting the new capability preserves every existing
    caller and every existing non-cancelled behavior exactly, the same "default preserves certified
    behavior" shape Layer 08 PASS 6 already used for `on_execution_start`/`on_execution_end`.

    The shared contract specifies the LANGUAGE-NEUTRAL rule -- one optional active-run signal
    reaches the generic LLM request/adapter seam -- not Python''s exact method signature. Python:
    `llm/service.py::Request` gains an optional `signal: RunSignal | None = None` field, matching
    pinned Pi''s own `streamFunction(model, context, {...config, signal})` -- the SAME per-run
    signal reaches the adapter-call boundary. `LlmService.stream()`/`_settled()` never inspect or
    act on it themselves; it is carried through to `adapter.stream(request)` unexamined, exactly
    like `model`/`system`/`messages`/`tools`. An adapter MAY poll `request.signal.aborted` and
    represent `StopReason.ABORTED` in its own returned stream, cooperatively -- this project''s
    existing `MockAdapter`/`ScriptedAdapter` do not need to (a scenario scripts `StopReason.ABORTED`
    directly, already-certified Layer-08 evidence, unchanged by this row).

    Rust may add an optional signal to its own typed `LlmRequest`/adapter boundary; either
    satisfies the contract. ACTUAL transport cancellation remains deferred to `PROV-004` (or an
    explicitly later real-provider phase) -- this project has no real network transport yet; this
    row certifies generic signal PROPAGATION to the adapter-call boundary, not that any real
    transport was cancelled.

    PASS 2 (independent Rust contract review of the PASS-1 candidate, `L09-R004` remediation):
    this row''s own design needed NO change -- `Request.signal` already held the READ-ONLY
    `RunSignal` view (`AgentInstance.signal`''s own type), never the PRIVATE `RunAbortController`
    an earlier revision of `AG-007` briefly let leak to every consumer. Confirmed here explicitly
    since `Request.signal` is exactly the seam a rejected authority leak would have reached the
    adapter through, had this row reused the wrong type.'
  tests:
  - test_the_active_runs_signal_reaches_the_llm_request (agent_loop/test_active_abort.py)
  - test_a_represented_aborted_terminal_is_unaffected_by_layer_09 (agent_loop/test_active_abort.py, regression)
  python: src/minion_agent/llm/service.py::Request.signal (additive field, never inspected by LlmService/_settled itself)
  rust: minion-agent-rust/crates/minion-agent/src/llm/vocabulary.rs::LlmRequest.signal; minion-agent-rust/crates/minion-agent/src/agent_loop/driver.rs::AgentLoopDriver::execute_run/one_signal_reaches_lifecycle_transform_and_provider_then_clears
  disposition: adopted
- id: AI-028
  phase: 2
  pi: packages/ai/src/types.ts::ProviderStreams (stream member only -- see AI-031 for streamSimple), StreamFunction
  surface: adapter/implementation-module contract -- the `stream` operation (Layer 10, provider abstraction)
  rule: 'Layer 10 PASS 1 (`assurance/layers/10-provider-abstraction-python.md`) formalized this
    contract but MISSTATED pinned Pi''s own required shape and MISCHARACTERIZED current Rust as
    already satisfying the never-raises boundary; an independent Rust contract review
    (`assurance/layers/10-provider-abstraction-rust-contract-review.md`, `L10-R001`/`L10-R003`)
    caught both, and PASS 2 corrected them but still bundled `streamSimple` under this row''s SAME
    `adopted` disposition despite `streamSimple` having no Layer-10 surface built at all -- a second
    independent review (`L10-R001`/`L10-R002`, repeated) and the resulting convergence (`C10-C001`)
    found the bundling itself defective: one `adopted` disposition cannot honestly cover one
    operation that IS satisfied and one that is NOT YET BUILT. This row (PASS 3, post-convergence)
    now covers ONLY `stream`; `streamSimple` has its own row, `AI-031`, with its own `deferred
    parity` disposition and explicit closure criterion.

    Pinned Pi''s own `ProviderStreams` interface (`packages/ai/src/types.ts:272-281`), re-verified:
    `stream(model, context, options?)` and `streamSimple(model, context, options?)` are BOTH
    REQUIRED (no `?` on either) -- an earlier revision of this row incorrectly read `streamSimple`
    as optional alongside `fetchDeferred?`/`cancelDeferred?`, which alone are truly optional
    (`L10-R001`). See `AI-031` for `streamSimple`''s own content and disposition.

    Minion''s `Adapter` protocol (`llm/service.py`) is the direct, faithful mapping for `stream`:
    `provider: str`, `api: str`, `models: frozenset[str]` (identity/capability fields Pi''s own
    `ProviderStreams` does not carry itself -- Pi''s equivalent identity lives one level up, on the
    `Provider`/`Model` objects a caller already holds before ever calling `stream`; Minion folds
    identity onto the implementation object itself since it has no separate `Provider` type -- see
    `AI-029`/`AI-030` for the registry-shape mapping this enables) plus `stream(request: Request) ->
    AssistantStream`, matching `ProviderStreams.stream`''s own `(model, context, options?)` shape
    collapsed into Minion''s own single `Request` value (already certified: `Context` under `AI-011`,
    the never-raises return contract under `AI-012`). `MockAdapter`/`ScriptedResponse`
    (`llm/adapters/mock.py`) is the reference implementation of this row -- already characterized
    directly in its own docstring ("a real adapter, not a test double") and confirmed by Layer 02''s
    own audit (`LLM-018`''s own evidence row).

    Rust status, corrected (`L10-R003`, `PI_PARITY_DEFECT`, current Rust production, OPEN): current
    `minion-agent-rust/crates/minion-agent/src/llm/adapter.rs` declares
    `LlmAdapter::start(&self, request) -> Result<RawAssistantStream, AdapterStartError>` -- a
    synchronous, TYPED error-return channel an implementation may use even AFTER its model has
    already been resolved and its own `start()` code has already run, contradicting Pi''s own
    `StreamFunction` contract (re-verified: "once invoked, request/model/runtime failures should be
    encoded in the returned stream, not thrown" -- no error-return channel exists in Pi''s own type
    at all). The permanent Rust test `adapter_start_failure_remains_eager_and_typed`
    (`tests/llm_adapter.rs`) locks in exactly this: an adapter reporting "invalid provider
    configuration" -- an ORDINARY expected failure, not a programming bug -- currently surfaces as
    an eager `Err(LlmStartError::AdapterStart(_))` from `LlmService::stream()` itself, never
    reaching a returned stream at all. Rust''s own reference/scripted adapter
    (`ScriptedAdapter`/`exhausted_scripted_adapter_fails_before_stream_creation`) diverges from
    Python''s own already-certified `MockAdapter` the SAME way: an exhausted script settles IN-BAND
    in Python (`stop_reason: StopReason.ERROR`, `_take()`) but raises eagerly in Rust. This is a
    genuine, disclosed, OPEN Rust-side defect -- NOT already satisfied, contrary to an earlier
    revision of this row''s own Rust pointer -- and its remediation belongs to a future Rust
    implementation pass, not this shared/Python pass.

    New discriminating evidence closing `L10-R004`''s own citation gap for this row specifically:
    `llm-service-adapter-detected-failure-settles-in-band.yaml` (Layer 10, new canonical family)
    drives the real `LlmService`/`MockAdapter` seam directly and proves Python''s own already-correct
    in-band settlement for an adapter-detected failure, distinct from an unresolvable identity''s own
    legitimately eager rejection (`AI-029`) -- the exact discriminating dimension the prior revision
    of this row cited only stream-terminal-content scenarios for, none of which actually exercised
    an ADAPTER-detected (as opposed to mid-network) failure at this precise seam.'
  tests:
  - llm-service-adapter-detected-failure-settles-in-band (new, Layer 10 -- the discriminating evidence L10-R004 found missing)
  - 'llm-service-more-than-eight-calls-settle-ok (new, Layer 10 -- L10-R007''s own discriminating witness: nine `stream` calls against the SAME registered identity through the SAME `behavior: ok` adapter all settle `ok`, proving the adapter/runner seam imposes no hidden numeric cap on repeated successful `stream` calls)'
  - eager-invalid-model-fails-before-stream (already certified under AI-012/LLM-018; proves the SEPARATE unresolvable-identity case, not adapter-detected failure -- see AI-029)
  - public-stream-fuses-after-first-terminal (already certified under AI-012/LLM-018)
  - represented-provider-error-rides-stream (already certified under AI-012/LLM-018 -- a mid-network/provider failure, not an adapter-detected one; both must settle in-band identically)
  - test_mock_adapter.py (Python, already certified under LLM-018 -- script ordering, tool-call responses, in-band error/abort, request recording, usage pass-through)

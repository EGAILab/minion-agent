      aborted), since execution never reaches the `try` at all. Fixed: `spec/auth.md`''s own step 5
      now states this exact boundary and requires a discriminating test asserting cleanup does NOT
      occur on a `notify()` failure at this point.
    - `L11-SC-R002` (`CONTRACT_ASSURANCE_DEFECT`): the browser race/state matrix omitted three
      discriminating outcomes. Fixed, all independently re-traced against `openai-codex.ts:462-505`

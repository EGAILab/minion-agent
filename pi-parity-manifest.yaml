- id: PROV-014
  phase: 5
  pi: 'packages/ai/src/auth/types.ts::AuthPrompt/AuthInfoLink/AuthEvent/AuthInteraction/
    ProviderAuthInteraction/ApiKeyAuth/OAuthAuth/ProviderAuth (`types.ts:118-241`)'
  surface: Layer 11 Pass 2, Slice B -- provider-auth interaction and auth-method VOCABULARY
    (contract-first, no orchestration)
  rule: 'Adopted in Pass 2 Slice B (owner-approved split out of the previously-bundled `PROV-013`,
    2026-09-14, durably recorded verbatim at
    `https://github.com/EGAILab/minion-agent/issues/29#issuecomment-5659001629`, the
    `GOVERNANCE_SOURCE` for this decision per `agent-workflow.md` §11.10): the login-interaction/
    prompt/notification vocabulary a provider''s own login flow uses (`AuthPrompt`/`AuthInfoLink`/
    `AuthEvent`/`AuthInteraction`/`ProviderAuthInteraction`), and the per-provider auth-METHOD
    vocabulary a concrete provider registers (`ApiKeyAuth`/`OAuthAuth`/`ProviderAuth`). Adopted
    directly because `PROV-012`''s own Codex `login()` contract (a later Pass-2 slice, not yet
    implemented) consumes this exact shape -- it is no longer deferred merely because the
    SEPARATE, still-deferred `PROV-013` orchestration (`resolveProviderAuth`/`Models.*`) built on
    top of it is not ready.

    VOCABULARY ONLY, per explicit owner instruction: no `Models`-equivalent dispatcher, no
    `LlmService` extension, no new generic `AuthService`/`AuthManager` architecture. A concrete
    provider''s own login flow constructs and consumes these types directly; nothing in this row
    wires them to a provider registry.

    `AuthPrompt` (`types.ts:125-130`) is a tagged union of four variants
    (`AuthPromptText`/`AuthPromptSecret`/`AuthPromptSelect`/`AuthPromptManualCode`), matching Pi''s
    own discriminated-union shape via the project''s own established per-variant-dataclass-plus-
    type-alias pattern (`DevicePollResult`, `PROV-010`). `AuthPromptSelect`''s own resolved value,
    once some concrete `AuthInteraction` resolves it, is the chosen option''s own `id`, never its
    `label` -- Pi''s own doc comment states this explicitly (this row itself defines vocabulary
    only and implements no such resolving `AuthInteraction`; see `L11-SB-R004`''s own correction
    below for the evidence-scope this claim actually has). `AuthEvent` (`types.ts:137-147`) is the
    matching four-variant notification union (`info`/`auth_url`/`device_code`/`progress`);
    `AuthEventUrl` carries a URL only -- browser LAUNCHING itself is confirmed, independently
    during the Pass-2 restart audit, to live entirely outside `packages/ai/src`
    (`packages/coding-agent/src/utils/open-browser.ts`, a CLI-layer concern Minion has no
    equivalent of), so emitting this event is not the same as opening a browser.

    `AuthInteraction`/`ProviderAuthInteraction` are modeled as SEPARATE, standalone `Protocol`
    classes (not one narrowing the other through inheritance) -- `signal`''s own declared type
    differs (`Abortable | None` vs. required `Abortable`). `signal` reuses the ALREADY-CERTIFIED
    `Abortable` structural protocol (`auth/signal.py`, `PROV-008`) -- no new cancellation primitive
    introduced; the per-prompt `AuthPrompt.signal` racing pattern Pi''s own doc comment names ("a
    `manual_code` prompt raced against a callback server, aborted when the callback wins") is
    directly realizable with the ALREADY-CERTIFIED Layer-09 `RunAbortController`/`RunSignal` split,
    but wiring that race is `PROV-012`''s own concern (Slice C), not resolved by this
    vocabulary-only row.

    `ApiKeyAuth`/`OAuthAuth` are modeled as MUTABLE dataclasses of `Callable`-typed fields (matching
    the project''s own established convention for an injected callable, e.g. `refresh.py`''s own
    `RefreshOperation`), constructible directly by a provider module rather than requiring class
    inheritance. `ProviderAuth` enforces, at construction time via `__post_init__`, Pi''s own
    binding doc-comment requirement that at least one of `api_key`/`oauth` is present ("even
    ambient-credential providers and keyless local servers provide `apiKey` auth whose `resolve()`
    reports whether the provider is configured") -- a real invariant, not left an unchecked
    convention.

    CORRECTIONS (`L11-SB-R001` through `L11-SB-R005`, first independent Rust contract review --
    ALL closed by this exact remediation, independently re-confirmed by revert-and-confirm before
    being reported closed here):

    - `L11-SB-R001` (`PI_PARITY_DEFECT`): `OAuthAuth.is_subscription` was `bool = False`,
      collapsing Pi''s own genuinely three-valued optional field (absent / `false` / `true`) into
      two observable states. Fixed: `bool | None = None`. Permanent three-state witness added.
    - `L11-SB-R002` (`PI_PARITY_DEFECT`): `AuthInteraction`/`ProviderAuthInteraction` declared
      `signal` as a plain MUTABLE instance attribute, which is INVARIANT under Python''s own
      static-typing rules -- silently breaking Pi''s own intersection-type subtyping (`Pi
      ProviderAuthInteraction = AuthInteraction & { signal: AbortSignal }`, under which a
      normalized interaction with a REQUIRED `signal` remains a valid `AuthInteraction` with an
      OPTIONAL one). Fixed: `signal` is now a READ-ONLY `@property` in both protocols -- COVARIANT,
      correctly matching Pi''s own subtyping, with no effect on a concrete implementation (an
      ordinary mutable attribute still satisfies a Protocol''s own read-only property requirement).
      The exact `ProviderAuthInteraction -> AuthInteraction` assignability witness the review
      itself specified is now a permanent typing-fixture check.
    - `L11-SB-R003` (`CONTRACT_ASSURANCE_DEFECT`): the normative spec left every callable''s own
      input bundle, requiredness, and async-result shape implicit, and did not disclose that
      `ApiKeyAuth.check`/`resolve`''s own Python rendering (three positional parameters) is a
      MAPPING of Pi''s own single structured `{ctx, credential?, signal}` input, not an
      independent design choice two implementers could resolve differently. Fixed: `spec/auth.md`
      now states every callable''s full signature, explicitly discloses the check/resolve mapping,
      and states it changes no observable input value, requiredness, or result shape.
    - `L11-SB-R004` (`CONTRACT_ASSURANCE_DEFECT`): the `tests:` entry below claimed
      `test_interaction.py` covers "AuthPromptSelect option id vs label" as if it proved
      `prompt()`''s own return-value behavior; the actual test only asserted the CONSTRUCTED
      option''s own stored `id`/`label` fields, never invoking any interaction. Fixed: the test
      (renamed) and this row''s own `tests:` description now scope that claim honestly to
      construction/shape evidence only; the behavioral return-value claim is explicitly deferred to
      whichever later slice first supplies a real `AuthInteraction` implementation to test against.
    - `L11-SB-R005` (`PI_PARITY_DEFECT`): every new dataclass was `frozen=True`, an unapproved,
      undisclosed observable divergence from pinned Pi''s own assignable public object/interface
      fields (only the two COLLECTION fields, `options`/`links`, are `readonly` in Pi; ordinary
      fields are not). Fixed: `frozen=True` removed from all thirteen dataclasses (kept
      `slots=True`), matching this project''s own already-established precedent for the identical
      question on Layer-11 credentials (`PROV-006`/`L11-R006`/`L11-R009`: adopt Pi''s assignable
      fields in full, no intentional divergence approved). Permanent mutation witnesses added.

    SECOND CORRECTION (`L11-SB-R003` continued, second independent review -- `L11-SB-R003` survived
    two reviews, triggering `agent-workflow.md` §11.8 contract convergence): the first correction
    above closed the input-GROUPING ambiguity but left every async callable''s own FAILURE/DELIVERY
    semantics unstated. Independently re-confirmed directly against pinned Pi before fixing further:
    `ApiKeyAuth.check` (`models.ts:495-504`), `ApiKeyAuth.resolve` (`resolve.ts:188-192`), and
    `OAuthAuth.to_auth` (`resolve.ts:174-178`) are each `await`ed inside their own real call site''s
    `try`/`catch`, confirming all three MAY raise/reject (correcting a prior revision''s own wrong
    "`to_auth` is not expected to raise" claim -- side-effect-free and "can fail" are independent
    properties). `AuthInteraction.notify()` (`packages/ai/src/auth/oauth/openai-codex.ts:429`,
    `:456`) is a direct, un-awaited, un-wrapped synchronous statement at both real call sites, with
    no enclosing `try`/`catch` and no detachment mechanism -- a synchronous throw propagates
    directly, correcting the prior "sync, fire-and-forget" phrasing (ambiguous, could be misread as
    "failures are swallowed"). Every affected callable''s own docstring, and `spec/auth.md`''s own
    PROV-014 section, now state this failure/delivery contract explicitly. No behavior change --
    Python''s own `Callable[..., Awaitable[T]]` already permitted raising, and a bare
    `def notify(...) -> None` already propagates synchronously; only the PROSE was incomplete.

    THIRD CORRECTION (`L11-SB-R007`, `CONTRACT_ASSURANCE_DEFECT`, third independent review --
    documentary/traceability only, no production behavior changed): the second correction above
    described the failure/delivery contract as one blanket rule ("every async callable''s real call
    site wraps rejection") without distinguishing that `ApiKeyAuth.login`/`OAuthAuth.login` are NOT
    wrapped at their own real call site. Independently re-confirmed directly against pinned Pi:
    `Models.login()` (`models.ts:565-575`) calls `method.login({...interaction, signal})` and awaits
    the result through `raceWithAbortSignal(loginOperation, signal)` directly, with no enclosing
    `try`/`catch` around that call; `Models.login()`''s own LATER `try`/`catch`
    (`models.ts:591-613`) covers only the subsequent credential-store mutation step, not the login
    call itself. `spec/auth.md`''s own PROV-014 section and this row now distinguish the two groups
    explicitly (`check`/`resolve`/`to_auth`/`refresh` wrapped at their own cited call sites;
    `login` unwrapped, propagating through `raceWithAbortSignal`) rather than generalizing one
    group''s own wrapping behavior to the other. §11.8''s mandatory trigger check: `L11-SB-R007` is
    a NEW finding ID with zero prior rejections on this exact ID, so the "same finding survives two
    reviews" condition does not apply to it; the layer/slice AS A WHOLE has now accumulated three
    rejected contract reviews (docs PR #78, #79, #80), meeting the OTHER §11.8 trigger condition on
    its own terms. Proceeding with an ordinary targeted point-fix instead of re-entering full
    convergence is deliberate, not an oversight: the third review''s own evidence already narrowed
    the remaining surface to two mechanically-bounded, directly-cited documentary corrections (this
    paragraph, and the assurance-artifact path correction below) with no new semantic disagreement
    or unresolved behavior matrix -- not genuine unresolved semantic breadth requiring another
    characterization/challenge cycle.

    NEW FINDING `L11-SB-R006` (`PI_PARITY_DEFECT`, found alongside the `L11-SB-R003` re-review):
    the `L11-SB-R002` read-only-`@property` fix closes subtyping but, as a direct mathematical
    consequence, also makes `signal` NOT assignable through an `AuthInteraction`-typed reference --
    pinned Pi''s own TypeScript type permits that assignment (`signal` is a plain, non-`readonly`
    property there). Independently confirmed this is NOT fixable by rearranging Python code: a full
    read/write `@property` with a matching `.setter` was tried and confirmed (by direct `mypy`
    probe) to reintroduce the ORIGINAL `L11-SB-R002` subtyping failure instead, since a writable
    property is invariant for the identical reason a plain attribute is -- `ProviderAuthInteraction`
    would need a NARROWER setter (`Abortable` only) than `AuthInteraction`''s own wider setter
    (`Abortable | None`), which violates Liskov substitution regardless of how `signal` is modeled.
    Pinned Pi''s own TypeScript type system is well-documented to be UNSOUND for exactly this
    mutable-property-variance combination; Python''s own sound type system cannot safely replicate
    that unsoundness. RESOLVED by explicit owner governance decision (`GOVERNANCE_SOURCE`, verbatim
    at `https://github.com/EGAILab/minion-agent/issues/29#issuecomment-5664609556`, per
    `agent-workflow.md` §11.10): preserve the `ProviderAuthInteraction <: AuthInteraction` subtyping
    relationship and the provider-login guaranteed-`signal` invariant (keep the read-only
    `@property` design); accept, as an INTENTIONAL, NARROW, OWNER-APPROVED language-binding
    divergence, that assignment through a widened `AuthInteraction`-typed reference is not part of
    the Python static contract -- confirmed, by grepping the entire pinned Pi source tree, that NO
    actual Pi call site ever exercises this assignment. This divergence does NOT require a concrete
    implementation''s own runtime object to be immutable; only the Protocol''s own widened-reference
    view is affected. Tracked as its OWN manifest subject, `PROV-015`, per the owner''s own explicit
    instruction not to silently mix a divergence into this otherwise fully-`adopted` row.'

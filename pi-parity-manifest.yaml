    boolean shorthand (true/false) or any other non-mapping value -- and does NOT mean the schema
    must describe an object instance via a top-level "type": "object" keyword: TypeBox''s TSchema
    (Pi''s TParameters bound) is generic over its whole schema domain, not narrowed to TObject, so
    {"type": "string"} and a top-level {"oneOf": [...]} are equally valid tool parameter schemas
    (L05-R005 round 2: a first repair mistakenly required parameters["type"] == "object" at the
    public Python boundary, rejecting both of those and contradicting the shared/canonical
    contract, which never required it). Round 1 of this requirement, previously untraced at the
    base-field level -- TOOL-008/TOOL-009 cover constrainedSampling and the AgentTool extension
    fields respectively, neither covers the base Tool interface. Missing and null are not aliases
    for "no parameters"; a no-argument tool supplies the explicit empty-object schema {type:
    object, properties: {}}. Enforced at the public ToolDefinition boundary itself (not only by
    typing or canonical-schema convenience) -- the boundary rejects only non-mapping values
    (missing, None, booleans, arrays, strings, numbers), never a particular JSON Schema keyword.'
  tests:

- id: AG-002
  phase: 3
  pi: packages/agent/src/agent-loop.ts::runAgentLoop / runLoop
  surface: initial steering poll
  rule: 'Layer 08, PASS 4 (this pass), correcting a PASS-3 ordering defect the independent Rust
    re-review caught (`L08-R006`): pinned Pi''s `runAgentLoop` emits `agent_start`, `turn_start`,
    then the initial prompt messages'' own COMPLETE `message_start`/`message_end` lifecycle, and only
    THEN does `runLoop`''s own body run -- whose first statement is the initial steering poll
    (`pendingMessages = getSteeringMessages() ?? []`), confirmed directly against source
    (agent-loop.ts:95-118, 161). The initial steering claim is strictly a post-prompt-lifecycle
    event, not merely a post-`turn_start` event.

    PASS 3''s own fix was necessary but insufficient: it moved `TURN_START` before the initial claim,
    but the claim (`_claim_step_input()`) still ran before the prompt''s own messages were admitted
    at all -- `_run_step` logged the ENTIRE combined `entering + claimed_steering` batch together,
    afterward. A listener present at claim time would observe `TURN_START` already logged but NOT
    the prompt''s own lifecycle -- observably weaker than pinned Pi''s real order. PASS 4 restructures
    `_run_inner`''s first-turn handling into two explicit, sequential admission stages, each using
    the SAME `AgentLoop._admit_messages` helper every other admission point already uses: (1) a
    `PreStepReason.INITIAL` decision governs `entering` (the caller''s own prompt) ALONE, admitted
    (logged, dispatched live, and accumulated into `context.messages`/`new_messages`) immediately;
    (2) only THEN is `_claim_step_input()` called, and if non-empty, a SECOND, independent
    `PreStepReason.STEERING` decision governs the claimed batch, admitted the same way. Both
    decisions'' messages feed the SAME first provider request (pinned Pi never splits them into
    separate turns) -- only their own admission/lifecycle timing is staged. Proven with a listener
    trace across BOTH the live `AGENT_LIFECYCLE_EVENT` seam (proving the prompt''s own
    `message_start`/`message_end` fire before the steering-reason claim marker) and the final
    request (proving both messages still land in one combined request)
    (`test_the_initial_prompt_lifecycle_precedes_the_steering_claim`).

    `continue-steering-no-double-drain` (unchanged since PASS 2): pinned Pi''s `Agent.continue()`
    pre-drains steering itself when the last transcript message is assistant, then sets a one-shot
    `skipInitialSteeringPoll` flag so the freshly started run''s own initial poll does not claim the
    identical batch a second time. `AgentLoop.continue_()` reproduces this exactly: its
    steering-drain branch passes `skip_initial_steering_poll=True` into `_run_wrapped`/
    `_execute_run`/`_run_inner`, which then skips stage (2) above entirely, and stage (1) alone
    admits the pre-drained batch under `PreStepReason.INITIAL`
    (`test_continue_does_not_double_drain_steering_after_pre_drain`).'
  tests:
  - test_the_initial_prompt_lifecycle_precedes_the_steering_claim
  - test_the_initial_steering_claim_happens_after_turn_start
  - test_a_rejection_during_the_initial_steering_admission_ends_the_turn
  - test_steering_is_claimed_at_the_step_boundary
  - test_continue_drains_steering_when_last_message_is_assistant
  - test_continue_does_not_double_drain_steering_after_pre_drain

- id: AG-011
  phase: 3
  pi: packages/agent/src/agent.ts::PendingMessageQueue, Agent.steer, Agent.followUp
  surface: steering/follow-up queue identity, storage, ordering, and accepted message domain (assurance Layer 07)
  rule: 'pinned Pi keeps exactly two per-instance queues -- steering and follow-up -- each an
    independent FIFO of enqueued messages, never interpreted, normalized, or reordered at enqueue.
    Minion generalizes both under one storage primitive addressed by a two-valued target (design
    spec section 6): the step-boundary target realizes pinned Pi''s steering queue; the turn-
    boundary target realizes pinned Pi''s follow-up queue. `steer()`/`follow-up()` are pinned Pi''s
    two enqueue operations under this vocabulary, exposed at the Agent-instance level
    (`AgentInstance.steer`/`.follow_up`, not only `Inbox.steer`/`.followup` -- the independent Rust
    review correctly flagged that pinned Pi''s own public surface is `Agent.steer()`, not an
    internal queue''s method). A third operation, silent injection (enqueues to the step-boundary
    target without requesting a wake), is an intentional Minion architectural extension pinned Pi
    does not define -- proven never to request a wake on its own
    (test_injection_alone_never_requests_a_wake).

    Accepted message domain (`L07-R002`, `PI_PARITY_DEFECT`, resolved this pass): pinned Pi''s
    `steer`/`followUp` each accept the whole `AgentMessage` union
    (`Message | CustomAgentMessages[keyof CustomAgentMessages]`). `CustomAgentMessages` is an empty
    interface in pinned Pi itself (apps extend it via TypeScript declaration merging; nothing in
    pinned Pi populates it), so the actual, complete domain is exactly `Message` --
    `UserMessage | AssistantMessage | ToolResultMessage`, the already-certified Layer-02 vocabulary
    -- adopted here verbatim. An earlier revision of this row narrowed the accepted type to
    `UserMessage` only, with the assurance narrative calling the narrowing intentional while this
    row''s own disposition stayed `adopted` -- an incoherent pairing the independent review caught
    exactly: no architectural reason for the narrowing was ever established, so the domain is
    corrected rather than the narrowing re-labeled. `Inbox.send`/`steer`/`followup`/`inject`, the
    Agent-level wrappers, and `InputEnvelope.message` are all typed `Message`, and are proven to
    accept and correctly order a `UserMessage`, an `AssistantMessage`, and a `ToolResultMessage`
    together in one claim.

    Claiming one target never observes or disturbs the other (test_the_two_queues_are_independent,
    test_the_two_queues_never_leak_into_each_other -- property-based, arbitrary interleavings).
    Enqueue order is preserved exactly (test_one_at_a_time_preserves_send_order -- property-based)
    and every sent message is claimed exactly once across however many claims it takes to drain it
    (test_every_sent_message_is_claimed_exactly_once, test_claiming_never_invents_input --
    property-based). Each queued input carries an opaque, JSON-safe provenance value the runtime
    never inspects, matched, or interprets (design spec section 6) -- an intentional Minion
    addition with no Pi equivalent, required because Minion''s claim-time boundary (see AG-012)
    can merge several enqueued inputs into one claimed batch, which a single `turn.origin` could
    not represent. Language-neutral canonical evidence (`L07-R004`):
    agent-inbox-queue-mode-fifo.yaml and agent-inbox-queue-independence-and-clearing.yaml exercise
    the real `Inbox` primitive directly, with no provider/tool/run-loop timing.

    Cross-reference (Layer 09, `L09-R007`/`L09-R010`/`L09-R011`/`L09-R012`/`L09-R013`/`L09-R014` --
    see `AG-007` for the full rule and remediation history): the current mechanism is claim-then-
    reservation-rollback, not peek-then-commit. `Inbox._reserve(target, policy)` (PRIVATE,
    Layer-08-only) atomically `claim()`s the selected batch immediately -- removing it from `target`
    at RESERVE time, not at some later commit -- and returns a private, one-shot `_Reservation`
    bound to exactly that batch (`.envelopes`, a read-only PROPERTY backed by a private slot with no
    setter -- PASS 8''s own first implementation exposed it as a plain writable `__slots__`
    attribute instead, letting a caller reassign the reservation to a foreign envelope before
    rollback and manufacture a duplicate id, `L09-R017`; PASS 9 closes it structurally). Exactly one
    of `.commit()` (settles the
    removal permanently) or `.rollback()` (restores the exact reserved batch, verbatim and in order,
    ahead of whatever `target` holds by then) may ever be called on a given reservation, and each
    takes NO argument at all -- a second call to either, after the first, raises `RuntimeError`.
    Because removal happens at reserve time, no re-entrant observer on the same target can ever see
    or act on the reserved batch, whether it later throws, returns normally, or performs its own
    unrelated claim/clear/enqueue -- this is not a change to this row''s own certified identity/
    FIFO-ordering rules above, `_reserve`/`_Reservation` read and preserve them exactly (`id`/
    `message`/`origin`, order) and can never manufacture a duplicate id: `.rollback()` only ever
    re-inserts the SAME envelope objects it removed, once. PASS 6''s own `Inbox.restore(target,
    envelopes)` (a PUBLIC method taking a caller-supplied envelope tuple, no ownership tracking, no
    one-shot guard) and PASS 7''s own `Inbox.peek`/`_commit_claim` (a peek-then-commit split that left
    a re-entrancy window between the two calls) are both removed entirely, not merely restricted or
    superseded in place -- an independent Rust review found `restore` violated this row''s own
    exactly-once invariant by manufacturing duplicate ids (`L09-R010`), and a first attempt at
    privatizing the rollback path (`Inbox._restore_claimed(target, envelopes)`, still caller-
    supplied and repeatable) was independently found materially the same defect under a different
    name (`L09-R012` convergence checkpoint challenge, `C09-1`) before the current `_Reservation`
    design was agreed. Direct unit coverage lives in `agent/test_inbox.py` (listed under `AG-007`,
    not duplicated here).'
  tests:
  - test_followup_queues_for_the_next_turn_and_wakes
  - test_steer_queues_for_the_next_step_and_wakes
  - test_inject_queues_for_the_next_step_without_waking
  - test_the_two_queues_are_independent
  - test_every_envelope_gets_a_unique_id

  surface: Layer 12, WP-12.1 -- execution-world identity and cross-seam compatibility validation
  rule: 'REMEDIATED disposition only (independent Rust contract review, `L12-R008`); rule
    substance unchanged and independently found coherent by that review. MINION_EXTENSION. Every
    execution-capability provider (a ctx.fs, ctx.shell, or ctx.subprocess implementation) declares
    an opaque execution-world identity at construction/activation. Governing rule (owner-restated
    verbatim in the approving decision, binding as written): mounting capabilities from different
    execution worlds is legal; a consumer that needs multiple capabilities to address the SAME
    resource must validate that those capabilities belong to compatible execution worlds;
    cross-world resource transfer requires an explicit bridge capability (`EXEC-003`).

    Deliberately NOT a global runtime rule requiring every mounted fs/shell/subprocess provider to
    share one world. Validation is the CONSUMER''s responsibility, not the runtime''s: a future
    consumer needing `fs`+`shell` (or `fs`+`subprocess`) in the same world performs its own
    compatibility check at its own activation, failing with a diagnostic naming the incompatible
    providers if the worlds don''t match; an unrelated consumer that doesn''t need cross-seam
    resource identity mounts happily beside an incompatible pairing without complaint.

    This row''s own certification scope: the compatibility VOCABULARY (the identity type, the
    comparison/validation primitive a consumer calls) and proof the mechanism itself works
    correctly, using synthetic/test consumers -- it does NOT implement any real Layer 13 consumer
    (`bash`, etc.) to prove this, and does not need to. Local providers (`EXEC-002`/`EXEC-004`/
    `EXEC-005`) share one execution-world identity by construction (same local machine).

    Concrete primitive (`L12-R013`, final complete review, `minion-agent-docs#114`, convergence
    episode `CE-L12-01-02` -- an earlier revision stated only the governing rule in prose, with no
    type shape, comparison operation, compatibility relation, or typed failure result, leaving "the
    compatibility VOCABULARY" above an unfulfilled promise): `ExecutionWorldIdentity` is opaque,
    provider-declared, and supports equality comparison. `compatible(a, b) -> bool` is the
    compatibility relation -- EQUALITY-ONLY (refined `L12-R013`, targeted closure review,
    `minion-agent-docs#114`, CE-L12-01-02: `compatible(a, b) := (a == b)`, full stop). An earlier
    revision additionally permitted a provider to declare compatibility with specific OTHER
    identity values without defining whether the declaration must be mutual/symmetric, leaving
    `validate()` observably order-dependent. No deployment this row certifies needs
    broader-than-equality compatibility; equality is inherently symmetric
    (`compatible(a,b) == compatible(b,a)` always), closing the gap without a new declaration model.
    `validate(providers:
    list[(name, identity)]) -> Result[None, ExecutionWorldError]` is called by a CONSUMER (never
    the runtime) at its own activation, over the specific providers it needs to address the same
    resource through; returns `Err(ExecutionWorldError)` naming every pairwise-incompatible
    provider (by its caller-supplied name/diagnostic label) if any pair fails `compatible()`;
    returns `Ok(None)` otherwise. Providers not passed to a given `validate()` call are never
    implicated -- mounting incompatible capabilities no consumer ever asks to be validated together
    remains legal, unchanged from the governing rule above.

    Concrete `ExecutionWorldError` payload (refined `L12-R019`, third final complete review,
    `minion-agent-docs#114`, convergence episode `CE-L12-01-04` -- an earlier revision required
    only that the error "name every pairwise-incompatible provider," with no stated field shape,
    ordering, or duplicate-label handling): `MINION_EXTENSION`, no Pi source.
    `incompatible_pairs: ordered list of {left: str, right: str}` -- one entry per
    pairwise-incompatible combination among the `validate()`-supplied providers, enumerated in the
    SAME relative order the caller supplied them (input index `i < j` -> `{left: name[i], right:
    name[j]}`, never reversed) -- deterministic, independent of implementation choice beyond the
    caller''s own input order. Caller-supplied labels MUST be unique within one `validate()` call;
    a duplicate label is a caller precondition violation (undefined behavior), not a case
    `ExecutionWorldError` itself represents. Any human-readable message text is NON-NORMATIVE --
    `incompatible_pairs` is the sole normative payload.

    Disposition correction (`L12-R008`): redispositioned `adopted` -> `intentional divergence`.
    This row''s own text always said "MINION_EXTENSION... no Pi equivalent"; `adopted` was
    incoherent alongside that admission. Matches existing manifest precedent (`MINION-001`).

    Full detail: `spec/execution.md` §7.'

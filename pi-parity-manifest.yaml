    review of the PASS-2 candidate): pinned Pi''s `handleRunFailure` fallback bypasses the normal
    accumulator entirely and emits `agent_end(messages=[failureMessage])` -- the synthesized
    failure message ONLY, never diluted by whatever this run''s own turn/run accumulators happen to
    hold by that point (agent-loop.ts, `handleRunFailure`). `_execute_run` now threads the failure
    message returned by `_settle_run_failure` into `AGENT_END`''s own payload as an explicit
    `"messages"` override, which `project()`''s `AGENT_END` branch honors directly instead of
    falling back to `run_messages`
    (`test_failure_agent_end_messages_is_only_the_failure_message`). This is NOT the same case as a
    represented `error`/`aborted` assistant message reaching its own turn normally (`AG-021`,
    `L08-R008`): that is a successfully-produced message using the run''s own ordinary accumulator,
    confirmed directly against pinned Pi''s own source distinction (agent-loop.ts:196-200 uses
    `newMessages`, the run''s own accumulator; `handleRunFailure`''s fallback uses a synthesized
    single-message array) -- proven by a dedicated regression that the represented-error path does
    NOT trigger this row''s override mechanism
    (`test_represented_error_agent_end_messages_uses_the_normal_accumulator`).'

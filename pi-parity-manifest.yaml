    (`L09-R008`).

    Layer 09 (`assurance/layers/09-active-abort-contract-checkpoint.md`, revisions 1-2;
    targeted re-review `assurance/layers/09-active-abort-rust-checkpoint-rereview.md`,
    `L09-C001`/`L09-C002` `PROVISIONALLY CLOSED @ ecb8097`): builds ON TOP of TOOL-023''s own
    already-certified sequential-preflight/concurrent-execution barrier, adding the active run''s
    own cancellation signal at the exact points pinned Pi''s own `prepareToolCall`/
    `executeToolCallsSequential`/`executeToolCallsParallel` check it -- neither reopens TOOL-023''s
    own certified barrier rule.

    `L09-C002`, preflight abort/error priority (`prepareToolCall`, `agent-loop.ts:600-668`): the
    signal is checked EXACTLY ONCE per call, immediately after the before-hook waterfall resolves
    (whichever decision), before that decision is examined, in this priority order (earlier wins):
    (1) tool not found; (2) prepare/validate throws; (3) a before-hook listener throws; (4) the
    waterfall resolves AND the signal is aborted -> "Operation aborted", winning over the
    waterfall''s own `Block` decision (the discriminating witness is `block: true` + aborted, not
    `block: false` + aborted, since the latter would reach step 6 regardless); (5) the waterfall
    resolves to `Block`, not aborted -> the Block''s own reason/terminate; (6) neither aborted nor
    blocked -> proceeds to `execute()`. Steps 1-3 are checked/raised BEFORE the signal is ever
    read, so an unknown tool, a validation failure, or a throwing before-hook keep their own
    specific error regardless of abort state. Pinned Pi''s own `prepareToolCall` has an
    INDEPENDENT second abort check for its own "no `beforeToolCall` configured at all" case (its
    single, nullable hook creates a genuine bypass of its first check); Minion''s `tools/
    pre-execute` waterfall always runs the same code path whether zero or more listeners are
    registered, so this module''s ONE checkpoint covers both of Pi''s two -- an intentional,
    disclosed architectural mapping (the two Pi-distinguishable states, "hook absent" and "hook ran
    without blocking/aborting," are the same code path in Minion), not an observable divergence.

    `L09-C001`, sequential vs. parallel batch abort algorithms (`batch.py::execute_batch`): a
    generic "stop the batch" rule is wrong for either mode alone. Sequential:
    `if signal.aborted: break` runs AFTER a call''s own COMPLETE preflight-through-finalize
    lifecycle, before starting the next call -- a call already started always finishes; unreached
    calls are simply never attempted (`results` can be shorter than `calls`). Parallel: preflight
    remains fully sequential (TOOL-023, unchanged); the SAME check runs after EACH call''s own
    preflight OUTCOME (immediate or prepared) is recorded, deciding whether to preflight the NEXT
    source call -- NOT after execution. Every prepared outcome retained BEFORE the poll still
    starts its own `execute()`/after-hook phase afterward, via TOOL-023''s own concurrent barrier,
    receiving the already-aborted signal cooperatively; an abort arising DURING one prepared call''s
    own execution cannot stop a sibling already committed to that barrier. The independent
    re-review''s own required regression witness (source calls A/B/C; A prepared with no
    before-hook issue; B''s own before-hook calls `abort()` and returns -- a RETURNING hook, the
    discriminating case per `L09-C002`, not a throwing or blocking one): `tool_execution_start(A)`,
    `tool_execution_start(B)`, B finalizes INLINE as `Operation aborted` during the sequential
    preflight phase, the for-loop poll sees the signal aborted and stops -- C''s own
    `tool_execution_start` never fires -- then A''s own retained closure starts via the barrier and
    completes/finalizes normally, never checking the signal itself; returned results: A, B in
    source order, C entirely absent.

    `execute()`''s own cooperative signal parameter (`_execute_and_finalize`): a tool declaring a
    FOURTH parameter receives `(tool_call_id, arguments, signal, update)`, matching pinned Pi''s own
    `execute(toolCallId, params, signal, onUpdate)` positional order exactly; a pre-existing
    3-parameter tool''s own third parameter continues to mean `update`, UNCHANGED since before
    Layer 09 (`_wants_update`) -- a disclosed, minor Minion-specific arity-dispatch constraint
    relative to Pi''s own fully-independent optional parameters, since a tool wanting only `signal`
    without `update` still must declare (and may ignore) a fourth parameter. Whether a tool
    actually reacts is its own cooperative choice; neither Pi nor Minion forcibly interrupts
    `execute()`. `afterToolCall`/`tools/post-execute` runs UNCONDITIONALLY once `execute()` has been
    reached, regardless of the signal''s state at any point during or after it -- unchanged,
    verified by a dedicated regression, not merely asserted. [PASS-1-era: the "must declare a
    fourth parameter" framing above is SUPERSEDED as current guidance by the CURRENT RULE summary
    at the top of this row and the `L09-R003` remediation below, which makes a genuinely
    THREE-parameter signal-only tool representable -- `L09-R009`.]

    No canonical scenario filled this pass: `active-abort-tool`/`active-abort-provider`/`abort-
    settles-before-idle` remain unfilled placeholders (`conformance/agent/`) -- the discriminating
    witnesses above are instead closed as permanent Python-level explicit-language regression
    evidence, the same "canonical OR explicit language test" standard the independent Layer-08
    review itself accepted for `L08-R014`.

    PASS 2 (independent Rust contract review of the PASS-1 candidate): REJECTED FOR RUST
    IMPLEMENTATION on this row''s own remaining half -- `L09-C001`/`L09-C002` (the batch
    algorithms and preflight priority, above) were confirmed correct and unaffected; `L09-R001`
    and `L09-R003` were genuine gaps in what this row claimed.

    `L09-R001`: the before/after hook waterfall DISPATCHES (`TOOLS_PRE_EXECUTE`/
    `TOOLS_POST_EXECUTE`) never actually included `signal` among their own payload arguments --
    a registered listener had no way to observe it at all, contradicting this row''s own prior
    text and the checkpoint''s own consumer matrix, both of which already (incorrectly) claimed
    hooks received it. An executable witness confirmed a variadic before-listener and a raw
    after-listener each saw zero `RunSignal` among their own arguments. Remediation: `signal` is
    now the THIRD payload argument on `TOOLS_PRE_EXECUTE`''s own waterfall dispatch (`call,
    definition, arguments, signal, next_`) and the SECOND on `TOOLS_POST_EXECUTE`''s (`result,
    signal, next_`), matching pinned Pi''s own `beforeToolCall(context, signal)`/`afterToolCall(
    context, signal)` second-parameter placement. A listener delegating via bare `next_()` sees it
    unchanged automatically (`EventBus.waterfall`''s own `replacement or current` rule); one
    delegating with an explicit replacement must re-supply it (`next_(replacement, signal)`) --
    `register_after_tool_call_hook`''s own production wrapper does this, and `tools/post-
    execute`''s own `_restore` normalize_step (`L06-R003`) was widened to tolerate a variable-
    length trailing tail rather than a fixed 1-tuple, so a listener that forgets to re-supply
    degrades to "no signal for later listeners" instead of raising. Every existing production and
    test listener across `execute.py`, the conformance runner, and the whole test suite updated to
    accept the new argument. [PASS-2-era: this "must re-supply or degrade to no signal" behavior is
    SUPERSEDED by the `L09-R006` remediation below, which makes `signal` authoritative and its
    restoration automatic -- a listener never needs to re-supply it, and cannot cause it to degrade
    for a later listener even by omission -- `L09-R009`.]

    `L09-R003`: PASS 1''s own PURE-ARITY dispatch (3 parameters always meant `update`; 4 always
    meant `signal` then `update`) could not represent Pi''s own genuinely signal-only
    `execute(toolCallId, params, signal)` -- a tool wanting cancellation but not live updates was
    forced to declare an unused 4th `update` parameter, which PASS 1''s own candidate test
    explicitly asserted as the ONLY shape, framing the limitation as a "disclosed Minion-specific
    constraint" despite this row''s own `disposition: adopted` claiming full capability coverage.
    Remediation: capability is now DECLARED, via `ToolDefinition.wants_signal: bool = False`
    (Layer 05) -- `_wants_signal(definition)`/`_wants_update(definition)` (renamed from
    arity-only free functions to definition-aware ones) now consult BOTH the flag and the arity:
    `wants_signal=False` (every pre-Layer-09 tool) preserves the exact prior dispatch; `wants_
    signal=True` shifts the 3rd-parameter meaning to `signal`, with update needing a 4th. All four
    Pi-equivalent combinations (neither, update-only, signal-only, both) are now representable and
    each has its own dedicated regression test.

    PASS 3 (targeted re-review of the PASS-2 candidate): REJECTED FOR RUST IMPLEMENTATION,
    `L09-R006`, a new `PI_PARITY_DEFECT` on this row''s own `L09-R001` remediation above --
    `L09-C001`/`L09-C002`/`L09-R003` were confirmed correct and left untouched.

    `L09-R006`: PASS 2''s own fix threaded `signal` onto both waterfall dispatches but left it as
    ordinary payload -- a listener delegating with an explicit replacement (`next_(replacement,
    forged_signal)`) or a bare omission could redirect or drop it for every listener downstream,
    something PASS 2''s own text above ("must re-supply it... or later listeners will not see it")
    wrongly treated as an acceptable degrade-to-`None` rather than the genuine authority breach it
    is. The independent review''s own executable witness confirmed later `tools/pre-execute` and
    `tools/post-execute` listeners receiving a fabricated replacement signal while execution still
    succeeded.

    Remediation: `signal` is now restored as authoritative event metadata at BOTH dispatches, not
    left to a delegating listener''s own discretion. `_preflight` gained a `_restore_signal`
    `normalize_step` closure for `TOOLS_PRE_EXECUTE` (forcing the payload tuple''s 4th slot back to
    the closure-captured original `signal` at every listener handoff); `_finalize`''s own
    `_restore` `normalize_step` for `TOOLS_POST_EXECUTE` (already certified for `tool_call_id`/
    `tool_name`/`added_tool_names` restoration, `L06-R003`) was extended to also force the payload
    tuple''s `signal` slot back to the original, replacing its prior PASS-2 "tolerate either shape"
    behavior with unconditional restoration. `register_after_tool_call_hook`''s own wrapper no
    longer re-supplies `signal` when delegating -- it relies on `_restore` to preserve it
    regardless, simplifying that call site. Five dedicated regression tests (redirect/drop, for
    both before- and after-hooks, plus one confirming the hook wrapper''s own simplification is
    still correct) were added and confirmed genuinely discriminating via revert-and-confirm: each
    was confirmed to FAIL with the corresponding `normalize_step` stripped, then to PASS once
    restored. `spec/tools.md`''s own "must re-supply or lose it" language is corrected to describe
    this authoritative-restoration guarantee instead.

    PASS 4 (final complete independent Rust contract review of the PASS-3 candidate): REJECTED FOR
    RUST IMPLEMENTATION, `L09-R008` (`PI_PARITY_DEFECT`) and `L09-R009` (`CONTRACT_ASSURANCE_
    DEFECT`) against this row -- `L09-C001`/`L09-C002`/`L09-R003` were confirmed correct and left
    untouched; `L09-R001`''s raw-event-seam half was confirmed closed.

    `L09-R008`: pinned Pi calls `afterToolCall(context, signal)` unconditionally -- every after-hook
    receives the active signal. Raw `tools/post-execute` listeners do (`L09-R001`/`L09-R006`
    above), but `register_after_tool_call_hook`, the PUBLIC, EXPORTED, documented-as-recommended
    helper, still called `hook(result)` only -- a hook written against the intended constrained API
    could not observe cancellation at all. The independent review''s own executable witness
    registered a two-parameter helper hook and confirmed it received zero signal argument
    (`TypeError: hook() missing 1 required positional argument: ''signal''`). Remediation: a new
    `_hook_wants_signal(hook)` (arity-based -- unambiguous here, unlike `execute()`''s own
    `wants_signal`/arity split, since a hook has only ONE optional second slot with no
    `update`-shaped alternative to confuse it with) decides whether `listener` calls `hook(result,
    signal)` or `hook(result)`; every existing one-parameter hook is called exactly as before,
    unaffected.

    `L09-R009`: this row''s own opening paragraphs (the PASS-1-era four-parameter description, and
    the PASS-2-era "must re-supply or degrade" description) stated superseded designs as though
    still current, without being clearly marked superseded -- an independent Rust implementer could
    reasonably derive conflicting `execute()`/hook APIs from this row alone despite `spec/tools.md`
    already containing the correct rule. Remediation: a `CURRENT RULE` summary now opens this row,
    stating the unambiguous current dispatch table and signal-authority guarantee in one place; the
    two superseded PASS-1/PASS-2 claims are annotated in place (not deleted -- preserving the
    historical remediation record) pointing back to that summary and to the specific later-PASS
    finding that superseded each one. `AG-007`''s own opening "DEFERRED to Layer 09" wording was
    audited identically (see that row).'

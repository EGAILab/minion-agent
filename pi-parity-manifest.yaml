- id: AG-013
  phase: 3
  pi: packages/agent/src/agent.ts::Agent.clearSteeringQueue/clearFollowUpQueue/clearAllQueues/hasQueuedMessages
  surface: queue clearing and pending-input observation (assurance Layer 07)
  rule: 'pinned Pi''s clearSteeringQueue()/clearFollowUpQueue() each discard everything queued at
    their own queue, leaving the other untouched; clearAllQueues() discards both. hasQueuedMessages()
    is true exactly when the steering OR the follow-up queue still holds unclaimed input. Clearing
    an already-empty target is a harmless no-op. Minion''s Inbox.clear(target)/clear_all()/
    has_pending() reproduce this exactly, exposed at the Agent-instance level too
    (`AgentInstance.clear_steering_queue`/`.clear_follow_up_queue`/`.clear_all_queues`/

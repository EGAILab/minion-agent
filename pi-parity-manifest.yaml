- id: AG-017
  phase: 3
  pi: packages/agent/src/types.ts::AgentState (messages/tools)
  surface: messages and tools public projections (assurance Layer 07)
  rule: 'L07-R005, split out of AG-015 this pass (see AG-015''s own note on why): both fields are
    genuine, disclosed divergences from Pi''s own field semantics, not straight adoption, so both
    belong under `intentional divergence` rather than `adopted`.

    `messages` -- Pi''s own `state.messages` getter returns the live backing array (mutable in
    place); assignment shallow-copies (`messages = nextMessages.slice()`). Minion''s authority is
    the already-certified Layer-03 `SessionLog` (append-only); `AgentInstance.messages` is a fresh
    `derive_messages(self.log)` projection on every read, never a live mutable reference -- an
    intentional, disclosed divergence from Pi''s live-read semantics, justified because a caller
    mutating a returned live array would otherwise be able to corrupt history outside the log''s
    own controlled `append()` API, which Layer 03''s own certification does not permit
    (test_messages_projects_the_session_log, test_messages_reflects_events_actually_appended_to_
    the_log).

    `tools` -- L07-R005''s own tools sub-finding, resolved this pass: a prior pass claimed `tools`
    as adopted on the strength of the certified Layer-05 `ToolRegistry.visible_from(scope)`
    existing somewhere in the codebase, without actually exposing an Agent-level accessor that
    calls it -- so nothing on `AgentInstance` itself answered "what tools does this agent see" the
    way Pi''s `Agent.state.tools` getter does, which the independent review correctly read as the
    claimed projection not actually existing. `AgentInstance.tools` (this pass) closes that gap: a
    fresh `ToolRegistry.visible_from(self.scope.key)` projection on every read, resolved through
    `ctx.tools` the same way `AgentLoopFactory.for_instance` already does when composing a driver --
    not a second resolution mechanism, only a second caller of the existing one
    (test_tools_projects_the_tool_registry_visible_from_this_instances_scope,
    test_tools_reflects_registrations_made_after_construction). Assigning a wholesale replacement
    set the way Pi''s `state.tools = [...]` does is still not reproduced; the Minion-architecture
    equivalent remains registering/withdrawing tools through the certified `ToolRegistry` API, an
    already-settled Layer-05 divergence this pass does not revisit or duplicate -- this is why the
    field as a whole is `intentional divergence`, not `adopted`, even though a read accessor now
    exists.

    `tools` totality (`L07-R007`, third independent Rust review, resolved this pass): the first
    version of `AgentInstance.tools` raised `ServiceNotFoundError` on a valid, freshly constructed
    instance whose context had no `tools` service mounted at all -- not a defect in `ToolRegistry`
    itself, but in this property treating "no service provided yet" the same as "the read failed,"
    when pinned Pi''s own `AgentState.tools` starts as an observable empty array unconditionally.
    Fixed by checking `ctx.registry.has("tools")` first and returning `()` when absent, mirroring
    `AgentLoopFactory._telemetry()`''s own established idiom for exactly this shape (optional
    service, empty/`None` default when absent) rather than inventing a new resolution pattern
    (test_tools_is_empty_when_no_tools_service_is_mounted). The tool/scope relationship, once a
    registry is mounted, also survives `reset()` unchanged
    (test_reset_does_not_disturb_the_tools_relationship).'

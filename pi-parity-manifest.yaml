- id: AG-009
  phase: 3
  pi: packages/agent/src/agent.ts::handleRunFailure, processEvents
  surface: high-level callback failure settlement, through pinned pi's own listener-bearing seam
  rule: 'Layer 08, PASS 4 (this pass), correcting a listener-delivery defect the independent Rust
    re-review of the PASS-3 candidate caught (`L08-R002`): pinned Pi''s `handleRunFailure` does not
    merely produce the right final trace -- it delivers each of its four events through
    `processEvents`, the SAME reduce-then-dispatch seam every ordinary lifecycle event (`message_
    start`, `message_update`, `message_end`, `tool_execution_start`/`_end`, `turn_end`, `agent_end`)
    passes through (agent.ts:544-591). `processEvents` first reduces `this._state` for the event,
    then awaits every subscribed listener (`this.listeners`) in registration order, with NO catch
    around that loop -- a listener that throws aborts the remaining listeners for that event AND
    propagates out of `processEvents` itself. `handleRunFailure` awaits four such calls sequentially
    (agent.ts:511-527); a throw at any one aborts the rest, and since `runWithLifecycle`''s own
    `catch` (which calls `handleRunFailure`) has no further catch around it, that exception
    propagates all the way out to the caller of `prompt()`/`continue()`, while `finally { this.
    finishRun() }` still settles `isStreaming`/`pendingToolCalls`/status regardless.

    PASS 3 corrected the visible failure trace (catch-boundary width, no synthetic `turn_start`,
    the `agent_end.messages` override) but still produced it through raw `SessionLog.append` calls
    with no live listener dispatch at all -- `project()` could reconstruct the SAME shape offline,
    but nothing could observe or interrupt it DURING the run, and two independent implementations
    could therefore choose different recovery-listener semantics from the written contract (the
    re-review''s own finding). PASS 4 introduces the missing seam Minion never had before this pass:
    `AGENT_LIFECYCLE_EVENT` (`agent/events.py`, `SERIAL` mode -- `EventBus.serial`''s own semantics,
    sequential await with no catch around the loop, already match pinned Pi''s raw listener loop
    exactly, so no new dispatch primitive was needed), dispatched via
    `AgentLoop._dispatch_agent_event` for `AgentStart`/`TurnStart`/every admitted message batch
    (`AgentLoop._admit_messages`, used identically by ordinary progress -- prompt, steering,
    tool-result, follow-up admission -- AND recovery)/`TurnEnd`/`AgentEnd`. `_settle_run_failure`
    (now `async`) dispatches its own four events through this SAME seam, in the SAME order pinned
    Pi does, and lets a thrown listener propagate uncaught exactly as pinned Pi does -- proven by a
    dedicated regression for each of the four recovery events independently
    (`test_failure_message_start_listener_failure_interrupts_recovery`,
    `test_failure_message_end_listener_failure_interrupts_recovery`,
    `test_failure_turn_end_listener_failure_interrupts_recovery`,
    `test_failure_agent_end_listener_failure_interrupts_recovery`), each confirming exactly which
    log entries the aborted sequence still durably recorded (the "reduce" step, which precedes the
    dispatch that then throws) and that `_run_wrapped`''s own `finally` still settles status.
    Ordinary (non-recovery) delivery through the SAME seam is proven with a passive listener that
    does not throw, for both a pre-step-originated and a post-turn-callback-originated failure
    (`test_a_run_executor_failure_recovers_through_the_live_lifecycle_event_seam`,
    `test_a_post_turn_callback_failure_recovers_through_the_live_seam`).

    PASS 5, correcting two further gaps the independent re-review of the PASS-4 candidate caught
    (`L08-R002` again): PASS 4''s own seam was genuinely live but still incomplete and mistimed.

    (1) Completeness: the assistant reply''s OWN streamed `message_start`/`message_update`/
    `message_end` were excluded, on the theory that the certified Layer-02/04 `collect()`
    (`llm/stream.py`) accepts only a synchronous `on_chunk` callback. The re-review correctly
    rejected that as an implementation constraint, not a Pi-visible contract limitation: `_run_step`
    now iterates `self.llm.stream(request)` directly -- reproducing `collect()`''s own trivial drain
    loop at the one call site that needs an async per-chunk dispatch, without reopening or modifying
    `collect()` itself, still certified, still used by every other caller. Layer-06''s own
    `tools/execution-start`/`tools/execution-end` EMIT events (synchronous, fire-and-forget by
    certified design) are captured in real time and redelivered through the SAME seam once a tool
    batch settles, in the exact order Layer 06 emitted them -- a disclosed, narrower fidelity than
    pinned Pi''s own live blocking dispatch for this one event pair specifically (a slow Minion
    listener cannot causally delay a specific tool call''s own further progress the way a slow pinned
    Pi listener could), since Layer-06''s EMIT dispatch mode is certified and this pass does not
    reopen it.

    (2) Reduce-before-listener timing: pinned Pi''s own `processEvents` reduces `AgentState` for an
    event, THEN dispatches -- and does so uniformly for every `message_start`/`message_end`, not
    only the assistant''s own streamed one (`streamingMessage` is set to the message at
    `message_start`, cleared AND pushed onto the transcript only at `message_end`). PASS 4''s own
    `_admit_messages` appended the durable transcript entry BEFORE dispatching `MessageStart`, so a
    `message_start` listener could already observe the message in derived history one event early,
    and never set `streaming_message` for a plain admitted (non-streamed) message at all;
    `_settle_run_failure` had the identical defect for the synthesized failure, and additionally set
    `error_message` only AFTER `turn_end`''s own listeners had already run rather than before. Every
    admission point (`_admit_messages`) and both terminal paths (`_run_step`''s own represented-error
    branch and its own normal end, `_settle_run_failure`) now perform the exact reduce pinned Pi''s
    own reducer performs for that event, immediately before that event''s own dispatch -- not batched,
    not reordered. `_run_wrapped`''s own entry/exit now also mirror pinned Pi''s `runWithLifecycle`/
    `finishRun` unconditional state writes exactly (`streaming_message`/`error_message` reset at
    entry; `streaming_message`/`pending_tool_calls` reset at exit via `finally`).

    Still explicitly excludes the eager, pre-stream `UnknownModelError` (a caller/config bug, not a
    run-executor failure, re-raised uncaught -- `test_an_unresolvable_model_still_raises_uncaught`,
    already-certified section-4 evidence) and remains out of scope for
    `active-abort-provider`/`abort-settles-before-idle`-flavored Layer-09 concerns -- see `AG-007`.'

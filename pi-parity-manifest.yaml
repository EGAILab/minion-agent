    Both parameters'' own type annotations are now `Abortable | None`; the full existing
    `tests/auth/test_device_code.py` suite (34 tests) was re-run unchanged afterward and passes
    identically, confirming no observable behavior changed. This is NOT a Pi-parity change -- Pi
    itself has no equivalent static-typing distinction; it is a Python-binding-only correction
    that makes this already-certified row consistent with `PROV-008`''s own established pattern of
    accepting any `Abortable`-conforming signal.'

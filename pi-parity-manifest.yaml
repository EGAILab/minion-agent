- id: TOOL-016
  phase: 4
  pi: packages/ai/src/types.ts::Tool
  surface: base tool definition fields (name, description, parameters)
  rule: 'name/description are plain required strings. parameters is a required, object-valued
    JSON Schema representation (Tool<TParameters extends TSchema>). "Object-valued" describes the

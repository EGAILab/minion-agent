  pi: packages/agent/src/agent-loop.ts::prepareToolCall, executeToolCallsSequential, executeToolCallsParallel
  surface: active-run signal propagation into tool preflight/execute/batch (Layer 09)
  rule: 'CURRENT RULE (unambiguous statement, as of PASS 4; supersedes any conflicting phrasing in
    the pass-by-pass chronology below, which is retained only as historical remediation record,
    not current guidance -- `L09-R009`): `execute()` signal/update capability is declared via

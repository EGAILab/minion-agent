  - test_messages_reflects_events_actually_appended_to_the_log
  - test_tools_projects_the_tool_registry_visible_from_this_instances_scope
  - test_tools_reflects_registrations_made_after_construction
  - test_tools_is_empty_when_no_tools_service_is_mounted
  - test_reset_does_not_disturb_the_tools_relationship

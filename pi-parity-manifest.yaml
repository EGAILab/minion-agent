- id: AI-023
  phase: 2
  pi: packages/ai/src/api/transform-messages.ts::transformMessages
  surface: tool-call ID normalization
  rule: 'transform_messages has no built-in normalization algorithm -- Pi injects normalizeToolCallId as a per-adapter
    callback (every real Pi provider supplies its own), invoked cross-model only, in transcript order; this module
    owns only the generic map-building/consistent-rewrite orchestration (XFORM-008, spec/target-model-transformation.md
    rule 13). The concrete per-target-API algorithm is Phase-5/provider territory, not this row''s scope. The
    ToolCall rewrite and the later matching ToolResult rewrite follow two different, asymmetric conditions
    (XFORM-R005): a returned id that differs from the original -- including an empty string -- always rewrites the
    ToolCall and is recorded in the map, but the later ToolResult is rewritten only when the mapped value is truthy
    (non-empty) and differs from the result''s current id, reproducing pinned Pi''s own JavaScript truthy check. A
    mapped empty string therefore leaves the real ToolResult at its original id while the ToolCall itself becomes
    "", so the two no longer match and orphan synthesis (AI-024) fires for the empty id.'
  tests:
  - tool-call-id-normalization
  - tool-call-id-normalization-empty-string
  python: src/minion_agent/llm/transform_messages.py
  rust: 'minion-agent-rust/crates/minion-agent/src/llm/transform.rs::transform_assistant_block
    (ToolCall rewrite) and transform_content (matching ToolResult rewrite, gated on mapping
    existence + non-empty mapped value + inequality, reproducing Pi''s truthy check exactly --
    XFORM-R005 RESOLVED by PR #8 @ feed2fba); tests/llm_transform.rs::
    injected_id_policy_receives_original_assistant_and_rewrites_matching_results,
    same_model_never_invokes_the_id_policy, id_policy_runs_in_transcript_order_and_rewrites_each_matching_result,
    normalizer_returning_empty_string_preserves_real_result_and_synthesizes_orphan (PR #8);
    xform_conformance.rs drives 14/14 canonical scenarios including
    tool-call-id-normalization-empty-string'
  disposition: adopted

    PASS 5 implements the agreed matrix in full. Pi has no synchronous status-notification
    extension at all -- `isStreaming=true`/`finishRun()`''s own writes are plain, non-throwing
    property assignments made unconditionally OUTSIDE Pi''s own run-lifecycle try/executor
    boundary -- so this is a genuinely Minion-owned architectural-mapping decision, derived from
    the one thing Pi''s own structure DOES establish: `isStreaming=true` is written before ANY of
    the run''s own observable event stream exists, while `finishRun()` runs AFTER the run''s own
    outcome is already fully committed. The two transitions are governed asymmetrically:

    RUNNING-notification failure means the run never validly began: the freshly-created signal is
    discarded (`_end_run_signal()`); `status` is forced back to `IDLE` directly via a NEW internal
    method, `AgentInstance._force_idle_after_failed_entry_notification()`, which sets `self.
    _status` with NO `AGENT_STATUS` emit and NO `on_status_change` call -- calling `set_status`
    again would re-invoke the SAME failing listener chain; any input already destructively claimed
    from `Inbox` before `_run_wrapped` was called is restored via a new caller-supplied
    `restore_on_entry_failure` callback (`continue_()`''s steering/follow-up branches,
    `run_until_idle()`''s follow-up claim each construct their own, closing over the exact claimed
    envelopes and the correct `Inbox.restore(target, envelopes)` call -- a new `Inbox` method,
    `agent/inbox.py`, that prepends the restored batch ahead of whatever the target queue already
    holds, so a failing observer''s own `steer()`/`followup()` call during its own execution is
    never displaced or lost); no `agent_start`/settled turn is fabricated; the observer''s own
    original exception propagates directly out of `prompt()`/`continue_()`/`run_until_idle()`; a
    subsequent call then succeeds normally.

    IDLE-notification failure does not hide or duplicate the run''s own already-committed outcome:
    `_run_wrapped`''s own `finally` now completes `_end_run_signal()`/`streaming_message`/
    `pending_tool_calls` UNCONDITIONALLY before the possibly-throwing `set_status(IDLE)`, which
    moved to be the LAST write, not the first -- `set_status`''s own internal `self._status`
    write already happens before its own emit/callback, so by the time a throwing listener''s
    exception is observed, every one of `signal`/`streaming_message`/`pending_tool_calls`/`status`
    already holds its correct settled value; only that listener''s own exception propagates,
    uncaught, matching `_settle_run_failure`''s own established "a listener failure during
    settlement propagates uncaught" precedent. This exit-side reorder changes no OBSERVABLE
    success-path behavior (`streaming_message`/`pending_tool_calls` are already at their final
    values from the run''s own normal completion by the time `finally` reaches them regardless of
    write order), so `AG-008`''s own certified write-order rule is not reopened, only extended to
    the failure case it never specified.

    Twelve new regression tests (eight in `agent_loop/test_active_abort.py` -- four status/signal

    a read-only PROPERTY with no setter -- reassignment raises `AttributeError` -- backed by a
    private `_active_controller`, created/cleared only via new internal `_start_run_signal`/
    `_end_run_signal` methods Layer 08 alone calls. `RunAbortController.signal` is created once
    per controller, not per access, so `instance.signal` returns the identical object for a run''s
    whole duration.


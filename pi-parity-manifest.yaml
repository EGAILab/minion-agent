  - agent-inbox-queue-independence-and-clearing (L07-R004, language-neutral canonical)
  python: src/minion_agent/agent/inbox.py::Inbox, Inbox._reserve, _Reservation (Layer 09, L09-R007/L09-R010/L09-R011/L09-R012/L09-R013/L09-R014 -- see AG-007; Inbox.restore, PASS 5's own mechanism, and Inbox.peek/_commit_claim, PASS 6/7's own mechanism, were both removed); src/minion_agent/agent/envelope.py::InboxTarget/InputEnvelope, src/minion_agent/agent/instance.py::AgentInstance.steer/follow_up/inject
  rust: crates/minion-agent/src/agent/inbox.rs::Inbox; crates/minion-agent/tests/agent_inbox.rs; crates/minion-agent/tests/agent_inbox_conformance.rs

- id: PROV-010
  phase: 5
  pi: packages/ai/src/auth/oauth/device-code.ts::pollOAuthDeviceCodeFlow/abortableSleep
  surface: Layer 11 Pass 1 -- generic RFC 8628 device-authorization poll state machine
  rule: '`poll` is the only transport seam; this module owns every interval/backoff/deadline/
    cancellation decision. A pending response retries at the current interval. A `slow_down`
    response prefers a server-provided interval outright over RFC 8628 section 3.5''s own fixed
    +5s increment ONLY when that interval is FINITE and positive (`L11-R004`, remediated -- a
    prior revision accepted any value greater than zero, including a non-finite one like positive
    infinity, which Pi''s own `Number.isFinite(...) && ... > 0` guard explicitly excludes; a
    non-finite/non-positive value now falls back to the fixed increment exactly like an absent
    one). A terminal `DevicePollFailed` stops immediately -- not retryable. Expiry with no
    `slow_down` ever observed raises the plain timeout message; expiry after at least one
    `slow_down` raises the more specific clock-drift-actionable message (Pi''s own two-message
    split). Abort is observed before the first poll and at `abortable_sleep`''s own short
    polling-step boundaries between attempts, never racing an in-flight `poll()` call itself (an
    aborted signal during `poll()` is only observed at the next loop-top check, matching Pi
    exactly). `abortable_sleep` slices a long sleep into short steps to check the poll-based
    `RunSignal` (Layer 09) promptly, a disclosed, immaterial divergence from Pi''s own
    instant-interrupt `AbortSignal`, not a Layer-09 redesign.

    Millisecond flooring (`L11-R012`, remediated, final-complete-review finding): a prior revision
    scheduled the caller''s own initial interval and a finite/positive server-provided `slow_down`
    interval directly, with no flooring -- Pi''s own `Math.floor(seconds * 1000)` floors BOTH to
    whole milliseconds before the 1-second-minimum clamp applies. A fractional-second interval
    (e.g. `1.2349`) must schedule exactly `1.234`, not the raw fractional value (whose own
    floating-point representation drifts observably, e.g. `1.2348999999999997`, a genuine
    cross-language mismatch the un-floored candidate exhibited). The fixed +5s `slow_down` fallback
    increment is already a whole-millisecond quantity and needs no additional flooring.

    Non-finite initial-interval regression (`L11-R014`, remediated TWICE, entered mandatory §11.8
    convergence after surviving two independent reviews -- second remediation per
    `11-auth-foundation-r014-convergence-agreement.md`): pinned Pi''s own INITIAL interval option
    carries NO `Number.isFinite` guard (unlike the `slow_down` server value, which `L11-R004`
    already gates); JS''s own `Math.floor`/`Math.max` never raise for `Infinity`/`NaN`, they
    propagate the special value arithmetically. A first remediation made the flooring helper a
    pass-through for non-finite input, fixing the SETUP-time crash (an immediately-successful
    first poll now correctly returns before any interval is used) -- but left the USED case
    (a `pending` response, meaning the interval actually gets scheduled as a sleep) unfixed: `NaN`
    got silently neutralized to `1.0` only by Python `max()`''s own order-dependent, non-`NaN`-
    propagating comparison (an accident of argument order, not a deliberate rule), while `Infinity`
    entered `abortable_sleep`''s own slicing loop and looped FOREVER, since an ever-infinite
    remaining duration never decreases toward zero. Pi''s own real behavior for a USED non-finite
    interval is a HOST-timer effect: `setTimeout` clamps an out-of-range delay (`NaN`/`Infinity`
    both fail its own bounds check identically) to its own minimal schedulable value, letting the
    next poll happen promptly -- not something the pure `Math.floor`/`Math.max` arithmetic layer
    itself produces. Second remediation (§11.8 convergence revision 1): `abortable_sleep` (the
    Python analog of that host-timer boundary, not the pure-arithmetic
    `_floor_to_whole_milliseconds` helper) now explicitly clamped a non-finite `seconds` to
    `MINIMUM_INTERVAL_SECONDS` via an explicit `math.isfinite` check, never relying on Python
    `min`/`max`''s own incidental `NaN` comparison behavior -- so BOTH `NaN` and `Infinity`
    deterministically reached the next poll attempt. This closed the HANG but a further
    independent review correctly found it introduced its OWN new, unapproved observable Pi
    divergence: clamping to `MINIMUM_INTERVAL_SECONDS` (one full second) is three orders of
    magnitude larger than Pi''s own real host-timer clamp (Node''s own documented `setTimeout`
    contract clamps an out-of-range delay -- `NaN`/`Infinity` both fail its bounds check
    identically -- to exactly ONE MILLISECOND, independently confirmed live against a real Node
    process by that review), while this row continued to claim `adopted` (Pi-parity) disposition
    for a materially different, undisclosed replacement value.

    Third remediation (§11.8 convergence revision 2): a DEDICATED constant
    `NON_FINITE_INTERVAL_FALLBACK_SECONDS` (0.001s, distinct from `MINIMUM_INTERVAL_SECONDS`,
    which remains RFC 8628''s own unrelated "never poll faster than this" floor for ORDINARY
    finite intervals) now replaces the one-second clamp, matching Pi''s own real magnitude rather
    than an independently-invented "good enough" value. Two further NaN-neutralization hazards at
    OTHER `max()` call sites in this same function (the initial-interval setup itself, and the
    slow_down fallback increment applied to a still-unclamped `NaN` current interval) were also
    found and fixed the same way -- an explicit `math.isfinite` check deferring to
    `abortable_sleep`''s own single clamp point, rather than each site''s own accidental,
    order-dependent `max()` behavior potentially producing yet another DIFFERENT, inconsistent
    result. The exact sub-millisecond precision Pi''s own host runtime would produce is still not
    made normative (Python''s own scheduler cannot guarantee it either) -- only the MAGNITUDE
    (roughly one millisecond, not roughly one second) is adopted as the portable, cross-language
    rule.

    Negative-`Infinity` regression (`L11-R016`, new, fifth-final-complete-review finding -- a
    regression the second remediation itself introduced by treating every non-finite value
    identically): pinned Pi''s own `Math.max(MINIMUM_INTERVAL_MS, Math.floor(-Infinity * 1000))`
    resolves ORDINARILY to `MINIMUM_INTERVAL_MS` -- negative `Infinity` is a valid, comparable
    number that simply LOSES every `Math.max` comparison against a finite value, so it NEVER
    reaches the host timer as an "invalid delay" the way `NaN`/positive `Infinity` do; the
    one-millisecond host-timer-clamp fallback this row otherwise adopts is never even consulted
    for it. The second remediation''s own `not math.isfinite(...)` check incorrectly routed
    negative `Infinity` through that SAME one-millisecond clamp too, an observable divergence in
    the OPPOSITE direction from the original `L11-R014` mistake (0.001s instead of Pi''s own real
    1.0s for this specific input). Fixed with a new `_needs_host_timer_clamp` predicate
    (`math.isnan(x) or x == math.inf`, explicitly EXCLUDING negative `Infinity`) at all three
    affected call sites, so negative `Infinity` instead takes the ordinary `max(MINIMUM_INTERVAL_
    SECONDS, ...)` branch, which Python''s own plain `max()` already resolves correctly (unlike
    `NaN`, negative `Infinity` participates normally in ordering comparisons).

    Direct-call `abortable_sleep` regression (`L11-R017`, sixth-final-complete-review finding --
    the fourth remediation''s own `_needs_host_timer_clamp` predicate was correct for values
    reaching `abortable_sleep` THROUGH the poll loop''s own upstream normalization, but wrong for
    the SAME function called directly, standalone): pinned Pi''s own `abortableSleep` is ALSO an
    INDEPENDENTLY EXPORTED function, not merely a private detail of `pollOAuthDeviceCodeFlow`.
    Called directly -- bypassing the poll loop''s own `Math.max`-based normalization entirely --
    it has NO normalization step of its own and hands its raw `ms` argument straight to
    `setTimeout`, which clamps ANY delay outside `[1, 2147483647]` milliseconds (`NaN`, positive
    `Infinity`, NEGATIVE `Infinity`, zero, any other negative number, or any positive
    sub-millisecond number, ALL alike) to exactly one millisecond. `_needs_host_timer_clamp`
    explicitly excluded negative `Infinity` -- correct for the poll-loop-normalized case (`L11-
    R016`), but wrong for this direct-call boundary, where a raw negative `Infinity` reaching
    `abortable_sleep`''s own `while remaining > 0` loop with `remaining=-inf` performed ZERO sleep
    calls instead of Pi''s real one-millisecond wait. Fixed by replacing `_needs_host_timer_clamp`
    with a new `_needs_setimeout_clamp` predicate that models Node''s FULL documented `setTimeout`
    bounds check directly (`not (1 <= seconds*1000 <= 2_147_483_647)`, requiring no explicit `NaN`/
    `Infinity` special-casing at all -- ordinary chained comparison against `NaN` already evaluates
    `False` in both Python and JS, matching the predicate''s intended answer for it) as
    `abortable_sleep`''s OWN clamp, while the poll loop''s own two upstream call sites (initial-
    interval setup and the slow_down fallback increment) are simplified to check only
    `math.isnan(...)` before deferring to ordinary `max()` -- positive AND negative `Infinity` both
    already resolve correctly through plain Python `max()` at THAT boundary without any exclusion
    needed, so no behavioral change results for either value at those two call sites; only the
    `abortable_sleep` predicate itself gained the negative-Infinity (and raw zero/negative-finite)
    coverage the direct-call boundary requires. `spec/auth.md` (`L11-R018`) was also corrected: a
    prior revision''s general "non-finite interval clamps to one millisecond" sentence was scoped
    too broadly, contradicting the negative-Infinity paragraph beside it; the spec now names the
    two boundaries explicitly and scopes each rule to the boundary it actually governs.

    Direct-call fractional-millisecond truncation (`L11-R019`, seventh-final-complete-review
    finding): a VALID delay (one `_needs_setimeout_clamp` accepts, i.e. in `[1, 2147483647]` ms) is
    still not Pi-faithful at its own exact fractional-millisecond value -- Node''s real `setTimeout`
    internally truncates ANY accepted delay to a whole integer millisecond count before scheduling
    it (`Math.trunc`), independently of the documented invalid-range clamp `L11-R017` already
    covers. `abortable_sleep(0.0019, ...)` (1.9 ms), called directly, is neither `NaN`/`Infinity`
    nor outside the valid range, so `_needs_setimeout_clamp` left it untouched at its raw 1.9 ms --
    but Pi''s own real `setTimeout` truncates it to exactly 1 ms. Fixed by reusing
    `_floor_to_whole_milliseconds` (already `L11-R012`''s own helper for the poll loop''s explicit
    upstream `Math.floor`) as `abortable_sleep`''s OWN post-clamp step for any delay that was NOT
    routed through the invalid-delay fallback -- safe to reuse because a poll-loop-sourced delay is
    already whole-millisecond by construction (flooring it again is a no-op) and a direct-call raw
    fractional delay is now correctly truncated too. Discovered, during this same remediation, that
    naively reusing a bare `math.floor` here regressed the canonical
    `auth-device-code-expiry-without-slow-down` conformance scenario: the poll loop''s own
    deadline-capped `min(interval, remaining)` sleep amount is `remaining = deadline - now()`, a
    value DERIVED from repeated floating-point clock arithmetic (via `abortable_sleep`''s own
    slicing loop, a disclosed Python-only mechanic, not a Pi behavior) that can carry `~1e-13`s of
    summation drift -- a value MEANT to be an exact whole millisecond (e.g. `2000.0`) could arrive
    as `1999.999999999973`, and a bare floor would incorrectly truncate that to `1999` instead of
    the intended `2000`, undershooting the deadline and triggering one extra, unscripted poll()
    call. Fixed with a `1e-6` ms epsilon tolerance inside `_floor_to_whole_milliseconds` itself
    (`math.floor(seconds * 1000 + 1e-6) / 1000`) -- many orders of magnitude larger than any
    float-summation drift this module produces, yet many orders of magnitude smaller than the
    smallest genuinely-fractional delay any caller passes (e.g. the `1.9` ms witness above), so it
    corrects the former without ever masking the latter. This epsilon addition applies to EVERY
    caller of the helper (including the pre-existing `L11-R012` upstream-flooring call sites), but
    changes no previously-tested behavior there, since none of those literal, caller-supplied
    interval values were ever within `1e-6` ms of a whole-millisecond boundary to begin with.

    CORRECTION (`L11-R020`, eighth-final-complete-review finding -- the above ''epsilon-neutrality''
    claim was WRONG): the `L11-R019` remediation''s own reasoning ("changes no previously-tested
    behavior") was true only because no EXISTING test happened to exercise a genuine near-boundary
    input -- it did not establish that the epsilon was actually SAFE for one. It was not: `1.9999995`
    ms is a genuine, valid public delay (`_needs_setimeout_clamp` does not touch it, being well
    inside `[1, 2147483647]` ms), and pinned Pi''s real `setTimeout` (`Math.trunc`, which always
    rounds toward zero, never to nearest) truncates it DOWN to `1` ms -- but the global `1e-6` ms
    epsilon added by `L11-R019` rounded it UP to `2` ms instead, silently changing an observable
    result for a genuine caller/server-supplied delay, not merely correcting internal clock-drift
    noise as intended. The epsilon''s own justification (drift is always many orders of magnitude
    SMALLER than any genuine fractional delay) was correct for delay values seen so far in this
    project''s own tests, but the claim conflated "no CURRENTLY-TESTED input is affected" with "no
    POSSIBLE public input is affected" -- a public delay chosen deliberately close to a
    millisecond boundary (as this review''s own witness now permanently pins) is exactly the case
    the epsilon was never entitled to touch.

    Fixed by REMOVING the epsilon from `_floor_to_whole_milliseconds` entirely, restoring it to an
    EXACT `math.floor(seconds * 1000) / 1000` used for every genuine, publicly-observable delay
    (`L11-R012`''s own upstream flooring, and `L11-R019`''s own `abortable_sleep` direct-call
    truncation) -- these must always match Pi''s own exact `Math.trunc` with zero tolerance. The
    clock-drift-tolerance concept `L11-R019` was actually solving for is REAL and still needed, but
    only for ONE specific internally-derived value: `poll_device_code_flow`''s own deadline
    remainder (`deadline - now()`), which is the difference of two floats that can carry
    `abortable_sleep`''s own signal-polling-slicing summation drift (a disclosed, Python-only
    mechanic -- never a genuine external input). A new, narrowly-named helper,
    `_snap_deadline_remainder_to_whole_milliseconds`, carries the SAME `1e-6` ms epsilon tolerance
    but is used ONLY at the two call sites that compute that specific remainder (the
    `wait_before_first_poll` branch and the main poll loop''s own retry-sleep computation) --
    never anywhere a genuine caller/server-supplied delay could reach it. The permanent
    `1.9999995` ms -> `1` ms witness this review required is now pinned directly against
    `abortable_sleep`, proving the exact-truncation contract holds for a genuine near-boundary
    public delay, while the pre-existing `auth-device-code-expiry-without-slow-down` conformance
    scenario (this project''s own regression witness for the clock-drift problem `L11-R019`
    originally fixed) continues to pass unchanged, confirming the isolated fix still resolves that
    drift case without reintroducing the boundary-rounding defect this finding identified.

    CORRECTION (`L11-R021`, ninth-final-complete-review finding -- the above ''never anywhere a
    genuine caller/server-supplied delay could reach it'' provenance claim was WRONG): `L11-R020`''s
    own reasoning assumed `poll_device_code_flow`''s own `remaining = deadline - now()` is always
    INTERNALLY DERIVED and therefore always safe to tolerance-snap -- but `remaining` is not
    reliably drift-affected at all. On a FIRST computation (`wait_before_first_poll=True`, no sleep
    yet performed), `remaining` is `deadline - now()` where `now()` has not advanced by any
    summation yet -- it is arithmetic-identical to the caller''s own supplied `expires_in_seconds`,
    a genuine public value. With `expires_in_seconds=0.0019999995` (1.9999995 ms) and
    `wait_before_first_poll=True` on a stable clock, `_snap_deadline_remainder_to_whole_milliseconds`
    rounded this genuine caller-supplied expiry UP to `2` ms -- pinned Pi''s real `setTimeout`
    truncates it DOWN to `1` ms. The distinction `L11-R020` drew ("internal deadline remainder" vs.
    "genuine public delay") does not correspond to any real boundary in the code: the SAME
    expression, `deadline - now()`, is sometimes an exact copy of a public input and sometimes a
    drift-affected internal computation, depending only on how many sleeps happened to precede it --
    a property no amount of narrowing WHERE the tolerance is applied can fix, because the value
    itself is ambiguous, not the call site.

    Fixed by removing `_snap_deadline_remainder_to_whole_milliseconds` and ALL tolerance from this
    module''s own production scheduling arithmetic entirely: `_floor_to_whole_milliseconds` is now
    the ONLY truncation this module performs, applied identically and exactly to every delay
    `abortable_sleep` ever schedules, with no exceptions and no epsilon anywhere, matching Pi''s own
    real `Math.trunc` with zero tolerance for every input regardless of provenance. The
    floating-point summation drift the two prior revisions were actually trying to compensate for
    is entirely a property of the TEST DOUBLE clocks (`FakeClock` in `tests/auth/test_device_code.py`
    and `_InstantClock` in `tests/conformance/auth_device_code_runner.py`), which advance by
    repeatedly SUMMING whatever durations `abortable_sleep`''s own signal-polling slicing loop
    requests -- a REAL monotonic clock is read directly and carries no such compounding summation
    error. Both fake clocks now round their own accumulated `elapsed` value to nanosecond precision
    (`round(self.elapsed + seconds, 9)`) after every increment, which prevents the ~`1e-13`s of
    per-slice error from ever compounding across many slices, while never touching any delay value
    this module actually schedules -- the fix lives entirely in the test doubles that manufacture
    the drift, never in production arithmetic that must stay exact for every input. The permanent
    `expires_in_seconds=0.0019999995`/`wait_before_first_poll=True` witness this review required is
    now pinned directly against `poll_device_code_flow`, and the pre-existing
    `auth-device-code-expiry-without-slow-down` conformance scenario continues to pass via the fake
    clocks'' own rounding fix, confirmed by revert-and-confirm in both directions.

    Signal-type widening (owner-approved, `GOVERNANCE_SOURCE` recorded verbatim at
    `https://github.com/EGAILab/minion-agent/issues/29#issuecomment-5687465258`, per
    `agent-workflow.md` §11.10 -- filed retroactively in response to `L11-SC-R019`, an independent
    review finding that this decision, unlike every other owner-governance decision this Slice''s
    work cites, was never posted as its own durable GOVERNANCE_SOURCE comment at the time it was
    made; discovered during `PROV-012` implementation -- pure type-signature generalization, NO
    behavior change): `abortable_sleep`/`poll_device_code_flow`
    both previously typed their own `signal` parameter as the CONCRETE `RunSignal | None`
    (`runtime/signal.py`), not the abstract `Abortable` protocol (`auth/signal.py`) already-
    certified `PROV-008` uses. This blocked `PROV-012`''s own device-code integration, whose
    `ProviderAuthInteraction.signal` (`PROV-014`, `interaction.py:254`) is deliberately typed
    `Abortable`, not `RunSignal` -- a genuine cross-layer static-typing conflict between two
    already-certified rows, reported to the owner rather than silently resolved (per
    `agent-workflow.md` §11.7''s own "do not silently widen a certified contract" discipline).
    Confirmed before requesting the decision: this module never calls anything RunSignal-specific
    anywhere -- every use of `signal` in `device_code.py` is either the type annotation itself or a
    plain `signal.aborted` read (grepped and verified exhaustively) -- so widening to `Abortable |
    None` is 100% behavior-preserving; `RunSignal` itself already satisfies `Abortable`
    structurally, so every existing caller is unaffected. Owner approved the widening explicitly

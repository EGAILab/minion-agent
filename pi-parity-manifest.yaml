- id: AG-023
  phase: 3
  pi: packages/agent/src/agent-loop.ts::streamAssistantResponse (config.transformContext(messages, signal))
  surface: per-request message-history transform, invoked immediately before every provider request
  rule: 'Layer 09, PASS 2 (remediating `L09-R005`, `CONTRACT_ASSURANCE_DEFECT`, found by an
    independent Rust contract review of the PASS-1 candidate): pinned Pi''s own `config.
    transformContext(messages, signal)` is an OPTIONAL per-request projection of the outgoing
    message history, invoked immediately before every provider request -- omitted entirely from
    both the original Layer-09 contract checkpoint''s own consumer matrix and the PASS-1
    implementation, despite the checkpoint predating this row and having every opportunity to
    include it. Re-audited directly against pinned Pi source (`ref-repos/pi` @ `b7bb00b`,
    `agent-loop.ts:288-292`): `messages = await config.transformContext(messages, signal)`
    reassigns ONLY the function''s own LOCAL `messages` variable -- never `context.messages`/
    `currentContext.messages`, the run''s own persistent/run-local accumulator -- so a transform''s
    own output is provider-local for that ONE request, never carried into a later turn''s own
    request.

    `AGENT_PRE_STEP` is NOT equivalent -- an independent review named this explicitly: it runs
    ONCE, at INPUT ADMISSION boundaries, and its own decision changes what gets durably admitted
    into the run''s own accumulated transcript; this event runs on EVERY request (once per turn,
    not once per run) and never mutates the persistent transcript at all.

    New `AGENT_TRANSFORM_CONTEXT` waterfall event (`agent/events.py`), listener signature
    `(instance, messages, signal, next_) -> tuple[Message, ...]` -- `instance` first, matching
    every other Minion-architecture-mapped agent-level listener (`AG-001`..`AG-009`, `spec/
    agent.md`''s own architectural-mapping note); `signal` explicit, the SAME active-run `RunSignal`
    every other consumer receives. Terminal reflects whatever `messages` value is current when the
    chain ends (an earlier revision used a FIXED terminal, which would have discarded a delegating
    listener''s own transformation -- corrected before landing, matching `tools/post-execute`''s
    own established "terminal is the current payload" convention, not `tools/pre-execute`''s
    fixed-decision-object convention, since this event transforms a VALUE rather than producing a
    DECISION). Dispatched in `AgentLoop._run_step`, immediately before `Request` construction,
    transforming the already-history-windowed message tuple; the transformed value is used ONLY
    for that one `Request.messages` and is never written back to `context`/`RunContext.messages`.
    Zero listeners (every caller before this pass existed) preserves prior behavior exactly --
    purely additive, no certified Layer-08 rule reopened.

    Discriminating evidence: a registered listener injects a synthetic marker message into the
    outgoing request; the marker is present in that request''s own `Request.messages`, present
    again (independently re-injected) in the NEXT turn''s own request after a tool call, and
    absent from `AgentInstance.messages`'' own durable, offline-visible transcript at every point
    -- proving the transform is genuinely provider-local and non-persistent, not merely
    "transformed once and cached."

    PASS 3 (targeted re-review of the PASS-2 candidate, `L09-R006`, a new `PI_PARITY_DEFECT`):
    this row''s own semantic surface -- provider-local, non-persistent transformation -- was
    confirmed correct and left untouched; the defect was that `signal`, the third payload argument
    above, was ordinary payload rather than authoritative metadata, so a listener delegating with a
    replacement or omitted `signal` could redirect or drop it for a listener downstream in the same
    chain. Remediation: `_transform_context`''s own waterfall dispatch now supplies a
    `normalize_step` closure (`_restore_signal`) that forces the tuple''s `signal` slot back to the
    closure-captured original at every listener-to-listener handoff -- the same mechanism applied
    to `TOOLS_PRE_EXECUTE`/`TOOLS_POST_EXECUTE` (`TOOL-024`) for the identical finding. A dedicated
    regression test confirmed genuinely discriminating via revert-and-confirm (FAILED with
    `normalize_step` stripped, PASSED once restored).

    PASS 10 (`L09-R018` convergence, `PI_PARITY_DEFECT`; mandatory `§11.8.8` final review of the
    PASS-9 candidate, `minion-agent-docs#38`, then a two-revision `§11.8.4`/`§11.8.5` checkpoint
    cycle, `assurance/layers/09-active-abort-contract-checkpoint-r018-convergence.md`,
    `CONVERGENCE CONTRACT AGREED FOR IMPLEMENTATION` at `minion-agent-docs#40` @
    `15d5173d5d7a18c35f7841fe42d533e74bb672a2`): `AGENT_TRANSFORM_CONTEXT`''s own payload,
    `(instance, messages, signal)`, sandwiches its ONE transformable field between its TWO
    authoritative fields -- the ONLY current waterfall dispatch with this shape (every other
    authoritative-metadata waterfall in this codebase has exactly one authoritative field, always
    at a fixed end). PASS 3''s own `_restore_signal` treated ANY `current` of length >= 2 as
    `(instance_attempt, messages, ...)` unconditionally -- correct for a listener genuinely
    omitting only `signal` (`next_(instance_attempt, messages)`), but SILENTLY WRONG for one
    genuinely omitting only `instance` (`next_(messages, signal)`): both produce an identical
    length-2 tuple, so the code could not tell them apart, and for the untested direction it
    discarded the caller''s real `messages` and forwarded a live `RunSignal` downstream, and
    eventually into the real provider request, AS `messages` -- an independent Rust review''s own
    executed witness reproduced exactly this (`downstream_messages_type RunSignal`,
    `request_messages_type RunSignal`).

    The agreed remediation does not add a case-by-case check for the untested direction: it
    restricts the legal delegation grammar to exactly `{0, 1, 3}` -- length 0 (no-op forward),
    length 1 (`next_(new_messages)`, supplying ONLY the transformable field, both authoritative
    fields always restored -- a strict generalization of the original "no need to re-supply
    `signal`" convenience to "no need to re-supply EITHER authoritative field"), and length 3
    (full explicit, unchanged). Length 2 -- inherently ambiguous, since two DIFFERENT single-field
    omissions collapse to the identical length -- is no longer silently guessed at all: `_restore_
    signal` raises `WaterfallError` (`runtime/errors.py`, already certified) DIRECTLY at this
    authority boundary, before the malformed tuple is ever forwarded to a later listener, so no
    downstream listener -- however permissive its own signature -- can ever observe or absorb it
    (verified by a required negative witness: a deliberately variadic downstream listener, proven
    never invoked). Because `_transform_context` runs inside `AgentLoop._execute_run`''s own

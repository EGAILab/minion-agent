- id: EXEC-007
  phase: 6
  pi: 'no single direct Pi operation -- the BEHAVIOR is modeled on pinned Pi''s coding-agent `ls`
    TOOL''s own inline enumeration loop, packages/coding-agent/src/core/tools/ls.ts:145-176
    (readdir -> sort -> lazy per-entry symlink-following stat, cap checked before each probe),

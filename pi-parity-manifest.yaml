    `handleRunFailure`''s own synthesized failure `AssistantMessage` reports. Discriminating witness:
    start a run with persistent Agent model A; a `prepareNextTurn` listener replaces the RUN-LOCAL
    model with B for a later turn; a further lifecycle listener throws after that replacement has
    landed. Pinned Pi (`agent.ts:511-517`, re-audited directly) synthesizes `api`/`provider`/`model`
    from `this._state.model` -- confirmed by full-file inspection to be the Agent''s own PERSISTENT
    model, set once at construction, with NO `this._state.model = ...` assignment anywhere in
    `agent.ts` -- so `handleRunFailure` reports A, never B, regardless of any `prepareNextTurn`
    replacement already in effect for the run currently failing (`prepareNextTurn`''s own returned
    `model` only ever reassigns the LOCAL `config` a single `run()` call keeps, `agent-loop.ts:
    230-238`, never `this._state`). The merged Python candidate''s own `_settle_run_failure` instead
    read `config.model` -- the run-local `RunConfig` parameter passed in from `_execute_run`, which
    `AGENT_PREPARE_NEXT_TURN`''s own handling (`config.model = update.model`, matching pinned Pi''s
    own local reassignment exactly) may already have replaced by the time a later listener throws --
    producing B where pinned Pi produces A, for exactly this ordering. The shared contract was
    genuinely silent on which source was correct: two reasonable independent implementations could
    read `AG-009`''s prior text and choose either, exactly the risk `process/agent-workflow.md`
    section 7''s own contract-quality rule warns against.

    Remediation: `spec/agent.md` gained explicit normative text in both the `handleRunFailure` seam
    section and the Python-mapping section, naming `self.instance.model`
    (`AgentInstance`''s own PERSISTENT model, Minion''s architectural analogue of `this._state.model`)
    as the failure-identity source, and explicitly stating the run-local `RunConfig`/`prepareNextTurn`
    override is NOT that source, with the concrete A -> run-local B -> failure witness spelled out
    normatively so a second independent implementation does not have to rediscover it from source
    inspection. `driver.py::AgentLoop._settle_run_failure` now reads `self.instance.model.model`/
    `self.instance.model.provider` instead of `config.model.model`/`config.model.provider`, and its
    own `config: RunConfig` parameter is REMOVED entirely (not merely unread) since the run-local
    config carried no other legitimate use in this method; the one call site
    (`_execute_run`''s own `except Exception` handler) updated to match. A new, genuinely
    discriminating Python-level test
    (`test_settle_run_failure_uses_the_agents_persistent_model_not_the_run_local_override`,
    `tests/agent_loop/test_run_entry_points.py`) reproduces the exact A -> run-local B -> failure
    witness via the existing `_MultiModelAdapter`/`AGENT_PREPARE_NEXT_TURN` test machinery already
    used by `test_prepare_next_turn_can_replace_model_and_thinking_level` (`AG-001`/`L08-R001`),
    combined with a throwing `AGENT_TURN_STOPPING` listener (the same mechanism
    `test_a_post_turn_callback_failure_recovers_through_the_live_seam` already uses to trigger
    `_settle_run_failure`) -- confirmed genuinely discriminating by running it against the reverted
    (`config.model`-reading) implementation first, where it fails asserting failure identity
    `(mock, mock-2)` against the expected `(mock, mock-1)`, then restoring the fix and
    re-confirming it passes. No canonical
    (language-neutral) scenario was added this pass: the conformance schema/runner currently has no
    vocabulary for injecting a `prepareNextTurn` model override alongside a throwing lifecycle

- id: AG-014
  phase: 3
  pi: packages/agent/src/agent.ts::createMutableAgentState, Agent.state (systemPrompt/model/thinkingLevel), packages/agent/src/types.ts::ThinkingLevel
  surface: mutable per-instance current configuration (assurance Layer 07)
  rule: 'L07-R001, PI_PARITY_DEFECT, resolved this pass. Re-audited directly against pinned Pi
    source, not the independent review''s own description: `createMutableAgentState` returns an
    object whose `systemPrompt`/`model`/`thinkingLevel` are plain, directly assignable properties
    (not accessor methods) defaulting from `initialState?.systemPrompt ?? ""` /
    `initialState?.model ?? DEFAULT_MODEL` / `initialState?.thinkingLevel ?? "off"`; `Agent.state`
    returns this same live object, so `agent.state.systemPrompt = "..."` immediately mutates that
    one Agent''s own current value and is read by every subsequent run -- distinct from
    `AgentDefinition`''s shared, frozen defaults, which never change once an instance has minted
    its own current value. `ThinkingLevel` is pinned Pi''s own seven-value union
    (`"off"|"minimal"|"low"|"medium"|"high"|"xhigh"|"max"`), adopted verbatim.

    Minion reproduces this with `AgentInstance.system_prompt`/`.model`/`.thinking_level`: plain
    mutable instance attributes, initialized from `definition.system`/`.model`/`ThinkingLevel.OFF`
    at construction, then freely reassignable per instance. Proven that mutating one instance never
    affects a sibling instance of the same definition, nor the definition itself
    (test_mutating_one_instances_config_does_not_affect_a_sibling_or_the_definition). `AgentDefinition`
    itself remains frozen and shared -- Minion does NOT make the shared definition mutable to
    imitate Pi, matching the independent review''s own preferred architecture (an immutable
    definition supplying defaults, with each instance owning mutable current configuration).

    Ownership vs. consumption (explicitly not conflated, per the independent review''s own
    objection to the prior pass''s reasoning): Layer 07 owns the current value and its mutation
    surface, now. The existing, uncertified `AgentLoop`/`driver.py` (Layer 08) still reads
    `instance.definition.model`/`.definition.system` directly for an actual request -- it was not
    rewired to read `instance.model`/`.system_prompt` instead, since that is Layer-08 run/turn
    implementation this narrow Layer-07 pass has no mandate to modify. This is a disclosed,
    deliberate scope boundary, not a silent omission: the independent review''s own words --
    "Layer 07 must define current per-instance state and its mutation surface; Layer 08 may own
    when run snapshots are consumed" -- explicitly accept that Layer 07''s obligation ends at
    defining a clean, mutable primitive Layer 08 CAN consume without redesign, not that Layer 08
    must already consume it before Layer 08 itself is undertaken.'

- id: PROV-015
  phase: 5
  pi: 'packages/ai/src/auth/types.ts::AuthInteraction/ProviderAuthInteraction (`signal` field
    mutability specifically, `types.ts:156-164`)'
  surface: Layer 11 Pass 2, Slice B -- Python-binding language-mechanics divergence for
    AuthInteraction.signal widened-reference assignability (`L11-SB-R006`)
  rule: 'INTENTIONAL, NARROW, OWNER-APPROVED LANGUAGE-BINDING DIVERGENCE (`L11-SB-R006`, second
    independent Rust contract review; `GOVERNANCE_SOURCE` recorded verbatim at
    `https://github.com/EGAILab/minion-agent/issues/29#issuecomment-5664609556`, per
    `agent-workflow.md` §11.10). Deliberately SEPARATE from `PROV-014`''s own row, per the owner''s
    own explicit instruction not to silently mix a divergence into an otherwise fully-`adopted`
    interaction-vocabulary surface.

    Pinned Pi''s own TypeScript type system permits TWO properties of `AuthInteraction`/
    `ProviderAuthInteraction`''s own `signal` field simultaneously: (1) `ProviderAuthInteraction =
    AuthInteraction & { signal: AbortSignal }` is a genuine SUBTYPE of `AuthInteraction` (a
    normalized interaction with a REQUIRED `signal` remains usable anywhere the wider, OPTIONAL-
    `signal` `AuthInteraction` is expected); and (2) `signal` is a plain, non-`readonly` property on
    BOTH types, assignable through either. Independently and mathematically confirmed (via direct
    `mypy` probes, not merely asserted) that Python''s own SOUND static type system cannot express
    BOTH properties simultaneously for two protocols whose own `signal` type genuinely differs
    (`Abortable | None` vs. required `Abortable`): a mutable Protocol attribute, OR a full read/
    write `@property` with a matching `.setter`, is INVARIANT for structural-typing purposes, which
    breaks property (1); a READ-ONLY `@property` restores property (1) (COVARIANT) but necessarily
    forfeits assignment through the WIDENED `AuthInteraction`-typed reference specifically -- this
    is not a Python implementation gap to be fixed with cleverer code, but a genuine, unavoidable
    consequence of TypeScript''s own well-documented UNSOUNDNESS for this exact mutable-property-
    variance combination, which a sound type system cannot safely replicate.

    Owner governance explicitly chose to preserve property (1) (the subtyping relationship and the
    provider-login guaranteed-`signal` invariant `L11-SB-R002` itself restored) over property (2)
    (widened-reference assignability), after confirming -- by grepping the ENTIRE pinned Pi source
    tree (`packages/ai/src`, `packages/coding-agent/src`) -- that NO actual Pi call site anywhere
    ever reassigns an interaction''s own `signal` after construction. The sacrificed capability is a
    STATIC PERMISSION Pi''s own real code never exercises, not an observed runtime behavior.

    SCOPE, EXACTLY: code holding a value statically typed as `AuthInteraction`/
    `ProviderAuthInteraction` cannot assign `.signal` through that Protocol-typed reference in
    Python (`mypy` reports `Property "signal" ... is read-only`). This divergence does NOT extend
    to runtime behavior or to any CONCRETE implementation: a concrete class backing either Protocol
    remains free to expose its own mutable `signal` attribute or setter through its OWN concrete
    type -- matching Pi''s own real object behavior exactly -- as long as the Protocol''s own
    read-only view is what generic, vocabulary-consuming code sees. No runtime immutability is
    introduced anywhere by this divergence.

    RUST: this decision does not prescribe Python property mechanics for Rust. Rust must preserve
    the language-neutral semantic contract this row states -- `ProviderAuthInteraction` specializes
    `AuthInteraction`; a provider''s own `login()` receives a guaranteed-present `signal` -- using
    whatever mutability representation is idiomatic and sound for Rust''s own type system; that
    representation is reviewed independently when Rust implements this row, not prescribed here.'
  tests:
  - 'tests/typing/valid_interaction_vocabulary.py (the SAME permanent static-type evidence file as
    `PROV-014`, since this divergence is a property of that same module''s own two Protocol
    classes -- the `_as_base_interaction`/`_also_base_interaction` assignability witnesses prove
    property (1), the subtyping relationship this divergence was chosen to preserve, is intact)'
  python: src/minion_agent/auth/interaction.py
  rust: 'minion-agent-rust/crates/minion-agent/src/auth/interaction.rs
    (`ProviderAuthInteraction: AuthInteraction` with one read-only optional signal authority and a
    guaranteed-present provider projection); integration evidence in

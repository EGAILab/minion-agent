    no-more-tool-calls stop, running the full post-turn sequence regardless of `stop_reason` -- this
    pass adds an explicit `_StepResult.terminal` flag `_run_step` sets when
    `reply.stop_reason in (ERROR, ABORTED)`, and `_run_inner` returns immediately on `terminal`,
    before ever calling `_prepare_next_turn`/`_should_stop`/claiming steering or follow-up.
    Discriminating evidence installs listeners on all four skipped hooks/queues and proves none is
    invoked/consumed for both `error` and `aborted`

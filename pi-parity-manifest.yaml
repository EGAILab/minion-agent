- id: AI-032
  phase: 2
  pi: 'packages/ai/src/types.ts::ProviderStreams.fetchDeferred?/cancelDeferred?, DeferredFetchOptions,
    DeferredCancelOptions; packages/ai/src/models.ts::ModelsImpl.fetchDeferred/cancelDeferred,
    createProvider''s mixed-API capability synthesis; packages/ai/src/api/lazy.ts::LazyApiCapabilities;

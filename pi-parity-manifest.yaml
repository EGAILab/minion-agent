    happy-path reorder above was confirmed correct, but a synchronous RUNNING/IDLE observer that
    ITSELF THROWS was left entirely ungoverned: the controller/status writes above happen BEFORE
    `_run_wrapped`''s own `try`/`finally`, so a throwing RUNNING observer left `status` permanently
    stuck `RUNNING` with a live, orphaned signal (every later `prompt()` rejected forever), and
    `continue_()`/`run_until_idle()`''s own already-claimed inbox input (drained from `Inbox`

- id: EXEC-003
  phase: 6
  pi: 'no direct Pi source for FsTarget itself -- see spec/execution.md §4; but the target_key
    MECHANISM is now modeled directly on Pi''s own REAL mutation-queue key derivation,
    packages/agent/src/harness/tools/file-mutation-queue.ts:20-26 (getMutationQueueKey)'
  surface: Layer 12, WP-12.1 -- the FsTarget bridge (target_key, process_path)
  rule: 'REMEDIATED (independent Rust contract review, `L12-R005`/`L12-R008`; convergence episode
    `CE-L12-01-01`, `minion-agent-docs#113`, resolving a refined `L12-R005` finding from a second
    independent review, `minion-agent-docs#112`). MINION_ARCHITECTURAL_MAPPING, owner-approved
    explicitly (GOVERNANCE_SOURCE
    `https://github.com/EGAILab/minion-agent/issues/39#issuecomment-5736233272`): `resolve(path)
    -> Result[FsTarget, FsError]`; `FsTarget.target_key` is an opaque, backend-defined identity
    value with no promised syntax; `process_path(target) -> Result[str, FsError]` returns the path
    a process in the target''s own execution world (`EXEC-006`) can open to reach the same
    resource.

    `process_path`''s canonical-vs-lexical form (post-closure finding `L12-R021`, discovered during
    the first independent Rust closure review of the merged contract, `minion-agent#41`/
    `minion-agent-docs#118`): this row previously left the returned string''s exact form unstated.
    Corrected: `process_path(target)` returns the SAME string already used to derive that target''s
    own `target_key` (the canonical-if-exists/absolute-if-missing derivation below) -- CANONICAL
    once the resource exists, LEXICAL-ABSOLUTE for a not-yet-existing target''s own future
    location. No separately-computed path; the two are the same value.

    Correction (`L12-R005`, first remediation, full detail: `spec/execution.md` §4): an earlier
    revision left this guarantee unimplementable and internally self-contradictory (provider-
    discretionary symlink identity contradicting a fixed-identity requirement; a content-hash
    mechanism that cannot satisfy the stated guarantee in either direction).

    Second correction (`L12-R005`, convergence): the first remediation''s own fix then required
    BOTH "survives rename" (a resource-identity property) AND "not-yet-existing-target support" (a
    location-identity property) from ONE mechanism -- a genuine logical impossibility (a
    device+inode-equivalent pair satisfies the former but cannot predict a future inode for a
    missing path; a canonical-path string satisfies the latter but changes on rename). Resolved by
    re-reading pinned Pi''s own REAL mutation-queue key derivation (`getMutationQueueKey`,
    `file-mutation-queue.ts:20-26`): a canonical-path STRING, falling back to the absolute path
    when canonicalization fails (the not-yet-existing-path case) -- genuinely LOCATION-based, and
    NOT designed to survive rename at all. `target_key` now adopts this SAME model:

    `target_key = canonical_path(path) if it exists, else absolute_path(path)` -- mirrors Pi''s
    own `getMutationQueueKey` exactly, including the not-yet-existing fallback.

    Exact fallback condition (refined `L12-R016`, second final complete review,
    `minion-agent-docs#114`, convergence episode `CE-L12-01-03` -- the prose above did not commit
    to a precise condition, permitting mutually different Rust implementations): `absolute_path`
    is used ONLY when `canonical_path` fails with error code `not_found` or `not_supported`. Any
    OTHER `canonical_path` failure (`permission_denied`, `invalid`, `not_directory`, `is_directory`,
    `unknown`) PROPAGATES as `resolve()`''s own `FsError` -- no silent fallback for those cases.
    `DIRECT_PI_PARITY`: pinned Pi''s own `getMutationQueueKey` falls back for exactly these two
    codes and re-throws for any other (`file-mutation-queue.ts:20-26`).

    `resolve()`''s own cancellation classification (refined `L12-R016`, CE-L12-01-03):
    `resolve(path, signal?)` is in the accepts-but-does-not-inspect group (`EXEC-002`''s own §3.1
    table) -- a direct consequence of composing `absolute_path` and `canonical_path`, both already
    in that group.

    Symlink identity holds WHEN canonicalization succeeds, not unconditionally (refined `L12-R018`,
    third final complete review, `minion-agent-docs#114`, convergence episode `CE-L12-01-04`;
    narrowed per the `agent-workflow.md` §11.10 governance decision recorded in
    `minion-agent-docs#117`): an earlier revision of this row claimed symlink identity "falls out
    of the derivation for free" unconditionally. That contradicts the exact fallback condition
    above -- a provider whose `canonical_path` returns `not_supported` for every path falls back to
    LEXICAL `absolute_path` for both a symlink and its target, producing UNEQUAL keys. Corrected:
    symlink identity is fixed via `canonical_path` for every canonicalization-CAPABLE provider
    (every provider this row currently certifies; pinned Pi''s own local reference implementation''s
    `toFileError` never produces `not_supported` at all, `nodejs.ts:97-121`, so this narrowing
    affects no current provider). A provider whose `canonical_path` is unsupported is NOT required
    to alias-unify a symlink with its target -- a documented provider limitation, not a contract
    violation.

    Binding consequences: content mutation in place leaves `target_key`
    unchanged; renaming `a` to `b` CHANGES the `target_key` (different canonical paths -- CORRECT,
    not a defect, matching Pi''s own queue); deleting `a` and creating a new, unrelated file also
    named `a` REUSES the same `target_key`, PROVIDED no ancestor directory component of `a`''s path
    is or becomes a symlink in between (see the symlinked-ancestor exception below) -- when it
    holds, this reuse is correct and safe: conservative serialization against the same queue key,
    never wrong; a device+inode-equivalent pair is now EXCLUDED alongside the already-excluded
    content hash, since it cannot satisfy the not-yet-existing-target case. Canonical-path-string
    (falling back to absolute-path) is the ONE specified mechanism, not one option among several.
    Equality is by RESOLVED LOCATION, not by syntactic path equality -- two DIFFERENT syntactic
    paths that resolve to the SAME location (a symlink and its target) correctly share one
    `target_key`; two `resolve()` calls reaching DIFFERENT resolved locations produce unequal keys.
    `target_key` comparison remains scoped to ONE provider instance; `target_key` MUST support
    stable equality/hashing under this rule.

    `process_path` scoped to the producing provider only (refined `L12-R014`, final complete
    review, `minion-agent-docs#114`, convergence episode `CE-L12-01-02`; second correction,
    targeted closure review, `minion-agent-docs#114`, CE-L12-01-02): an earlier revision permitted
    `process_path(target)` on the producing provider "or one independently validated as
    execution-world-compatible via `EXEC-006`" -- contradicting this row''s own provider-scoping
    rule above. Execution-world compatibility is a statement about whether a RESULTING PATH STRING
    is meaningful across providers, not a grant of authority for a second provider to decode the
    first provider''s own opaque `target_key`. Corrected: `process_path(target)` MUST be called on
    the SAME provider instance that produced `target` -- no exception.

    A first fix then stated calling it on any other provider is "outside this contract (undefined)"
    while also requiring a detecting provider to "return FsError (invalid)" -- two incompatible
    classifications for the identical call. Corrected to ONE rule: calling `process_path` on any
    non-producing provider is UNIFORMLY undefined (a caller bug), not a case with its own required
    `Result`. A provider MAY, as best-effort hardening, detect foreign provenance and return
    `FsError(invalid)` instead of a fabricated path, but this is NOT required -- a caller must not
    rely on receiving any particular `Result` from this out-of-contract call. The cross-seam
    workflow: `resolve()` and `process_path()` both happen on the originating `ctx.fs` provider;
    the resulting PATH STRING (never the `FsTarget`/`target_key` itself) is handed to a
    `ctx.shell`/`ctx.subprocess` provider independently validated as execution-world-compatible
    (`EXEC-006`) with that SAME `ctx.fs` provider.

    Symlinked-ancestor exception to missing-then-create stability (refined `L12-R005`, targeted
    closure review, `minion-agent-docs#114`): a not-yet-existing path''s `target_key` uses the
    `absolute_path` fallback -- purely lexical, resolving NO symlink, including one in an ANCESTOR
    directory component. Once the resource exists, `canonical_path` resolves EVERY symlink
    component, ancestors included. For an ordinary path with no symlinked ancestor these coincide,
    so the key is stable across creation. For a path whose ancestor is (or becomes) a symlink, they
    do NOT coincide, and the key CHANGES across creation -- confirmed by direct reasoning about
    `realpath` semantics and reproduced with an executable witness (`resolve("link/new.txt")`
    before creation yields the lexical `.../link/new.txt`; after creating through `link`, it yields
    the canonicalized `.../real/new.txt` -- unequal). This is NOT a Minion-introduced defect:
    pinned Pi''s own real `getMutationQueueKey` calls the identical `absolutePath`/`canonicalPath`
    fallback pair in the identical order (`file-mutation-queue.ts:20-26`), so Pi''s own real
    mutation queue has this exact same property. `target_key` adopts Pi''s OBSERVABLE behavior here
    exactly, including this instability, rather than inventing a stronger cross-creation guarantee
    Pi''s own real mechanism does not provide -- consistent with `EXEC-002`''s own cancellation
    sourcing decision: Minion does not silently strengthen an incomplete Pi mechanism into an
    idealized promise.

    Disposition correction (`L12-R008`): redispositioned `adopted` -> `intentional divergence`.
    This row''s own text always said "no Pi equivalent" for the FsTarget SHAPE itself (though the
    target_key MECHANISM is now DIRECT_PI_PARITY-adjacent, modeled on Pi''s own real mutation-
    queue key); `adopted` was incoherent alongside the shape''s own no-Pi-equivalent admission.
    Matches existing manifest precedent for Minion-only surfaces (`MINION-001`: `pi: N/A --
    Minion plugin architecture`, `disposition: intentional divergence`).

    Full detail: `spec/execution.md` §4.'

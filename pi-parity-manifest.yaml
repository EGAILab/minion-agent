  surface: Layer 12, WP-12.1 -- ctx.shell (shell command execution capability seam)
  rule: 'REMEDIATED (independent Rust contract review, `L12-R004`/`L12-R007`). DIRECT_PI_PARITY.
    `exec(command, cwd?, env?, inherit_env=true, timeout?, signal?, on_stdout?, on_stderr?) ->
    Result[{stdout,stderr,exit_code}, ShellError]`; `cleanup()` best-effort, must not raise.

    Shell resolution (observable guarantee is DIRECT_PI_PARITY; the discovery mechanism itself is
    per-platform implementation mechanics): prefer `bash` if locatable (configured path, else a
    well-known local install path, else a PATH search); on POSIX, silently fall back to `sh` if no
    `bash` is found at all; on Windows, fail with `shell_unavailable` and a specific, actionable
    diagnostic if no `bash` can be located by any method.

    Working-directory precondition: the resolved cwd is checked to exist BEFORE attempting to
    spawn anything, failing early with `spawn_error` and a specific diagnostic naming the missing
    directory if it does not. This check happens AFTER shell discovery, not before (see the
    precedence matrix below).

    Environment: `inherit_env` defaults true. When true, the effective environment is the seam
    provider''s own base/inherited environment overlaid by any per-call `env`. When false, the
    effective environment is EXACTLY the per-call `env` and nothing else.

    Complete failure-precedence matrix (`L12-R007` resolved -- an earlier revision of this row
    stated only the mid-flight timeout-vs-abort ordering, not the full sequence; refined `L12-R010`,
    final complete review, `minion-agent-docs#114`, convergence episode `CE-L12-01-02` -- the
    combined "cwd/shell resolution" step split into its own exact order): checked in this EXACT
    order -- (1) pre-aborted signal; (2) invalid timeout (finite/positive/within the exact
    boundary below), before any process is spawned; (3) lexical cwd resolution (a pure string
    operation, no filesystem touch); (4) shell discovery (`getShellConfig`, MAY fail
    `shell_unavailable`) -- happens BEFORE the cwd existence check, not after: a configured-
    nonexistent shell together with a nonexistent cwd observably returns `shell_unavailable`, never
    `spawn_error`; (5) cwd existence check (`access(cwd)`, MAY fail `spawn_error`); (6) process
    runs; (7) on completion/interruption, exactly one of, in precedence order: callback_error (wins
    over everything else) > timeout > aborted > success ({stdout,stderr,exit_code}, regardless of
    exit_code). Killing a command on either abort or timeout terminates its ENTIRE process tree/
    group.

    Exact timeout ceiling (refined `L12-R011`, final complete review, `minion-agent-docs#114`,
    convergence episode `CE-L12-01-02` -- an earlier revision said "roughly `2^31/1000` seconds,"
    which is `2147483.648`, not the actual boundary): pinned Pi''s own constant is `MAX_TIMEOUT_MS
    = 2_147_483_647` (`2^31 - 1`, `nodejs.ts:34`). A timeout is rejected when `timeout * 1000 >
    2_147_483_647`. The largest ACCEPTED value is `2147483.647` seconds exactly; `2147483.648`
    seconds is rejected.

    Streaming/callback-error: `on_stdout`/`on_stderr`, when provided, are invoked with each chunk
    as it arrives IN ADDITION TO the full stdout/stderr the final Result carries. A throwing
    callback is classified `callback_error` (`EXEC-001`) and kills the in-flight command.

    Completion mechanics (`L12-R007` -- corrected twice: a first remediation fixed an earlier
    revision of `EXEC-005` that described this seam''s own completion as requiring stdio to
    "fully drain," overstating the actual guarantee, but left the idle period vague as "short";
    convergence episode `CE-L12-01-01`, `minion-agent-docs#113`, restored the exact constant after
    a second independent review, `minion-agent-docs#112`, flagged the vagueness): once the
    directly-spawned process exits, arm an idle-grace timer of `EXIT_STDIO_GRACE_MS = 100`
    milliseconds (`nodejs.ts` `armIdleTimer`/`onData`/`onExit`, lines ~305-334). Any stdout/stderr
    data received BEFORE that timer fires RESETS it (`onData` clears the pending timer and
    re-arms a fresh 100ms window) -- a process whose stdio keeps producing data every <100ms keeps
    pushing completion out, not merely waiting a single fixed 100ms from exit. `exec()` settles
    once the timer fires with no further data having reset it, OR once both stdout and stderr
    streams have independently ended/closed on their own, whichever happens first -- NOT once
    every inherited pipe descriptor, including ones held by unrelated detached descendant
    processes, has reached true EOF. A pinned Windows-only regression test
    (`nodejs-env.test.ts:379-400`) exists specifically to prove settlement in exactly the scenario
    where a detached descendant still holds inherited stdio open. This idle-grace mechanism is
    explicitly `ctx.shell`''s OWN layered concern, built on `ctx.subprocess`''s (`EXEC-005`)
    simpler primitives -- it is not part of `ctx.subprocess`''s own `wait()` contract, which
    settles on process exit alone, independent of stdio state.

    Result shape: a successful `exec()` returns `{stdout,stderr,exit_code}` regardless of whether
    `exit_code` is zero (confirmed, `env.exec("exit 7")` -> `Ok({...,exitCode:7})`,
    `nodejs-env.test.ts:448-449`) -- a non-zero exit is NOT itself a Result failure at this seam.

    Cleanup kills active commands (refined `L12-R017`, second final complete review,
    `minion-agent-docs#114`, convergence episode `CE-L12-01-03` -- reassigned here from `EXEC-002`,
    which misattributed this behavior to `ctx.fs`): `DIRECT_PI_PARITY`. `cleanup()` MUST kill the
    process tree of every command THIS provider instance currently has in flight (tracked
    internally, independent of `ctx.subprocess`''s own per-`Process` disposal, an unrelated,
    already-settled concern from `CE-L12-01-01`) and clear its own tracking; best-effort, MUST NOT
    raise, matching pinned Pi''s own combined `NodeExecutionEnv.cleanup()`, whose `activeChildPids`
    set is shared with `exec()`''s own spawned children (`nodejs.ts:429,691-694`). A command killed
    by `cleanup()` does NOT go through the `aborted`/`timeout` precedence machinery above at all --
    it settles through the ORDINARY exit-handling path, `exitCode: code ?? 0` (`nodejs.ts:495`).

    Settlement is CONDITIONAL, not unconditional zero (refined `L12-R017`, targeted closure review,
    `minion-agent-docs#114`, CE-L12-01-03 -- an earlier revision of this row overgeneralized the
    settlement to "unconditionally `exit_code: 0`," which pinned Pi does NOT state): `code` is
    whatever numeric exit code the killed child''s own `exit` event reports (`number | null`). If
    the child reports a real numeric exit code `K`, the caller observes
    `Ok({stdout,stderr,exit_code:K})`, PRESERVING `K` exactly; `0` is substituted ONLY when `code`
    is absent/null. Either case is a SUCCESS, never `aborted`/`timeout` -- cleanup-triggered
    termination never sets the abort signal or fires the timeout, regardless of which exit-code
    case occurs.

    Full detail: `spec/execution.md` §5, §5.1-§5.7.'

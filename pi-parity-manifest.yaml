  phase: 3
  pi: packages/agent/src/types.ts::QueueMode, packages/agent/src/agent.ts::PendingMessageQueue.drain
  surface: queue claim (drain) policy (assurance Layer 07)
  rule: 'pinned Pi''s QueueMode is exactly two values: "all" drains and returns every queued
    message at once, emptying the queue; "one-at-a-time" removes and returns only the single
    oldest queued message, leaving the remainder queued for a future claim. Each queue''s mode is
    independently configurable and defaults to "one-at-a-time" (`new PendingMessageQueue(mode)`,
    `steeringMode ?? "one-at-a-time"`, `followUpMode ?? "one-at-a-time"`). Minion''s ClaimPolicy
    (ALL / ONE_AT_A_TIME) reproduces this exactly -- verified directly against pinned Pi''s own
    `drain()` implementation, not inferred from ordinary queue conventions. Claiming an empty
    target returns nothing and is not an error. A drained inbox stays drained across repeated
    claims with no further enqueues (test_a_drained_inbox_stays_drained -- property-based). *When*
    a claim happens and which policy governs a given boundary at runtime is Layer 08''s decision;
    this row certifies only the primitive''s own behavior for either policy, independent of when or
    how often Layer 08 invokes it. Language-neutral canonical evidence (`L07-R004`, resolved this
    pass -- the independent review rejected the prior zero-canonical decision):
    agent-inbox-queue-mode-fifo.yaml exercises both policies, an empty claim, and enqueue-after-
    claim through the real `Inbox`, with no provider/tool/run-loop timing.'

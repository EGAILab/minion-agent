- id: EXEC-001
  phase: 6
  pi: 'packages/agent/src/harness/types.ts:128-176 (FileErrorCode/FileError, ExecutionErrorCode/
    ExecutionError); env/nodejs.ts:93-121 (toFileError, the concrete errno-to-code mapping)'
  surface: Layer 12, WP-12.1 -- the shared Result/error boundary across ctx.fs/ctx.shell, and the
    DIRECT_PI_PARITY FsErrorCode/ShellErrorCode taxonomies
  rule: 'REMEDIATED (independent Rust contract review, `L12-R004`/`L12-R008`, `minion-agent-docs
    #111`, review commit `092f63a5e3136f598fe1e508d4c60f6d8fe4dc17`; refined `L12-R015`, second
    final complete review, `minion-agent-docs#114`, convergence episode `CE-L12-01-03`): an
    execution seam normalizes every EXPECTED operational/environmental failure into a typed
    `Result` error. An unexpected OPERATIONAL backend failure that has no narrower mapping still
    normalizes (to `unknown`, matching pinned Pi''s own `toFileError` for any unrecognized errno) --
    unexpected does not mean exempt. A broken provider invariant, an impossible state transition, an
    assertion failure, or a programming error remains an exception/panic, INCLUDING when it
    originates from within a seam provider''s own implementation. `Result[T, E]` at these three
    seams; ordinary exceptions/panics everywhere else. This rule applies PER-OPERATION, not
    uniformly -- some operations have a documented SUCCESS value that itself reports an otherwise-
    unsuccessful outcome (a shell command''s own non-zero exit code is not a Result error at
    ctx.shell, `EXEC-004`); lifecycle/cleanup methods are explicitly exempt from returning Result
    at all. Exceptions (framework/provider bugs, never caller-handleable): invalid internal state,
    impossible state transition, an unnormalized backend exception escaping a seam (itself a
    provider bug), programming errors. Normalization from each language''s own native error
    primitives onto this SAME language-neutral taxonomy is the provider''s obligation, not the
    caller''s, and is implementation mechanics -- the resulting code taxonomy and which conditions
    map to which code are normative.

    Correction (`L12-R015`, CE-L12-01-03): an earlier revision of this row said every operation
    "never raises/rejects, including for unexpected backend failures" as an UNSCOPED universal
    claim, immediately followed by the SAME Exceptions list above -- the same universal-vs-scoped
    contradiction `L12-R004` found and fixed in `design/2026-08-20-minion-agent-design.md` §7. That
    earlier fix touched only the design document; this row''s own independent copy of the identical
    claim was never checked. Corrected above to the SAME scoped boundary, keeping all three
    documents (this row, the frozen design, `spec/execution.md` §2) in sync.

    FsErrorCode (DIRECT_PI_PARITY, `types.ts:132-140`): aborted | not_found | permission_denied |
    not_directory | is_directory | invalid | not_supported | unknown. Confirmed concrete mapping
    in the harness-tier reference implementation (`ABORT_ERR->aborted`, `ENOENT->not_found`,
    `EACCES`/`EPERM->permission_denied`, `ENOTDIR->not_directory`, `EISDIR->is_directory`,
    `EINVAL->invalid`, else `unknown`) -- the exact errno list is Node-specific mechanics; the
    CONDITIONS are the language-neutral contract.

    ShellErrorCode/ExecutionErrorCode (DIRECT_PI_PARITY, `types.ts:158-164`): aborted | timeout |
    shell_unavailable | spawn_error | callback_error | unknown. `callback_error` is a genuinely
    distinctive Pi behavior: a throwing `on_stdout`/`on_stderr` callback is caught, classifies the
    FAILURE as `callback_error`, and aborts the in-flight command as a side effect -- not merely
    skipped or logged (`nodejs.ts:462-468,474-478`).

    Correction (`L12-R004`): an earlier revision of this row listed "non-zero process exit" as a
    Result-error Value while `EXEC-004` correctly stated the opposite -- confirmed directly
    self-contradictory, and confirmed factually wrong against pinned Pi (`env.exec("exit 7")`
    returns `Ok({stdout:"",stderr:"",exitCode:7})`, `nodejs-env.test.ts:448-449`). It also listed
    "stale version" and "remote/backend unavailable" as Values with no corresponding declared code
    anywhere. All three removed; this row is now the sole source of truth for FsErrorCode/
    ShellErrorCode.

    Correction (`L12-R008`): the SubprocessErrorCode taxonomy previously lived on this row
    alongside two DIRECT_PI_PARITY taxonomies under one disposition, combining a direct-parity
    subject with a Minion-extension subject. Moved to `EXEC-005`, which owns `ctx.subprocess` in
    full, so this row now has one coherent subject and one defensible disposition.

    Full detail: `spec/execution.md` §2, §2.1, §2.2.'
  tests:
  - minion-agent-rust/crates/minion-agent/tests/execution_filesystem.rs
  - minion-agent-rust/crates/minion-agent/tests/execution_process.rs
  - minion-agent-rust/crates/minion-agent/tests/execution_shell.rs
  - minion-agent-python/tests/execution/test_errors.py
  python: 'minion-agent-python/src/minion_agent/execution/errors.py; typed boundary exercised by
    test_errors.py, test_filesystem.py, test_shell.py, and test_subprocess.py'
  rust: 'minion-agent-rust/crates/minion-agent/src/execution/error.rs; typed boundary exercised by
    execution_filesystem.rs, execution_process.rs, and execution_shell.rs'
  disposition: adopted
- id: EXEC-002
  phase: 6
  pi: 'packages/agent/src/harness/types.ts:222-283 (FileSystem); env/nodejs.ts:51-65
    (resolvePath), 359-694 (NodeExecutionEnv, the concrete filesystem operation behaviors);
    packages/agent/src/harness/session/jsonl/types.ts:4-18 (JsonlSessionRepoFileSystem, a real
    FileSystem-only Pi consumer)'
  surface: Layer 12, WP-12.1 -- ctx.fs (filesystem capability seam)
  rule: 'REMEDIATED (independent Rust contract review, `L12-R001`/`L12-R002`/`L12-R003`,
    `minion-agent-docs#111`; convergence episode `CE-L12-01-01`, `minion-agent-docs#113`,
    resolving refined `L12-R001`/`L12-R002`/`L12-R008` findings from a second independent review,
    `minion-agent-docs#112`). DIRECT_PI_PARITY for the operation set and each operation''s own
    observable behavior, with NO residual divergence (see cancellation below) -- a single coherent
    disposition. Operations: cwd; absolute_path; join_path; read_text_file;
    read_text_lines(max_lines?); read_binary_file; write_file; append_file; rename_file;
    file_info; list_dir; canonical_path; exists; create_dir(recursive=true);
    remove(recursive=false,force=false); create_temp_dir; create_temp_file; cleanup (best-effort,

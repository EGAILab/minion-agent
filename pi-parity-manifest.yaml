    Re-audited directly against pinned Pi source (`ref-repos/pi` @ `b7bb00b`,
    `agent.ts:544-591::processEvents`) this pass, in full, not merely re-cited: the reducer switch
    runs synchronously, then `for (const listener of this.listeners) { await listener(event,
    signal); }`. A JS `await` always defers its own continuation by at least one microtask turn,
    even for an already-settled/non-Promise operand -- this is a general JS-language property, not
    specific to `tool_execution_update` -- so pinned Pi''s own serial dispatch suspends between
    EVERY listener, unconditionally. Cross-checked against `runtime/events.py::EventBus.serial`
    and `_call` (`131-157`): `_call(callback, *args)` returns synchronously for a synchronous
    `callback` (no internal `await` reaches a genuine suspension), so `await self._call(...)`
    inside `serial()`''s own `for` loop does not yield to the event loop AT ALL when the listener
    performs no real async work -- a genuine, verified Python/JS `await`-semantics asymmetry
    (Python: awaiting a coroutine that itself never suspends completes with zero scheduler turns;
    JS: `await` always yields at least one microtask turn), not a bug in the PASS-8 candidate''s own
    otherwise-correct `eager_task_factory` usage.

    Remediation: `EventBus.serial` gained an additive, keyword-only `yield_after_each: bool = False`
    parameter (default `False`, every OTHER existing `serial()` caller''s own certified behavior
    unchanged -- confirmed by a full-codebase grep of every `.serial(` call site: `AgentLoop.
    _should_stop`''s own `AGENT_TURN_STOPPING` dispatch, `tests/conformance/runner.py`''s generic
    dispatch helper, and every existing `runtime/test_events_async.py`/`test_events_scoped.py` test
    all omit the new parameter and are unaffected, verified both by inspection and by the full,
    unchanged-elsewhere green test suite). When `True`, `asyncio.sleep(0)` -- Python''s own standard
    single-tick "yield to the event loop" idiom -- runs after every listener, unconditionally,
    verified standalone via two small reproduction scripts BEFORE integrating it (a two-listener
    case and a three-listener case, the latter confirming the yield is genuinely per-listener, not
    merely a single deferral after listener 1). `AgentLoop._dispatch_agent_event` is the one caller
    that passes `yield_after_each=True`, for `AGENT_LIFECYCLE_EVENT` specifically. This is a narrow,
    additive touch to a certified Layer-05 primitive (`spec/runtime.md` RT-016), documented there as
    an opt-in scheduling extension to `serial` dispatch, not a new dispatch mode and not a change to
    any other consumer''s own observable ordering/error/return-value contract.


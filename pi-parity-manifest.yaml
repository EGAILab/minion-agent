- id: AI-029
  phase: 2
  pi: packages/ai/src/models.ts::createProvider, apiFor, dispatch
  surface: model-to-implementation resolution and the unresolvable-identity boundary (Layer 10, provider abstraction)
  rule: 'Narrowed under `L10-R002` (an independent Rust contract review found the prior revision of
    this row mixed several different semantic subjects -- Pi resolution mapping, a Minion
    architectural simplification, and Minion-only registration/introspection extensions -- under one
    `adopted` disposition; the registration/withdrawal/introspection subject now has its own row,
    `AI-030`, with its own coherent disposition). This row now covers ONLY: how a request''s model
    identity resolves to an implementation, and what happens when it does not.

    Disposition corrected (convergence `C10-C001`/`L10-R002`, repeated finding): this row''s OWN
    text already characterized Minion''s single eager `UnknownModelError` check as "an intentional,
    disclosed Minion architectural SIMPLIFICATION of Pi''s two-level Provider/api-map structure, not
    a literal mechanical port" -- that is a description of `intentional divergence`, not `adopted`.
    Pi observably distinguishes two failure cases (no `Provider` selected at all, vs. a selected
    `Provider` with no implementation for this model''s `api`, the latter reported IN-BAND via
    `ModelsError`) where Minion observably collapses both into one EAGER check; master design''s own
    eager/lazy boundary authorizes the collapse, but authorization is not the same claim as "matches
    Pi''s own observable behavior." An earlier revision of this row asserted `adopted` anyway, which
    is the same category of defect `AI-030` was split out to fix for the registration subject --
    this row''s own text had already correctly reasoned through the divergence without correcting
    its own `disposition:` field to match.

    Pinned Pi''s own model-resolution mechanism, re-read directly (`models.ts:735-812`): a
    `Provider` is built once via `createProvider({..., api})`, where `api` is EITHER a single
    `ProviderStreams` (every model this provider serves uses the one implementation) OR a map keyed
    by `model.api` (`Partial<Record<TApi, ProviderStreams>>`, for a provider whose own models span
    more than one wire protocol). `apiFor(model)` resolves which `ProviderStreams` a given `model`
    uses; `dispatch()` calls `apiFor(model)` and, finding no entry, returns an IN-BAND stream error
    (`lazyStream(..., throw new ModelsError(...))`) rather than raising eagerly -- Pi represents
    "this provider has no implementation for this model''s own api" as a never-raises-contract
    failure, not a caller-eager one. A SEPARATE, earlier step -- outside `packages/ai/src/types.ts`/
    `models.ts` (the CLI/config layer that builds a `Models` collection from `models.json`/built-in
    catalogs) -- is what would reject a genuinely UNKNOWN model id before any `Provider`/`stream`
    call happens at all; that earlier step is Minion-architecturally out of scope (Minion has no
    config-driven model catalog of its own -- callers register concrete adapters directly, see
    `AI-030`).

    Minion''s own `LlmService.stream()` (`llm/service.py`) looks a FULL `(provider, model, api)`
    triple up in its own registry (`AI-030` owns how entries get there) and raises
    `UnknownModelError` EAGERLY (`llm/errors.py`) when absent -- collapsing what Pi splits into "no
    Provider selected for this model at all" (a config-layer question Minion does not have) and
    "this Provider has no implementation for this model''s own api" (Pi''s own IN-BAND `ModelsError`
    case) into ONE eager check. This is an intentional, disclosed Minion architectural
    SIMPLIFICATION of Pi''s two-level Provider/api-map structure, not a literal mechanical port:
    master design §4''s own eager/lazy boundary authorizes it (unresolvable-model is explicitly
    framed there as "a caller bug, discoverable immediately," matching Minion''s own eager check, not
    Pi''s in-band one for the narrower "wrong api for this provider" sub-case).

    Rust status, re-confirmed by direct source read this pass: `minion-agent-rust/crates/
    minion-agent/src/llm/service.rs::LlmService::stream` correctly performs an eager, typed
    `LlmStartError::UnknownModel` rejection for an absent registry key BEFORE ever invoking an
    adapter -- this specific behavior (resolution and the unresolvable-identity boundary) IS
    already satisfied by current Rust, independently confirmed against source, not merely asserted.
    `LlmStartError::AdapterStart` (a DIFFERENT case -- a RESOLVED identity whose own adapter then
    fails) is `AI-028`''s own separate, currently-OPEN concern, not this row''s.'
  tests:
  - llm-service-registration-and-replacement.yaml (new, Layer 10 -- never_registered_identity_is_unresolvable query is this row's own direct discriminating evidence for the eager-unknown-identity boundary, exercised without an Agent loop in the way)
  - 'llm-service-resolve-ownership-survives-replacement.yaml (new, Layer 10 -- `L10-R004`/`C10-C004`''s own discriminating witness for the canonical runner''s own `resolve` query: a value-equality ownership search previously reported a REPLACED adapter as the owner instead of its replacement; the fixed runner''s count-delta-with-exactly-one-owner design reports correctly)'
  - eager-invalid-model-fails-before-stream (already certified under AI-012/LLM-018)
  python: src/minion_agent/llm/service.py::LlmService.stream (resolution + eager UnknownModelError); src/minion_agent/llm/errors.py::UnknownModelError
  rust: 'minion-agent-rust/crates/minion-agent/src/llm/service.rs::LlmService::stream (eager UnknownModel rejection) -- CONFIRMED satisfied by direct source read this pass, narrowly for the resolution/unresolvable-identity behavior only; AdapterStart handling is AI-028''s own separate, open concern'
  disposition: intentional divergence
- id: AI-030
  phase: 2
  pi: 'packages/ai/src/models.ts::MutableModels (setProvider/deleteProvider/clearProviders,
    getProviders/getProvider/getModels/getModel); packages/ai/src/compat.ts::ApiProvider registry
    (registerApiProvider/unregisterApiProviders) and registerFauxProvider;
    packages/ai/src/providers/faux.ts::FauxProviderRegistration.unregister -- three real,
    currently-live Pi registration surfaces (see `rule:` below for the full comparison), none of
    which Minion''s own registry directly adopts (`L10-R005`, corrected from an earlier revision''s
    false "Pi has no adapter-registration concept at all" premise).'
  surface: adapter registration, replacement, withdrawal, and introspection (Layer 10, provider abstraction)
  rule: 'Split out of `AI-029` under `L10-R002` (an independent Rust contract review correctly found
    this Minion-only registration surface did not belong under the SAME `adopted` disposition as
    `AI-029`''s own genuinely Pi-motivated resolution mapping). Three real Pi registration surfaces
    exist (`L10-R005`, see below) but Minion directly adopts NONE of them, so a Minion architectural
    extension is still the right treatment to disclose coherently, the same treatment `AG-011`
    already gives `Inbox.inject`.

    Pi-source comparison corrected (`L10-R005`, convergence checkpoint
    `10-provider-abstraction-contract-checkpoint-r005-r007-convergence.md`, revision 2,
    `AGREED FOR IMPLEMENTATION`; an earlier revision of this row falsely claimed Pi has no
    adapter-registration concept at all). Pinned Pi exposes THREE real, currently-live registration
    surfaces this row now compares itself against honestly:

    1. `models.ts::MutableModels.setProvider(provider)` -- keyed by `provider.id` alone (no model/
    api component); a WHOLE-PROVIDER upsert, the new `Provider`''s own `getModels()` entirely
    REPLACES whatever that provider id previously exposed, with no per-model merge.
    `deleteProvider(id)`/`clearProviders()` remove at the same whole-provider granularity;
    `getProviders`/`getProvider`/`getModels`/`getModel` are the introspection surface. Current,
    forward Pi architecture.

    2. `compat.ts`''s generic `registerApiProvider(provider, sourceId?)`/`unregisterApiProviders
    (sourceId)` -- keyed by `provider.api` (a single api string, one module-level `Map`), also
    last-write-wins; `unregisterApiProviders(sourceId)` removes EVERY entry whose own recorded
    `sourceId` matches the given tag, a bulk, tag-scoped removal at this generic-primitive level.
    This module is Pi''s own explicitly TEMPORARY compatibility surface (its own docstring:
    "deleted with the coding-agent ModelManager migration") -- live in the pinned revision, not
    Pi''s forward direction.

    3. `compat.ts::registerFauxProvider(options)`, built on top of (2): generates a fresh,
    pseudo-random `sourceId` on EVERY call -- NOT collision-checked, so this text does not claim
    mathematically guaranteed uniqueness, only that each call''s own tag is freshly generated and
    normally distinct -- registers through `registerApiProvider(..., sourceId)`, and returns a
    `FauxProviderRegistration` (`providers/faux.ts:132-141`) whose own public `unregister()` method
    closes over THAT call''s own tag and calls `unregisterApiProviders(sourceId)` with it. For the
    observed distinct-tag case (the normal case, since tags are freshly generated per call), this
    IS a live, direct per-registration-call unregistration precedent on Pi''s OWN faux/mock
    provider surface -- the exact scope this row concerns itself with -- even though it is a thin
    per-call convention layered over (2)''s bulk-tag-scoped primitive, not a separate registry
    mechanism.

    Stale/superseded removal for (2)/(3) depends on TAG IDENTITY, not call order alone: registering
    `api=x` under `source=A` then `source=B`, then unregistering `source=A`, leaves B''s own entry
    untouched (the current entry''s tag no longer matches A) -- the SAME safe outcome Minion''s own
    rule gives, for the observed distinct-tag case (3) normally is; registering `api=x` under the
    SAME `source=S` twice, then unregistering `source=S`, removes the current entry (tags coincide)
    -- a deliberate bulk/current-entry removal, the outcome IF a caller ever reused one tag across
    calls at the generic-primitive level (2), which `registerFauxProvider` itself never does.

    Minion''s own `LlmService` matches NONE of the three: it keys per FULL `(provider, model, api)`
    identity (finer-grained than any of the three, which key on a single string), replaces per KEY
    rather than per whole provider/api (two Minion adapters sharing a `provider` id but declaring
    different models COEXIST, unlike (1)''s wholesale swap), and makes per-call ownership the
    GENERIC registration rule -- EVERY `register()` call gets its own handle unconditionally --
    rather than a faux-specific convention layered over a bulk-tag-scoped primitive the way (3)
    achieves its own per-call safety. (3) is a genuine, narrower Pi precedent for per-call safety
    specifically on Pi''s OWN mock-provider surface; it does not by itself justify Minion''s own
    broader, generic granularity/composition/introspection differences from (1)/(2), each of which
    remains a deliberate, disclosed divergence.

    Governance (`§11.7`, DECIDED): the repository owner APPROVED continuing Minion''s existing
    registry semantics as an intentional divergence, explicitly scoped to this row''s own
    registration/replacement/withdrawal/introspection granularity, against exactly the
    three-surface comparison above -- full decision text recorded in the convergence checkpoint''s
    own `GOVERNANCE DECISION (§11.7) -- RECORDED` section. Redesign toward any of the three Pi
    surfaces is NOT required.

    `LlmService.register(adapter)` (`llm/service.py`) populates one registry entry per model the
    adapter declares in its own `adapter.models`, keyed by the full `(adapter.provider, model,
    adapter.api)` triple, and returns a withdrawal handle (a bound closure) scoped to EXACTLY the
    entries that specific `register()` CALL added. A later `register()` call for the SAME key
    intentionally REPLACES the earlier entry in place (not an accidental collision -- confirmed and
    already tested, `test_a_later_adapter_replaces_an_earlier_one_for_the_same_model`). Calling an
    EARLIER registration''s own withdrawal handle after a LATER `register()` call has already
    replaced that same key is a SAFE NO-OP.

    Ownership is per REGISTRATION CALL, not per adapter OBJECT (`C10-C005`, convergence remediation
    of a genuine PASS-2 production defect, not merely a documentary correction): each `register()`
    call stores a fresh, opaque per-call token alongside its adapter, and the returned handle''s own
    withdrawal closure checks that TOKEN, not adapter-object identity, before deleting an entry. An
    earlier revision checked `self._adapters.get(model_id) is adapter` alone, which conflates
    "adapter object identity" with "registration call identity" -- correct only when a given adapter
    object is registered at most once. Registering the IDENTICAL adapter object twice under two
    SEPARATE `register()` calls must give each call independent ownership of its own entry; the old
    identity check could not distinguish the two calls, so the FIRST call''s own handle could
    incorrectly remove the SECOND call''s own live entry (an independent Rust contract review''s own
    executed witness: `register(a)` twice, `models()` shows one entry, withdrawing the first handle
    incorrectly dropped it to zero instead of leaving the second registration live).

    Withdrawal is IDEMPOTENT and safely repeat-callable, both for a handle used more than once and
    for a handle superseded by a later registration: the first successful call to a given handle
    deletes the entry it still owns outright; every subsequent call to that SAME handle -- whether
    because the caller invoked it twice, or because a later `register()` call has since replaced its
    entry -- finds no matching token and does nothing. This is a BINDING, non-negotiable observable
    rule (convergence agreement, binding implementation clarification): a Rust implementation MAY
    choose any mechanism it likes to enforce per-call ownership, but a consuming, move-only handle
    type that makes a second call to an already-withdrawn handle a COMPILE error rather than a
    runtime no-op would NOT satisfy this row, because it would make the agreed idempotent-repeat-
    withdrawal observation impossible to express at all.

    The canonical scenario grammar addresses registration by HANDLE id, not by fixture id (Layer-10
    canonical `llm_service` scenarios: a `register` step is `{adapter: <fixture id>, as: <handle
    id>}`, and a `withdraw` step names the `as` handle id a prior `register` step declared, never an
    adapter fixture directly) -- this mirrors the production API''s own handle-returning shape above
    and lets a scenario express two independent handles for the SAME adapter fixture, which a bare
    fixture-id-addressed grammar could not.

    `LlmService.models()` returns every currently resolvable `(provider, model, api)` triple --
    Minion''s own minimal introspection surface, at the SAME full-identity granularity as the rest
    of this row (not any of the three Pi surfaces'' own coarser keys above). Pi''s own
    `MutableModels.getProviders`/`getProvider`/`getModels`/`getModel` and `compat.ts`''s own
    `getApiProvider`/`getApiProviders` are real, directly-comparable introspection surfaces (not
    "no analogue"), but each exposes richer catalog/refresh semantics at ITS OWN coarser key --
    dynamic model overlays, credential-scoped filtering -- this project does not need yet, since
    Minion has no config-driven provider catalog of its own.

    `models()`''s own return order is explicitly NOT part of the observable contract -- any
    implementation may return identities in any order. The CANONICAL EVIDENCE FORMAT requires ONE
    specific canonicalization, for tooling reasons only: a conformance runner''s own `introspect:
    models` observation, in ANY language, MUST be reported sorted by `(provider, model, api)`
    before comparing against `expect.models` (`L10-C001`, an independent Rust closure review''s own
    finding: a prior Rust conformance runner instead trusted `LlmService::models()``''s own raw
    return order directly, which happened to be sorted by the DIFFERENT key `(provider, api,
    model)` -- undetected by any of the first seven canonical scenarios, none of which registered
    more than one identity whose own `api`/`model` values cross under the two keys; the new
    `llm-service-introspection-order-does-not-depend-on-api-first-sort.yaml` scenario is the
    permanent discriminating witness for this rule).

    Rust status, corrected (`L10-R002`, an earlier revision of the since-split `AI-029` falsely
    claimed this surface needed no new Rust requirement): current
    `minion-agent-rust/crates/minion-agent/src/llm/service.rs::LlmService::register` takes ONE
    `(ModelIdentity, Arc<dyn LlmAdapter>)` pair per call (not an adapter-declared model SET the way
    Python''s own `register(adapter)` iterates `adapter.models`), performs last-write replacement via
    a plain `HashMap::insert` (satisfying the REPLACEMENT half of this row, confirmed by direct
    source read), but has NO withdrawal handle of any kind, NO stale-withdrawal protection (there is
    nothing to protect since there is no withdrawal at all), and NO `models()` introspection. This
    row''s registration/replacement half is therefore partially satisfied by current Rust; its
    withdrawal and introspection halves are OPEN, disclosed gaps, not silently claimed complete.
    Remediation (if the project wants Rust to match this row''s full surface) is a future Rust
    implementation pass'' own decision, not certified here.'
  tests:
  - llm-service-registration-and-replacement.yaml (new, Layer 10 -- same-identity replacement, different-identity independence)

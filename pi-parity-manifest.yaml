- id: AG-021
  phase: 3
  pi: packages/agent/src/agent-loop.ts::runLoop
  surface: represented assistant error/aborted is immediately terminal (L08-R008)
  rule: 'Layer 08, PASS 3, closing a gap the independent Rust review of the PASS-2 candidate caught
    (`L08-R008`): confirmed directly against source (agent-loop.ts:196-200), immediately after
    `streamAssistantResponse` returns, pinned Pi checks
    `if (message.stopReason === "error" || message.stopReason === "aborted")` and, when true, emits
    that turn''s own `turn_end` with empty `toolResults` and returns immediately -- running NONE of
    `prepareNextTurn`/`shouldStopAfterTurn`/the steering or follow-up poll for that turn. No tool
    calls are ever inspected or executed for a message representing its own failure, even if the
    model''s response happened to include tool-call content blocks.

    PASS 2''s own implementation collapsed this into the same branch as an ordinary
    no-more-tool-calls stop, running the full post-turn sequence regardless of `stop_reason` -- this
    pass adds an explicit `_StepResult.terminal` flag `_run_step` sets when
    `reply.stop_reason in (ERROR, ABORTED)`, and `_run_inner` returns immediately on `terminal`,
    before ever calling `_prepare_next_turn`/`_should_stop`/claiming steering or follow-up.
    Discriminating evidence installs listeners on all four skipped hooks/queues and proves none is
    invoked/consumed for both `error` and `aborted`
    (`test_represented_error_skips_prepare_stop_steering_and_follow_up`,
    `test_represented_aborted_skips_prepare_stop_steering_and_follow_up`) -- the steering-queued
    case specifically proves the STEADY-STATE poll never fires by queuing from within a live
    `AGENT_LIFECYCLE_EVENT` listener watching for this exact turn''s own `TurnEnd` (`AG-009`),
    dispatched immediately before `_run_step` returns its terminal result to `_run_inner`. PASS 4
    replaced this row''s own earlier evidence mechanism (queuing during the INITIAL pre-step
    dispatch), which PASS 3''s `L08-R006` fix made obsolete: since the initial steering claim is now
    admitted before the first turn ever runs at all (`AG-002`), queuing during that dispatch would
    be claimed regardless of this turn''s eventual outcome and would no longer discriminate anything
    about R008 specifically -- queuing at this turn''s own live `TurnEnd` instead guarantees the
    message is queued strictly after any admission this turn could possibly have done, so it is
    genuinely at risk only of the poll this row certifies never
    reaches it.

    Uses the run''s own NORMAL `new_messages` accumulator for `agent_end.messages`, confirmed
    directly against source (agent-loop.ts:199 uses `newMessages`, not a synthesized array) --
    DISTINCT from `AG-010`''s own `handleRunFailure` override, an unrelated mechanism for an
    unexpected THROWN exception, never for a normally-produced represented-error message
    (`test_represented_error_agent_end_messages_uses_the_normal_accumulator`). This is Layer-08
    terminal handling only -- no active abort propagation (Layer 09, `AG-007`) is implemented here.'
